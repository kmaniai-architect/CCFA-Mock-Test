<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAO-F Mock Exam Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens lifted from claudecertificationguide.com (HSL triplets) */
:root{
  --background:211 8% 98%;--foreground:211 5% 10%;--card:211 10% 94%;--popover:0 0% 100%;
  --primary:211 60% 30%;--primary-foreground:0 0% 100%;--secondary:211 30% 38%;
  --muted:211 6% 95%;--muted-foreground:211 17% 28%;--accent:211 5% 93%;
  --border:211 15% 72%;--ring:208 27% 51%;--radius:0.125rem;
  --surface-lowest:0 0% 100%;--surface-low:211 9% 94%;--surface-container:211 8% 92%;--surface-high:211 7% 89%;--surface-brand:210 30% 85%;
  --primary-container:209 37% 63%;--on-primary-container:211 60% 17%;
  --success:161 94% 24%;--success-subtle:152 81% 96%;--warning:38 92% 50%;--warning-subtle:48 100% 96%;--warning-emphasis:26 90% 37%;
  --destructive:0 72% 51%;--destructive-subtle:0 86% 97%;--destructive-emphasis:0 74% 42%;
  --feature:212 54% 15%;--feature-foreground:0 0% 100%;--feature-muted:211 39% 80%;
  --d1:217 91% 60%;--d2:160 84% 39%;--d3:258 90% 66%;--d4:38 92% 50%;--d5:350 89% 60%;--d6:178 42% 45%;--d7:243 75% 59%;
  --font-sans:"Inter",system-ui,sans-serif;--font-display:"Space Grotesk","Inter",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;
}
:root[data-theme="dark"]{
  --background:211 27% 8%;--foreground:211 33% 90%;--card:211 22% 11%;--popover:211 20% 6%;
  --primary:212 70% 79%;--primary-foreground:211 45% 11%;--secondary:208 30% 78%;
  --muted:211 19% 13%;--muted-foreground:211 15% 79%;--accent:211 12% 17%;--border:211 15% 18%;--ring:208 34% 73%;
  --surface-lowest:211 25% 5%;--surface-low:211 22% 11%;--surface-container:211 19% 13%;--surface-high:211 12% 17%;--surface-brand:211 30% 20%;
  --on-primary-container:211 60% 12%;
  --success:152 70% 55%;--success-subtle:160 40% 12%;--warning-subtle:38 40% 13%;--warning-emphasis:38 92% 60%;
  --destructive:0 80% 68%;--destructive-subtle:0 35% 14%;--destructive-emphasis:0 85% 72%;
  --feature:212 54% 12%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:211 27% 8%;--foreground:211 33% 90%;--card:211 22% 11%;--popover:211 20% 6%;
    --primary:212 70% 79%;--primary-foreground:211 45% 11%;--secondary:208 30% 78%;
    --muted:211 19% 13%;--muted-foreground:211 15% 79%;--accent:211 12% 17%;--border:211 15% 18%;--ring:208 34% 73%;
    --surface-lowest:211 25% 5%;--surface-low:211 22% 11%;--surface-container:211 19% 13%;--surface-high:211 12% 17%;--surface-brand:211 30% 20%;
    --on-primary-container:211 60% 12%;
    --success:152 70% 55%;--success-subtle:160 40% 12%;--warning-subtle:38 40% 13%;--warning-emphasis:38 92% 60%;
    --destructive:0 80% 68%;--destructive-subtle:0 35% 14%;--destructive-emphasis:0 85% 72%;
    --feature:212 54% 12%;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:hsl(var(--primary-container));color:hsl(var(--on-primary-container))}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.02em;line-height:1.2}
h1{font-size:40px;letter-spacing:-.6px}h2{font-size:28px;letter-spacing:-.4px}h3{font-size:22px}
p{margin:0 0 .8em}
a{color:hsl(var(--primary))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
.hidden{display:none!important}
/* header */
header.top{position:sticky;top:0;z-index:50;background:hsl(var(--surface-lowest));border-bottom:1px solid hsl(var(--border))}
.top-in{max-width:1760px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;color:hsl(var(--foreground));text-decoration:none}
.brand i{width:12px;height:12px;background:hsl(var(--primary));display:inline-block}
.brand small{font-family:var(--font-mono);font-weight:500;font-size:12px;color:hsl(var(--muted-foreground));border:1px solid hsl(var(--border));padding:1px 6px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:12px}
nav.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;color:hsl(var(--muted-foreground));border-radius:var(--radius)}
nav.tabs button:hover{background:hsl(var(--surface-container));color:hsl(var(--foreground))}
nav.tabs button[aria-current="true"]{color:hsl(var(--primary));box-shadow:inset 0 -2px 0 hsl(var(--primary))}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;height:40px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));color:hsl(var(--foreground));font-size:14px;font-weight:500;cursor:pointer;border-radius:var(--radius);transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:hsl(var(--surface-container))}
.btn:active{transform:scale(.98)}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary))}
.btn.primary:hover{filter:brightness(1.12)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1200px;margin:auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:hsl(var(--muted-foreground))}
.lede{font-size:19px;color:hsl(var(--muted-foreground));max-width:70ch}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));padding:20px;border-radius:var(--radius)}
.card.flat{background:hsl(var(--surface-lowest))}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.03em}
.stat-l{font-size:13px;color:hsl(var(--muted-foreground))}
.feature{background:hsl(var(--feature));color:hsl(var(--feature-foreground));padding:32px;border-radius:var(--radius)}
.feature .lede{color:hsl(var(--feature-muted))}
.feature .btn{border-color:transparent}
/* domain chips */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
.d1{--c:var(--d1)}.d2{--c:var(--d2)}.d3{--c:var(--d3)}.d4{--c:var(--d4)}.d5{--c:var(--d5)}.d6{--c:var(--d6)}.d7{--c:var(--d7)}
.dot{background:hsl(var(--c))}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:12px;padding:2px 8px;border:1px solid hsl(var(--c)/.55);background:hsl(var(--c)/.1);border-radius:var(--radius)}
/* setup */
.dom{border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));margin-bottom:10px;border-radius:var(--radius);border-left:4px solid hsl(var(--c))}
.dom-h{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.dom-h b{font-family:var(--font-display);font-size:17px}
.dom-h .w{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:hsl(var(--muted-foreground))}
.dom-b{padding:0 16px 12px 42px;display:grid;gap:4px}
.dom-b label,.dom-h label{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:hsl(var(--primary));width:17px;height:17px}
.seg{display:flex;border:1px solid hsl(var(--border));width:max-content;max-width:100%;border-radius:var(--radius);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:hsl(var(--surface-lowest));padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
input[type=number],input[type=search],input[type=text]{height:40px;padding:0 12px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));border-radius:var(--radius)}
/* quiz */
.qwrap{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:start}
@media(max-width:900px){.qwrap{grid-template-columns:1fr}h1{font-size:32px}}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.timer{font-family:var(--font-mono);font-weight:500;padding:4px 10px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest))}
.timer.low{color:hsl(var(--destructive-emphasis));border-color:hsl(var(--destructive))}
.stem{font-size:19px;line-height:1.55;margin-bottom:20px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));cursor:pointer;border-radius:var(--radius);font-size:16px;line-height:1.5}
.opt:hover:not(:disabled){border-color:hsl(var(--primary));background:hsl(var(--surface-brand)/.5)}
.opt .k{font-family:var(--font-mono);font-weight:500;width:26px;height:26px;border:1px solid hsl(var(--border));display:grid;place-items:center;flex:none;font-size:13px}
.opt.sel{border-color:hsl(var(--primary));background:hsl(var(--surface-brand)/.6);box-shadow:inset 3px 0 0 hsl(var(--primary))}
.opt.sel .k{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary))}
.opt.ok{border-color:hsl(var(--success));background:hsl(var(--success-subtle));box-shadow:inset 3px 0 0 hsl(var(--success))}
.opt.ok .k{background:hsl(var(--success));color:#fff;border-color:hsl(var(--success))}
.opt.bad{border-color:hsl(var(--destructive));background:hsl(var(--destructive-subtle));box-shadow:inset 3px 0 0 hsl(var(--destructive))}
.opt.bad .k{background:hsl(var(--destructive));color:#fff;border-color:hsl(var(--destructive))}
.opt:disabled{cursor:default}
.nav{position:sticky;top:84px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal button{height:34px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));font-family:var(--font-mono);font-size:12px;cursor:pointer;border-radius:var(--radius);position:relative}
.pal button.ans{background:hsl(var(--surface-brand));border-color:hsl(var(--primary))}
.pal button.cur{outline:2px solid hsl(var(--primary));outline-offset:1px}
.pal button.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;background:hsl(var(--warning))}
.pal button.ok{background:hsl(var(--success-subtle));border-color:hsl(var(--success))}
.pal button.bad{background:hsl(var(--destructive-subtle));border-color:hsl(var(--destructive))}
.explain{margin-top:18px;border:1px solid hsl(var(--border));border-left:4px solid hsl(var(--primary));background:hsl(var(--surface-lowest));padding:16px 18px;border-radius:var(--radius)}
.explain h3{font-size:16px;margin-bottom:6px}
.src{margin-top:12px;padding:12px 14px;background:hsl(var(--card));border:1px solid hsl(var(--border));font-size:14px;line-height:1.55;white-space:pre-line;border-radius:var(--radius)}
.src .m{font-family:var(--font-mono);font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src mark{background:hsl(var(--warning)/.3);color:inherit;padding:0 1px}
.bar{height:10px;background:hsl(var(--surface-high));border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;background:hsl(var(--c,var(--primary)))}
.score{font-family:var(--font-display);font-size:72px;font-weight:700;letter-spacing:-.04em;line-height:1}
.pass{color:hsl(var(--success))}.fail{color:hsl(var(--destructive-emphasis))}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid hsl(var(--border))}
th{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground));font-weight:500}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mt{margin-top:24px}.mt2{margin-top:40px}
.note{font-size:14px;color:hsl(var(--muted-foreground))}
@media(max-width:640px){body{font-size:16px}main{padding:20px 16px 60px}.top-in{padding:10px 16px}.stem{font-size:17px}.score{font-size:56px}}
</style>
</head>

<script>
const DOMAINS={"1": {"name": "Prompting and Task Execution", "w": 14}, "2": {"name": "Output Evaluation and Validation", "w": 21}, "3": {"name": "Product and Model Selection", "w": 12}, "4": {"name": "Workflow Integration and Solution Design", "w": 16}, "5": {"name": "Configuration and Knowledge Management", "w": 12}, "6": {"name": "Governance, Risk, and Responsible Use", "w": 15}, "7": {"name": "Troubleshooting and Optimisation", "w": 10}};
const LESSONS=[{"id": "1.1", "d": 1, "title": "Creating Effective Prompts for Business and Technical Tasks", "url": "https://claudecertificationguide.com/ccao-f/learn/1-prompting-task-execution/1-1-effective-prompts"}, {"id": "1.2", "d": 1, "title": "Decomposing Complex Requests", "url": "https://claudecertificationguide.com/ccao-f/learn/1-prompting-task-execution/1-2-task-decomposition"}, {"id": "1.3", "d": 1, "title": "Iterating Prompts to Improve Output", "url": "https://claudecertificationguide.com/ccao-f/learn/1-prompting-task-execution/1-3-prompt-iteration"}, {"id": "1.4", "d": 1, "title": "Adapting Strategy to Task Type", "url": "https://claudecertificationguide.com/ccao-f/learn/1-prompting-task-execution/1-4-task-type-strategies"}, {"id": "2.1", "d": 2, "title": "Evaluating Outputs for Accuracy and Completeness", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-1-accuracy-completeness"}, {"id": "2.2", "d": 2, "title": "Identifying Hallucinations, Inconsistencies and Bias", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-2-hallucinations-inconsistencies-bias"}, {"id": "2.3", "d": 2, "title": "Fact-Checking and Validation Techniques", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-3-fact-checking-validation"}, {"id": "2.4", "d": 2, "title": "When Human Review or Additional Verification Is Required", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-4-human-review-escalation"}, {"id": "2.5", "d": 2, "title": "Editing, Adapting and Comparing Outputs for the Audience", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-5-editing-adapting-outputs"}, {"id": "2.6", "d": 2, "title": "Curating Information and Selecting Output Formats", "url": "https://claudecertificationguide.com/ccao-f/learn/2-output-evaluation/2-6-output-formats-curation"}, {"id": "3.1", "d": 3, "title": "Selecting the Right Claude Product Feature", "url": "https://claudecertificationguide.com/ccao-f/learn/3-product-model-selection/3-1-product-feature-selection"}, {"id": "3.2", "d": 3, "title": "Differentiating Between Claude Model Types", "url": "https://claudecertificationguide.com/ccao-f/learn/3-product-model-selection/3-2-model-tiers"}, {"id": "3.3", "d": 3, "title": "Aligning Model Choice with Cost, Speed and Quality", "url": "https://claudecertificationguide.com/ccao-f/learn/3-product-model-selection/3-3-cost-speed-quality"}, {"id": "3.4", "d": 3, "title": "Managing Context Limits and Memory: Restart, Summarise, Persist", "url": "https://claudecertificationguide.com/ccao-f/learn/3-product-model-selection/3-4-context-and-memory-management"}, {"id": "4.1", "d": 4, "title": "Analysing Requirements and Use Cases", "url": "https://claudecertificationguide.com/ccao-f/learn/4-workflow-integration/4-1-requirements-and-use-cases"}, {"id": "4.2", "d": 4, "title": "Using Claude for Research, Planning and Process Optimisation", "url": "https://claudecertificationguide.com/ccao-f/learn/4-workflow-integration/4-2-research-planning-optimisation"}, {"id": "4.3", "d": 4, "title": "Supporting Solution Design, Development and Iteration", "url": "https://claudecertificationguide.com/ccao-f/learn/4-workflow-integration/4-3-solution-design-iteration"}, {"id": "4.4", "d": 4, "title": "Integrating Claude into Existing Workflows", "url": "https://claudecertificationguide.com/ccao-f/learn/4-workflow-integration/4-4-integrating-existing-workflows"}, {"id": "4.5", "d": 4, "title": "Communicating Value and Limitations to Stakeholders", "url": "https://claudecertificationguide.com/ccao-f/learn/4-workflow-integration/4-5-communicating-value-limitations"}, {"id": "5.1", "d": 5, "title": "Configuring Projects with Instructions and Knowledge Sources", "url": "https://claudecertificationguide.com/ccao-f/learn/5-configuration-knowledge/5-1-project-instructions-knowledge"}, {"id": "5.2", "d": 5, "title": "Managing Uploaded Knowledge and Connectors", "url": "https://claudecertificationguide.com/ccao-f/learn/5-configuration-knowledge/5-2-uploads-and-connectors"}, {"id": "5.3", "d": 5, "title": "Creating Effective System-Level Instructions", "url": "https://claudecertificationguide.com/ccao-f/learn/5-configuration-knowledge/5-3-system-level-instructions"}, {"id": "5.4", "d": 5, "title": "Informing, Maintaining, and Updating Configurations", "url": "https://claudecertificationguide.com/ccao-f/learn/5-configuration-knowledge/5-4-maintaining-configurations"}, {"id": "6.1", "d": 6, "title": "Identifying Appropriate and Inappropriate Use Cases", "url": "https://claudecertificationguide.com/ccao-f/learn/6-governance-responsible-use/6-1-appropriate-use-cases"}, {"id": "6.2", "d": 6, "title": "Applying Data Sensitivity, Regulatory and Privacy Considerations", "url": "https://claudecertificationguide.com/ccao-f/learn/6-governance-responsible-use/6-2-data-sensitivity-privacy"}, {"id": "6.3", "d": 6, "title": "Following Organisational AI Policies and Governance Standards", "url": "https://claudecertificationguide.com/ccao-f/learn/6-governance-responsible-use/6-3-organisational-ai-policies"}, {"id": "6.4", "d": 6, "title": "Understanding the Ethical Implications of AI Usage", "url": "https://claudecertificationguide.com/ccao-f/learn/6-governance-responsible-use/6-4-ethical-implications"}, {"id": "7.1", "d": 7, "title": "Diagnosing and Resolving Underperforming Prompts and Poor Outputs", "url": "https://claudecertificationguide.com/ccao-f/learn/7-troubleshooting-optimisation/7-1-diagnosing-poor-outputs"}, {"id": "7.2", "d": 7, "title": "Adjusting Your Approach Based on Feedback and Results", "url": "https://claudecertificationguide.com/ccao-f/learn/7-troubleshooting-optimisation/7-2-adjusting-from-feedback"}, {"id": "7.3", "d": 7, "title": "Optimising Workflows for Efficiency and Effectiveness", "url": "https://claudecertificationguide.com/ccao-f/learn/7-troubleshooting-optimisation/7-3-optimising-workflows"}];
const KB=[{"i": 0, "l": "1.1", "d": 1, "h": "What You Need to Know", "t": "A prompt is the brief that you give Claude: the task and everything that Claude needs to do it. Briefing well is not a technical skill. It is the same skill that you use when you delegate work to a colleague. Every other objective in this certification depends on it. A good brief gives the other six domains something to work with. No feature, model choice or troubleshooting step fixes a bad brief.\nThis lesson uses one made-up example throughout: a roofing firm. Its office manager wants Claude to draft a one-page update on this month's jobs for the firm's two directors. The one-line version of this prompt is \"write something about this month's jobs\"."}, {"i": 1, "l": "1.1", "d": 1, "h": "The Briefing Mindset", "t": "Anthropic's guidance is to treat Claude as a brilliant but new employee. This employee is highly capable and has no context on your company, project or standards until you supply it. The Help Center gives chat users the same comparison: a newly hired contractor who needs very specific instructions. The Help Center also advises that you explain a failing prompt as if to someone with no background knowledge of what you are asking."}, {"i": 2, "l": "1.1", "d": 1, "h": "The Briefing Mindset", "t": "An effective prompt contains as much context as possible, because Claude works from what you give it. When you delegate work well, you cover the task, the background, the audience, the format and what a good result looks like. A prompt covers the same things. Neither a new hire at the roofing firm nor Claude knows which jobs ran late."}, {"i": 3, "l": "1.1", "d": 1, "h": "The Five Components", "t": "A complete business prompt has five parts.\nTask. Say precisely what you want done, with a verb and a deliverable. \"Draft a one-page project update for the steering committee\" is a task. \"Help me with my project\" is not a task. The office manager's task is a one-page update on this month's jobs for the directors.\nContext. Give the background that Claude cannot know. That is who the audience is, what the document is for, what has already been decided, and any constraints that apply. For a writing task, the prompt outlines the requirements, the target audience and the main points."}, {"i": 4, "l": "1.1", "d": 1, "h": "The Five Components", "t": "Source material. Paste or attach the actual inputs, such as the report, the meeting notes or the data. Do not describe them from memory. Claude works from what you give it. A summary from memory adds errors and omissions that the real document does not have. claude.ai accepts documents, spreadsheets and images, so you can give Claude the real inputs. The roofing firm attaches its job sheets instead of describing them from memory.\nOutput specification. Format, length, tone and structure: three bullet points per workstream, neutral tone, under 400 words."}, {"i": 5, "l": "1.1", "d": 1, "h": "The Five Components", "t": "An example, when standards matter. One sample of a previous document in the house style (your organisation's own style rules) works better than three paragraphs that describe the style. Anthropic calls examples one of the most reliable ways to guide format, tone and structure. Last month's update is the roofing firm's sample."}, {"i": 6, "l": "1.1", "d": 1, "h": "Role and Audience Framing", "t": "Opening a prompt with a role, such as \"As an HR communications specialist\", shapes vocabulary, tone and priorities. Anthropic notes that even a single sentence makes a difference.\nNaming the audience changes the output more than most small edits to the instructions do. The same analysis should read differently for the board and for the project team. Claude shapes the analysis if you tell it who is reading. So the roofing firm's brief names the directors. When you explain the reason for a requirement, you also get a more targeted response."}, {"i": 7, "l": "1.1", "d": 1, "h": "What Specificity Buys", "t": "A vague prompt produces generic output, and generic output needs a lot of rework. Being specific about the desired output format and constraints improves Claude's results. A minute that you spend on the brief saves a round of rework. The official usage guidance agrees: be specific and concise, and review and edit your prompt before you send it. A first attempt with a good brief costs less time and less usage than correcting the output more than once. The roofing firm's one-line prompt gives no job sheets, readers or format."}, {"i": 8, "l": "1.1", "d": 1, "h": "Technical Tasks at Associate Level", "t": "\"Technical\" does not mean code. At this level, it means asking Claude for a spreadsheet formula, a first attempt at simple data analysis, or a technical document's first draft. The skill is the same: brief the task well. The office manager might write: I need a formula that flags any invoice more than 30 days overdue, here is a sample of the data."}, {"i": 9, "l": "1.1", "d": 1, "h": "In the exam", "t": "The recurring wrong answer in this objective is the one-line prompt, \"write something about our Q3 results\". That answer presents the prompt as acceptable because Claude will infer what is needed. Claude cannot infer it: the prompt gives Claude none of the five components to work from. The formula brief above covers what Domain 1 tests. The question never tested how elegant the formula is.\n[Key Concept] When an exam question compares prompts, count the components. The right answer almost always supplies the missing task, context, source material, output specification or example. The wrong options improve the wording, and the missing component stays missing."}, {"i": 10, "l": "1.1", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] Accepting the one-line prompt because Claude will infer what is needed\nClaude has none of the context a colleague would need, so the output is generic and the user spends time on rework because the brief was skipped. Briefing the task properly at the start is the documented fix.\n[Exam Trap] Choosing the option that improves the wording while the missing component stays missing\nQuestions that compare prompts usually test a missing component: no audience, no source material, no format. A change to the wording only leaves that gap open. Supplying the missing component is what fixes the output.\n[Exam Trap] Writing the deliverable yourself and using Claude only to proofread"}, {"i": 11, "l": "1.1", "d": 1, "h": "Exam Traps", "t": "It looks like diligence, but it under-uses the tool. Drafting from a good brief is exactly the work Claude does well. A role that only proofreads loses the time saving. The exam treats it as lazy under-use of the tool."}, {"i": 12, "l": "1.1", "d": 1, "h": "Practice Scenario", "t": "A facilities coordinator needs Claude to draft a staff memo introducing a new desk-booking system to all office-based staff. She has the supplier's how-to guide and wants a draft she can send without reworking it by hand or going back to Claude for more rounds. Which prompt prepares the work best?\nOption ASend a single line asking for a memo about the desk-booking system, keeping the request short so Claude has creative freedom, and plan to pick the best parts of whatever comes back\nOption BWrite the memo yourself from the how-to guide and ask Claude only to check the spelling, grammar and tone of the finished text before it goes out to staff"}, {"i": 13, "l": "1.1", "d": 1, "h": "Practice Scenario", "t": "Option CAttach the one-page how-to guide, name the audience as all office-based staff, state the goal of cutting confusion in the first week, and ask for a friendly but firm tone, 300 words, with a three-bullet summary at the top\nOption DAsk Claude first to describe how desk-booking systems usually work, then let it draft the memo in whatever format it judges best, supplying the guide, the audience and the tone preferences in later follow-up rounds if the first draft turns out to miss them\n[Check Answer]"}, {"i": 14, "l": "1.2", "d": 1, "h": "What You Need to Know", "t": "Claude gives its best output on complex work when you split the work into pieces that Claude can do properly, one at a time. That splitting is task decomposition. Connected parts pass results to each other: a later part needs an earlier part's output or decisions. Independent parts work on their own.\nA single well-formed prompt handles a lot of work, but it has a limit. When you put a whole project's requests into one message, the result is shallow and uneven. Claude does some parts well and gives other parts little attention."}, {"i": 15, "l": "1.2", "d": 1, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a supermarket. Its manager writes a quarterly customer-feedback report for head office. The report needs an outline, sections in one voice and an action list. She also needs a rival-store summary, a press release and a budget table. The Help Center's list of remedies for an unhelpful answer includes breaking complex requests into substeps. The Help Center also says that a prompt should contain as much context as possible."}, {"i": 16, "l": "1.2", "d": 1, "h": "Four Techniques, Lightest to Heaviest", "t": "Numbered steps inside one prompt. For connected parts, list them explicitly. The manager writes: first summarise the feedback themes, then rank them by frequency, then draft one improvement action per theme. Claude follows an explicit sequence far more reliably than one long paragraph of requests. Anthropic's guidance is to use numbered sequential steps when order or completeness matters, and to be specific about output format and constraints."}, {"i": 17, "l": "1.2", "d": 1, "h": "Four Techniques, Lightest to Heaviest", "t": "Staged prompting in one conversation. For a deliverable that you build in stages, ask for the outline, review and adjust it, then draft section by section. You review each stage's output before the next stage runs. The approved output becomes the starting point for the next stage. So you correct the work while correcting still takes little effort. The manager corrects her outline before any section exists.\nPlan-first prompting. When the right structure is not obvious, ask Claude to propose an approach first. For example: before writing anything, list the sections you would include and what each covers. Reviewing a plan takes seconds. Reworking a wrong 2,000-word draft does not take seconds."}, {"i": 18, "l": "1.2", "d": 1, "h": "Four Techniques, Lightest to Heaviest", "t": "Separate conversations per sub-task. Put genuinely independent pieces, such as a rival-store summary, a press release or a budget table, in separate chats. Separate chats keep each context clean and focused. The manager gives each of her three side jobs its own chat."}, {"i": 19, "l": "1.2", "d": 1, "h": "Choosing the Technique", "t": "Connected parts belong in one conversation, in stages, so that later stages start from the approved earlier stages. Independent deliverables belong in separate chats. When the structure is unclear, ask for the plan first. A mismatch between technique and task fails in one of two ways. The first is one very large prompt that asks for a finished 20-page product in one pass. The second is connected work that you split across chats. Each new chat has then lost the outline and tone decisions that the previous chat made. Report sections that the manager splits across chats would lose her outline and tone."}, {"i": 20, "l": "1.2", "d": 1, "h": "Carrying Context Forward", "t": "A new conversation does not automatically contain another conversation's working material. Claude does now remember across chats. This memory is a set of individual topics that cover your role, projects, preferences and ongoing work context. Memory is context about you, not a transcript. Memory does not carry your approved outline, tone guide or half-finished draft into a new chat. On paid plans, you can ask Claude to search past chats and bring relevant details into the current chat. That search is retrieval that you must ask for, not automatic carry-over."}, {"i": 21, "l": "1.2", "d": 1, "h": "Carrying Context Forward", "t": "The dependable pattern is explicit persistence: you carry outputs forward yourself. Paste the output into the new conversation, re-attach the file, or keep the output in a Project's knowledge base. Projects are self-contained workspaces with their own chat histories and knowledge. When the manager returns to the report in a new chat, she first pastes her outline into the chat. Carrying outputs forward is your job, not the product's."}, {"i": 22, "l": "1.2", "d": 1, "h": "In the exam", "t": "The exam tests matching a technique to a situation, not reciting the four. The right answer follows the three matching rules. Both failure modes appear as wrong options. Where persistent material should be stored is a Domain 3 and Domain 5 question.\nCurrent state (September 2026)"}, {"i": 23, "l": "1.2", "d": 1, "h": "In the exam", "t": "Memory became available on claude.ai on 11 September 2025 for Team and Enterprise plans, then for Pro and Max from 23 October 2025. As of 30 September 2026 memory is on by default for Free, Pro and Max. As of that date, on Team and Enterprise an owner decides whether memory is available. Memory stays off for each member until that member enables it. Chat search, which lets you ask Claude to reference past conversations, is available on paid plans. Neither feature changes the rule: memory saves context about you as individual topics, and you must ask for chat search."}, {"i": 24, "l": "1.2", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] One very large prompt that asks for everything, chosen to keep the whole deliverable in one place\nAttention spreads unevenly across a project of requests in one message. As a result, some sections are strong and others are skimmed. Corrections also arrive only after the whole thing is wrong. Breaking complex requests into substeps is the documented remedy.\n[Exam Trap] Fragmenting connected work across separate conversations\nEach new chat lacks the outline, tone decisions and approved material that the previous chat built. So the pieces arrive in different voices. They need reconciling by hand. Separate chats are for independent deliverables, not connected ones."}, {"i": 25, "l": "1.2", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] Plan-first prompting offered where the structure is already known and agreed\nAsking Claude to propose sections you have already settled is a small unnecessary extra step: it adds a review round without adding information. Plan-first is useful only when the right structure is genuinely unclear."}, {"i": 26, "l": "1.2", "d": 1, "h": "Practice Scenario", "t": "A programme director at a charity must produce a 20-page annual impact report: an overview, five sections drafted from the notes of five different programme teams, and one consistent voice throughout. The director wants to approve each part as it is produced, and never to explain settled decisions again to a new chat. How should the director structure the work with Claude?\nOption ASend one prompt with the notes from all five teams and request the complete 20-page report, overview included, in a single pass so nothing is lost between chats and the voice stays consistent"}, {"i": 27, "l": "1.2", "d": 1, "h": "Practice Scenario", "t": "Option BUse one conversation: agree the outline and a tone guide first, then draft section by section, each prompt carrying the notes for that section, with the overview written last from the finished sections\nOption CAsk each of the five programme teams to run its own Claude chat in whatever style it prefers, then combine the six resulting drafts into a single document afterwards\nOption DOpen six separate conversations, one per section and one for the overview, so each chat stays small and focused and no single conversation reaches its length limit\n[Check Answer]"}, {"i": 28, "l": "1.3", "d": 1, "h": "What You Need to Know", "t": "A first output, Claude's first answer to a prompt, is a draft. The prompt that set the task is the brief. Feedback is the follow-up message that you send about the output. Iteration is the cycle of output, specific feedback and better output. Iteration is the normal way of working, not a failure. The Help Center's getting-started advice says this directly: do not hesitate to refine your prompts or ask follow-up questions. People who get the most from Claude plan one or two rounds of feedback for every task. People who get the least accept a mediocre first attempt, or abandon the tool after one attempt."}, {"i": 29, "l": "1.3", "d": 1, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a dental practice. Its manager asks Claude for a letter that reminds patients that their check-up is due. The draft has the right parts but is too formal, too long and full of clinical terms."}, {"i": 30, "l": "1.3", "d": 1, "h": "Feedback That Names the Gap", "t": "The Help Center names feedback as an official remedy for an unhelpful answer: provide follow-up instructions, clarify, or ask for a rewrite. \"Make it better and try again\" reproduces the problem, because the message adds no new information to the conversation. Suppose the manager writes \"Cut it to 200 words, keep the paragraph on fees, and lose the marketing adjectives.\" That message fixes the draft, because each clause names a gap.\nGood feedback does one of three things:\nIt adds a missing constraint, such as the audience, the format or the thing to avoid.\nIt corrects a misreading.\nIt narrows the scope."}, {"i": 31, "l": "1.3", "d": 1, "h": "Feedback That Names the Gap", "t": "All three depend on diagnosis: find the gap between the output and the need, then state the gap plainly. A quick method is to check the output against the five components of the original brief. The gap is usually where a component was weak or missing. The manager's one-line prompt never named the audience.\nAsking for variants is iteration too. The manager can request three versions of the opening paragraph: formal, conversational and urgent. Claude generates the options, and the manager judges them. This method is often the fastest way to find the right register, or style, when you know something is wrong but cannot yet name it."}, {"i": 32, "l": "1.3", "d": 1, "h": "Refine or Re-Brief?", "t": "When the output is close to what you need, refine it. Stay in the conversation and give targeted follow-ups. Sometimes the output shows that the original prompt was wrong: the wrong task, the wrong framing or missing context. Then rewrite the brief and start a new conversation, rather than correct a misunderstanding through six follow-up turns. A long series of corrections makes the context that the conversation keeps less clear. Each correction also works against the original framing instead of fixing it."}, {"i": 33, "l": "1.3", "d": 1, "h": "Refine or Re-Brief?", "t": "The miscall, the wrong choice between refining and re-briefing, happens in both directions. One miscall is to correct, turn after turn, a brief that asked for the wrong thing. The other miscall is to abandon a conversation that one specific fix would have finished. If the manager's letter needs only plainer words, one follow-up finishes it."}, {"i": 34, "l": "1.3", "d": 1, "h": "Three Responses to a Disappointing Draft", "t": "You can respond in three ways to a draft that is structurally fine but wrong for its purpose. The vague retry, \"not quite, try again\", produces the same shortfall, because the retry adds nothing new to the conversation. The targeted follow-up names the tone, the phrases to avoid and the reader that the piece is for. The targeted follow-up produces a usable revision, because each named gap shows Claude what to fix in the rewrite. The manager names a warm tone, no clinical terms, and patients as the reader."}, {"i": 35, "l": "1.3", "d": 1, "h": "Three Responses to a Disappointing Draft", "t": "The third response is the re-brief. Use it when the original one-line prompt was the real problem. An effective prompt contains as much context as possible, and one line holds very little context. Re-brief properly: attach the style guide and name the audience at the start. A proper re-brief fixes the current batch and improves every batch that follows."}, {"i": 36, "l": "1.3", "d": 1, "h": "Keep the Wording That Worked", "t": "Suppose that two rounds of feedback finally produce the right output. Then the feedback that fixed the draft is exactly the instruction that the original prompt was missing. Add that feedback to the original prompt. The reusable prompt then starts the next run from the improved version, rather than from the beginning. The manager's next batch starts from a prompt that names the tone, plain words and the patient audience."}, {"i": 37, "l": "1.3", "d": 1, "h": "In the exam", "t": "The exam tests the quality of feedback and ranks the three responses. It rewards the targeted follow-up over the vague retry every time. It expects you to recognise when the re-brief is the professional choice. Questions test the miscall in both directions. When a task recurs every week, moving its wording into standing configuration (instructions that stay in place for every run), such as the instructions of a Project, belongs to Domain 5. Domain 1 stops at refining the current request and keeping the wording that worked.\nWhy start a new conversation?"}, {"i": 38, "l": "1.3", "d": 1, "h": "In the exam", "t": "Longer chats consume more of your usage limit. When a chat approaches its length limit, the documented advice is to start a new conversation or use a Project. Restarting on a wrong brief is recommended as professional working practice, because a long series of corrections gives an unclear starting point. Official documentation does not claim that long conversations degrade output quality."}, {"i": 39, "l": "1.3", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] The vague retry that looks like diligence\nRegenerating, rewording slightly, or asking Claude to try again adds no new information to the conversation, so the next output repeats the shortfall. Feedback only works when it names the gap: the audience, the tone, the length, the constraint that was missing.\n[Exam Trap] Making small fixes to a fundamentally wrong brief through many follow-up turns\nWhen the output shows the original prompt asked for the wrong thing, each correction works against the framing instead of fixing it. Rewriting the brief and starting a new conversation is faster and gives every later batch of the same work a better starting point."}, {"i": 40, "l": "1.3", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] Starting a fresh chat when the output needed only one specific fix\nThis is the miscall in the other direction. A restart discards the context and approved material the conversation already holds; when the output is close, a single targeted follow-up in the same conversation is the cheaper, faster, professional choice."}, {"i": 41, "l": "1.3", "d": 1, "h": "Practice Scenario", "t": "A retail merchandiser asks Claude for product descriptions for a seasonal homeware catalogue. The first batch is structurally fine but generic and in the wrong voice. The same prompt in a new chat came back just as generic, and she wants the copy fixed in one more round. What is the most effective next prompt?\nOption AStart a brand-new chat, paste the same one-line prompt in again, and rely on the fresh conversation to produce a fresher and more distinctive voice for the batch\nOption BAccept the copy as a reasonable starting point, then rewrite the voice by hand across all forty descriptions before the catalogue goes to print"}, {"i": 42, "l": "1.3", "d": 1, "h": "Practice Scenario", "t": "Option CReply with specific feedback naming the required tone, the overused phrases to avoid, and the shopper the catalogue is speaking to, then rerun the batch\nOption DReply that the copy is not quite right, ask Claude to try again, and keep regenerating in the same conversation until a batch finally arrives in the right voice\n[Check Answer]"}, {"i": 43, "l": "1.4", "d": 1, "h": "What You Need to Know", "t": "A task type is the kind of work that you give to Claude. This objective covers four task types. They are analysis (finding what material shows), research (gathering from sources), drafting (writing a piece) and brainstorming (generating ideas). Anthropic's documentation shows Claude doing all four. Claude analyses chart data, drafts anything from a text message to a screenplay, and generates viewpoints and recommendations as an ideas partner. One prompting style does not fit all four. Each type gets the best results from a different briefing shape. The briefing shape is what the prompt contains."}, {"i": 44, "l": "1.4", "d": 1, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a lettings agency. Its manager has four jobs this month. She must learn why tenancy renewals fell and compare other agencies' tenant screening. She must also write to landlords about a new fee and find ways to win more landlords."}, {"i": 45, "l": "1.4", "d": 1, "h": "Analysis: Material Plus Questions", "t": "Analysis starts with the material. Attach the spreadsheet or paste the survey results, because Claude works from what you give it. Uploads give Claude the real artefacts, even documents that are hundreds of pages long.\nThen name the questions that the analysis must answer and the decision that the analysis will inform. \"Analyse this data\" gives Claude no target, so Claude describes the data rather than analyses it. The manager attaches her renewals spreadsheet and asks why renewals fell, which properties lost most tenants, and what should change before next year. Ask for main findings, supporting evidence and caveats. Also ask how Claude reached each conclusion, so that you can check the reasoning. Checking that reasoning is Domain 2 work."}, {"i": 46, "l": "1.4", "d": 1, "h": "Research: A Scoped Question, Not a Topic", "t": "For multi-source questions, Research works agentically: Claude runs multiple searches, and each search uses the results of earlier searches. Claude then returns a report with citations that are easy to check. For a quick current fact, an ordinary web search suffices. The documentation separates the two in this way: web search suits straightforward factual queries that one or two searches answer. Research suits thorough gathering across many searches."}, {"i": 47, "l": "1.4", "d": 1, "h": "Research: A Scoped Question, Not a Topic", "t": "Either way, brief a research question, not a topic. State the scope, the angle, and what the findings must inform. The manager asks Research how agencies of her size locally screen tenants, so that she can decide whether to change her own screening. A bare topic gives the searches no direction, and Claude returns an unfocused report. Then verify the citations that matter."}, {"i": 48, "l": "1.4", "d": 1, "h": "Drafting: The Full Brief", "t": "Drafting needs the full five-component brief from objective 1.1: audience, purpose, tone, length and format. Add an example when house style matters, because an example is one of the most reliable ways to guide format, tone and structure. For the fee letter, the manager names landlords as the audience and attaches a past letter. Expect to iterate (objective 1.3). For any long piece, stage the work (objective 1.2): outline first, then sections."}, {"i": 49, "l": "1.4", "d": 1, "h": "Brainstorming: Wide, Then Narrow", "t": "Brainstorming reverses the drafting approach. First, ask for many different ideas: quantity and range, such as twenty ideas that include some unconventional ones. To get ideas beyond the obvious ones, ask for them explicitly, rather than leaving Claude to infer that you want them. Withhold judgement, because heavy constraints reduce the variety, and variety is the purpose of this step. Then narrow the ideas in a second step: apply your criteria, make a shortlist, and develop the ideas that remain. The manager asks for twenty ways to win landlords and applies her budget limit only at the shortlist step. This two-step method makes Claude a genuine ideas partner instead of a generator of three safe suggestions."}, {"i": 50, "l": "1.4", "d": 1, "h": "The Diagnostic Habit", "t": "Name the type, then pick the shape.\nAnalysis: material plus questions.\nResearch: a scoped, cited question.\nDrafting: a full brief plus iteration.\nBrainstorming: many ideas first, then a shortlist."}, {"i": 51, "l": "1.4", "d": 1, "h": "In the exam", "t": "The exam guide names these four task types. The tested skill is diagnostic: read the workplace situation, name the type, and brief in the shape of that type. Wrong answers mix up the task types: they apply the briefing of one task type to another task type. Examples are a tightly constrained brainstorm, a one-line research topic, an analysis with no material attached and a draft with no audience. The last example is the recurring wrong answer on drafting. Choosing which product feature or model to use belongs to Domain 3. This objective covers the briefing that follows.\nWatch for briefings that suit the wrong task type"}, {"i": 52, "l": "1.4", "d": 1, "h": "In the exam", "t": "Most questions hide the error in a plausible plan that applies the right briefing to the wrong task type. Check each part of a multi-task option separately. One mismatch, such as constraints at the first step of a brainstorm, where you want many ideas, makes the whole option wrong.\nThe wide-then-narrow sequence of brainstorming is standard facilitation practice, applied to Claude. It is not a rule from a product manual."}, {"i": 53, "l": "1.4", "d": 1, "h": "Exam Traps", "t": "[Exam Trap] Asking for an analysis without naming the questions it must answer\nMaterial with no questions attached produces a description of the data, not an analysis. The professional brief supplies the material, the questions, and the decision the findings will inform, and asks for findings, evidence and caveats.\n[Exam Trap] Opening a brainstorm with tight constraints and a fixed number of acceptable directions\nConstraints applied at the divergence step remove the variety the exercise exists to produce. Criteria belong in the convergence step, where they shortlist a wide field rather than strangling it before it exists.\n[Exam Trap] Briefing research as a topic rather than a scoped question"}, {"i": 54, "l": "1.4", "d": 1, "h": "Exam Traps", "t": "An unscoped topic returns an unfocused report. A research question states the scope, the angle and what the findings must inform, which tells the searching what to investigate and gives the citations claims to support."}, {"i": 55, "l": "1.4", "d": 1, "h": "Practice Scenario", "t": "A university department administrator has four tasks this week: work out why tutorial attendance dropped this term; learn how three other universities run applicant open days; write the new-term welcome letter to students; and generate ideas for increasing open-day attendance. She intends to use Claude on all four. Which working plan matches strategy to task?\nOption ARun every task through Research, since cited sources raise the quality of any output and one consistent method is easier to manage across a busy week\nOption BUse Claude for the letter and the ideas only, handling the attendance analysis and the open-day research personally, since those two tasks call for real judgement"}, {"i": 56, "l": "1.4", "d": 1, "h": "Practice Scenario", "t": "Option CAsk Claude why attendance drops at universities generally, answer the open-day comparison from one quick web search, send a one-line request for the welcome letter, and specify exactly three safe, sensible ideas at the start\nOption DAttach the attendance data and name the questions for the analysis, give Research a scoped open-day question, brief the letter fully with last year’s letter as the example, and ask for many ideas before shortlisting\n[Check Answer]"}, {"i": 57, "l": "2.1", "d": 2, "h": "What You Need to Know", "t": "Reviewing an output means checking what Claude wrote before anyone relies on it. A review asks two questions. Accuracy asks whether the specifics are right: numbers, names, dates, titles, quoted figures, and references to documents or rules. Completeness asks whether anything is missing. A review checks both against the source. The source is the material that Claude used to build the output.\nThis lesson uses one made-up example throughout: a bakery. Its owner attaches a flour supplier's new contract and asks Claude for a summary. Her business partner will use the summary to decide whether to sign. The summary reads well, but it could contain a wrong price per sack or omit a clause."}, {"i": 58, "l": "2.1", "d": 2, "h": "The Reviewer's Stance", "t": "Treat every Claude output as a good first draft that can contain errors stated with confidence. The Help Center says why: Claude \"can occasionally produce responses that are incorrect or misleading\", and users \"should not rely on Claude as a singular source of truth\". Fluency and confidence are properties of the writing, not evidence about the facts. Claude writes fluently whether it is right or wrong, so an output that reads beautifully has passed no check. The bakery summary would read just as well with a wrong price."}, {"i": 59, "l": "2.1", "d": 2, "h": "The Reviewer's Stance", "t": "Ownership decides who does the checking. The professional who sends Claude's work owns it. That professional is accountable for it to their team, their members or their funder. Review is the step that changes a draft into work that you can accept responsibility for. Review is not an optional extra for cautious people."}, {"i": 60, "l": "2.1", "d": 2, "h": "Accuracy: Are the Specifics Right?", "t": "Check the specifics first, in order of consequence. Start with the details that would be most costly or embarrassing if they were wrong. These are usually the figure that a decision depends on, the name at the top of the letter, and the date of the deadline. A draft with twenty accurate sentences and one wrong subtotal is a wrong draft if the meeting decides on that subtotal. At the bakery, the price per sack comes first, because the partner decides on it."}, {"i": 61, "l": "2.1", "d": 2, "h": "Completeness: Is Anything Missing?", "t": "Completeness is harder to check, because the evidence is absent rather than wrong. A fluent summary can omit a section, a theme or a caveat, and nothing in the prose shows the gap. So check the output against the source itself, never against your memory of the source. Follow the source's own structure: its sections, funds, themes or line items. Confirm that each element is either in the output or excluded on purpose. If you read the output alone and accept it, you send it with the gaps still in it. The bakery owner ticks each clause in the contract against the summary."}, {"i": 62, "l": "2.1", "d": 2, "h": "Completeness: Is Anything Missing?", "t": "Check accuracy first every time. A wrong specific is the most likely failure, and it is the quickest to catch. Check completeness second, because that check needs the source open anyway."}, {"i": 63, "l": "2.1", "d": 2, "h": "Verify Against the Input", "t": "When Claude builds an output from attached material, the first check is the attachment. The attachment is already in the conversation, and it takes minutes to compare the two. Anthropic's prompting guidance gives the same advice for long documents: ask Claude to quote the relevant parts of the source before it does the task. In the chat, ask Claude where in the attachment each figure or claim came from. Then spot-check the claims that matter against those locations. An output whose claims trace to the source is checkable in minutes. Do not assume that an output is correct when you cannot trace its claims. The bakery owner asks where the price came from, then reads that clause."}, {"i": 64, "l": "2.1", "d": 2, "h": "Verify Against the Input", "t": "Asking Claude whether it is sure is not a check. The same model that made an error will repeat it with the same confidence, because no new information enters the check. A real check compares the output with its source."}, {"i": 65, "l": "2.1", "d": 2, "h": "In the exam", "t": "This domain has a larger share of the exam than any other domain, and every objective in it depends on the reviewer's stance. The certification's central claim is that its holder can be trusted with what Claude produces. The holder earns that trust at the review stage, not at the prompting stage. When the stance is right, the other skills in the domain follow from it: spotting failure types, validating claims, knowing when to escalate. The exam treats self-reported confidence as a wrong answer, never as a check.\nThe register exemplar"}, {"i": 66, "l": "2.1", "d": 2, "h": "In the exam", "t": "The guide's Domain 2 sample question tests this objective. Claude summarises a regulation and cites a specific subsection. The right answer is to verify that citation against the official text before the compliance team sees it. The named wrong answers are trusting Claude's expressed confidence and rewording the summary to sound more formal. Diligence matters more than confidence, and polish is never a substitute for correctness."}, {"i": 67, "l": "2.1", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Sending the output because it reads well or because Claude expressed high confidence\nFluency and confidence are properties of the writing, not evidence about the facts, so neither has checked anything. Compare the output against the source material before anyone relies on it.\n[Exam Trap] Asking Claude to confirm its own work and treating a confident yes as review\nNo new information enters the check: the same model that made an error will repeat it with the same confidence. Compare the output with its source, or ask Claude where in the source each claim came from and spot-check those locations.\n[Exam Trap] Verifying one named figure when part of the source may have been dropped"}, {"i": 68, "l": "2.1", "d": 2, "h": "Exam Traps", "t": "Accuracy checking alone misses the second review question. When the source had more in it than the output shows, review each part of the source's own structure for completeness, not just the details that you noticed."}, {"i": 69, "l": "2.1", "d": 2, "h": "Practice Scenario", "t": "A scout group treasurer has Claude draft the annual financial summary for the AGM from the group's accounts spreadsheet. The draft reads perfectly, but she must be sure it is right and leaves nothing out, without simply trusting what Claude says. What should the treasurer do before circulating it?\nOption ARework the summary into more formal accounting language so that it passes close examination by members at the meeting\nOption BCirculate it as it stands: the figures look plausible, the formatting is professional, and the AGM pack deadline is close\nOption CAsk Claude whether it is confident the summary is accurate and complete, then circulate the document once Claude says it is"}, {"i": 70, "l": "2.1", "d": 2, "h": "Practice Scenario", "t": "Option DCheck each stated figure against the spreadsheet, then review the list of funds the accounts track to confirm every fund appears in the summary\n[Check Answer]"}, {"i": 71, "l": "2.2", "d": 2, "h": "What You Need to Know", "t": "Objective 2.1 gave you the reviewer's stance. This objective names the three failure types a review looks for. A hallucination is content that sounds convincing but is not grounded in fact. An inconsistency is an output that disagrees with itself. Bias is skewed framing, assumptions or language. Each has recognisable signs, and each needs a different response.\nThis lesson uses one made-up example throughout: a garden centre. Its manager gives Claude three jobs in one week. She wants the steps for the stock report in the till system, a spring sales summary with a table, and appraisal notes for seasonal staff. Each job can fail in one of the three ways."}, {"i": 72, "l": "2.2", "d": 2, "h": "Hallucination: Fluent, Specific, Fabricated", "t": "The Help Center says Claude \"can occasionally produce responses that are incorrect or misleading\". It \"can display quotes that may look authoritative or sound convincing, but are not grounded in fact\". That last phrase is the working definition. A hallucination is not vague or hesitant. It appears as an exact-looking figure, a named source or a numbered list of steps. An invented detail has the same confidence as a real one, so specificity is not evidence. For any detail, ask \"where would this have come from?\" Asking \"does this sound right?\" tests only the confidence."}, {"i": 73, "l": "2.2", "d": 2, "h": "Hallucination: Fluent, Specific, Fabricated", "t": "Claude can also hallucinate its own capabilities. A separate Help Center article warns that Claude may falsely claim to have sent an email, produced an external document or supplied a working link. Claude has no access to email or file transfer unless they have been explicitly integrated. A claim that Claude has done something outside the conversation is a claim to check. It is not a confirmation that the delivery happened. If Claude says it has emailed the stock figures to the supplier, the manager checks with the supplier."}, {"i": 74, "l": "2.2", "d": 2, "h": "Where the Risk Concentrates", "t": "Hallucination risk depends on grounding: how much material Claude has to work from. The risk is highest where Claude has least to work from:\nyour organisation's private, internal systems and documents Claude was never given\nvery recent events that happened after its training data was collected\nprecise figures that were not in the source material"}, {"i": 75, "l": "2.2", "d": 2, "h": "Where the Risk Concentrates", "t": "The highest-risk type of output is a set of confident numbered instructions for an internal tool whose documentation Claude has never seen. These instructions are fluent and specific, but nothing supports them. The stock-report steps are this type of output. Claude names menus in a till system that it was never shown, and some of those menus may not exist. The less grounding Claude could possibly have, the less its specificity means."}, {"i": 76, "l": "2.2", "d": 2, "h": "Inconsistency: The Output Disagrees With Itself", "t": "You need no external source to detect an inconsistency. One common form is a number in the prose that contradicts the table. Another is a recommendation that contradicts the findings. A third is two sections that give different dates for one event. An internal contradiction is a warning about the reliability of the whole output. It is not a single typo to fix. The process that produced one visible failure was just as able to produce invisible ones. So re-verify the whole output against its source, rather than fixing the one mismatch you noticed and sending the rest. If the spring sales prose and table give different compost figures, the manager checks the whole summary against the till data."}, {"i": 77, "l": "2.2", "d": 2, "h": "Bias: The Pattern, Not the Sentence", "t": "Bias has the most serious consequences in outputs about people: recruitment material, appraisals, customer descriptions, and anything that ranks or characterises groups. Anthropic's Usage Policy treats employment, housing, finance and healthcare decisions about individuals as high-risk uses. This shows how much is at risk. The skew is in the pattern, so compare the descriptions with each other rather than read sentence by sentence. Suppose the appraisals describe older staff by reliability and younger staff by innovation. No single sentence is objectionable, but the output still is. Look for coded language (words that suggest a group without naming it) and unstated assumptions about age, gender, background or ability. Then apply the read-aloud test: would the framing be acceptable if someone read it aloud to the group that it describes?"}, {"i": 78, "l": "2.2", "d": 2, "h": "In the exam", "t": "The exam tests whether you can distinguish the three failure types and respond to each correctly, because the correct responses differ. For inconsistency, the tested point is the response: re-verify the whole output. Wrong options match a failure type with an incorrect response. They fix one contradiction, delete one biased word, or ask Claude to confirm its own invented steps.\nMatch the response to the failure type"}, {"i": 79, "l": "2.2", "d": 2, "h": "In the exam", "t": "Verify a hallucination against an authoritative source. When you find an inconsistency, re-verify the whole output. Rework bias as a pattern across the document. Asking \"is this right?\" on its own is not a check. Anthropic documents two checks. The first is a re-run that you compare against the first output. The second is a follow-up that asks Claude to verify its previous statements and flag what does not fit together. Each check gives you a list of items to check against the source. For the stock-report steps, that source is the till system's documentation."}, {"i": 80, "l": "2.2", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Trusting confident, step-by-step instructions for a private internal system\nClaude has no access to an organisation's internal software unless material about it was provided in the conversation, so specific detail with no source behind it is the highest-risk type of hallucination. Treat the steps as unverified and check the system's own documentation.\n[Exam Trap] Believing Claude's claim to have sent an email or produced an external file\nClaude can hallucinate its capabilities and has no access to tools that are not integrated, so a completion claim is a claim like any other. Verify that the action actually happened rather than treating the statement as confirmation."}, {"i": 81, "l": "2.2", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Fixing the one contradiction you spotted and sending the rest\nAn internal inconsistency is evidence the output's process failed somewhere, so the whole output needs re-verification against its source. Fixing the one visible contradiction keeps a document that has already shown you it cannot be trusted line by line.\n[Exam Trap] Treating bias as one bad word to delete\nBias is in the pattern across descriptions: who gets caveats, whose achievements get qualifiers, which groups are framed in different terms. Deleting a single biased phrase leaves the skew intact, so rework the pattern, not the word."}, {"i": 82, "l": "2.2", "d": 2, "h": "Practice Scenario", "t": "A skin clinic's practice manager asks Claude how to produce the monthly patient-recall report in the clinic's management software. Claude has had no access to this software or to anything written about it, yet it replies with confident, numbered steps naming specific menus and buttons. She still wants to use Claude for other work that involves this software. What should the manager do with these steps?\nOption AFollow the steps as written: detail down to the level of named menus and buttons suggests Claude has reliable knowledge of this software\nOption BStop using Claude for anything connected to the clinic’s software, since it has just shown that it will invent plausible instructions rather than admit that it does not know the answer"}, {"i": 83, "l": "2.2", "d": 2, "h": "Practice Scenario", "t": "Option CAsk Claude to double-check each of its steps against the clinic’s software and confirm they are all correct before trying them, so that nothing invented is missed\nOption DTreat the steps as unverified and check the software supplier’s documentation or the built-in help instead\n[Check Answer]"}, {"i": 84, "l": "2.3", "d": 2, "h": "What You Need to Know", "t": "Validation means checking an output's claims against something that can confirm them. This objective gives the review from objective 2.1 its tools. It puts them in order from the cheapest to the most costly. Your own judgement decides how much checking a given output deserves. A primary document is the original record: the official publication, the regulator's text, the funder's published criteria, the organisation's records.\nThis lesson uses one made-up example throughout: a removals firm. The office has Claude draft a quote letter from the attached survey notes and price list. The letter states a total price and the council's parking rules for the street. Claude also drafts internal newsletter ideas."}, {"i": 85, "l": "2.3", "d": 2, "h": "What You Need to Know", "t": "You should not treat Claude as a single source of truth, and high-stakes output deserves careful scrutiny. Claude can produce fluent, specific output that looks correct but is badly mistaken. Specificity alone is not evidence of accuracy."}, {"i": 86, "l": "2.3", "d": 2, "h": "Cheapest First: The Source You Gave It", "t": "When Claude builds an output from attached material, the first check is the attachment. The attachment is already in the conversation. Each figure, section and claim matches the attachment or does not. This check is the habit from objective 2.1, used as a technique, and it costs minutes. The total is checked against the survey notes and price list. Use a check that takes more effort only when the given source cannot settle the question."}, {"i": 87, "l": "2.3", "d": 2, "h": "Independent, Authoritative, Primary", "t": "External claims need external checking. The attachments cannot confirm the parking rules, which did not come from them. Web search responses include citations \"so you can easily verify sources yourself\". Users are advised to cross-reference cited sources and use authoritative ones for critical decisions. The Help Center's hallucination article says to review Claude's cited sources, because checking the original catches misinterpretation. Citations exist to be checked."}, {"i": 88, "l": "2.3", "d": 2, "h": "Independent, Authoritative, Primary", "t": "The standard is the primary document. A second AI summary, a forum post, or Claude's own earlier output is not independent validation. A check that shares the errors of the thing that it checks proves nothing. For the parking rules, the primary document is the council's published page. Web search from within claude.ai is a legitimate way to find that page. The source validates the claim, never the search."}, {"i": 89, "l": "2.3", "d": 2, "h": "Make the Output Traceable", "t": "A traceable output shows where each claim came from, so it is checkable. Do not assume that an output is correct when you cannot trace its claims. For long documents, Anthropic's prompting guidance says to ask Claude to quote the relevant parts of the source before it does its task. For research work, the guidance says to ask Claude to verify information across multiple sources. On the quote letter, ask Claude to show each claim's source and how it reached each conclusion. Then spot-check the important claims. When a decision depends on a single figure, triangulate it: confirm the figure in two independent places before anyone sends it."}, {"i": 90, "l": "2.3", "d": 2, "h": "Proportionality: The Judgement Layer", "t": "The amount of checking depends on what an error would cost. The customer decides on the total, so the total gets two independent confirmations. The newsletter ideas get a read-through. Too little checking of the consequential claim is the obvious failure. Heavy checking on low-stakes work is also wrong, not safe. Time spent on triple checks of newsletter wording that nobody acts on is time not spent on checking the total."}, {"i": 91, "l": "2.3", "d": 2, "h": "Proportionality: The Judgement Layer", "t": "A request that Claude re-check its own output has a limited place. Anthropic's prompting guidance says a self-check catches errors, especially in coding and maths. That guidance names one exception: Claude Opus 5 verifies its own work well without an instruction to do so. A self-check instruction written for earlier models can make Claude Opus 5 verify too much. A self-check is a cheap first check for arithmetic slips and contradictions. It is not independent validation, because the same model misses the same things."}, {"i": 92, "l": "2.3", "d": 2, "h": "In the exam", "t": "Questions test the techniques. They also test when each technique is proportionate, in both directions. The most common trap is a self-check that looks like verification. An option has the user ask Claude to confirm, re-check or rate its own work, and calls the confident answer validation. The guide's sample rationale says why it fails: self-reported confidence is not a reliable accuracy signal."}, {"i": 93, "l": "2.3", "d": 2, "h": "In the exam", "t": "[Key Concept] When a validation question offers several checking plans, test each plan against two questions. Does independent information enter the check? Does the depth of checking match what depends on each claim? The right answer passes both. The wrong options usually fail one. Self-check and circular sources (sources that share the errors of what they check) fail independence. Checking every claim to the same maximum depth fails proportionality."}, {"i": 94, "l": "2.3", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Asking Claude to confirm or re-check its claims and calling that verification\nNo independent information enters the check, and the same errors stay unnoticed. Self-check is a legitimate first check for slips and contradictions, but claims that matter go to an independent source.\n[Exam Trap] Checking a claim against another AI summary or Claude's own earlier output\nA check against a source made from the thing being checked shares its errors. Check against the primary document instead: the official publication, the published criteria, the organisation's records.\n[Exam Trap] Verifying every sentence to the same maximal depth regardless of stakes"}, {"i": 95, "l": "2.3", "d": 2, "h": "Exam Traps", "t": "The amount of checking depends on what an error would cost. Checking everything to the same full depth spends limited time on prose nothing depends on, which is not the safe choice. Concentrate the checking on the claims a decision rests on."}, {"i": 96, "l": "2.3", "d": 2, "h": "Practice Scenario", "t": "A heritage railway volunteer coordinator has Claude draft a grant application. The draft states annual visitor numbers, a percentage increase in school visits, and that the railway meets the funder's published eligibility criteria. She has one evening, too little to verify every line in depth, and nothing may depend on Claude's statements alone. What is the right validation plan before submission?\nOption AAsk Claude to re-check the whole draft carefully and confirm each claim, then submit once it confirms its figures\nOption BCheck the visitor numbers against the railway’s own records, recalculate the percentage from those records, and check the eligibility claims against the funder’s published criteria document"}, {"i": 97, "l": "2.3", "d": 2, "h": "Practice Scenario", "t": "Option CIndependently verify every sentence in the application to the same depth, including the descriptive history section, before anyone sees it\nOption DCheck the eligibility claims against the summary of the criteria that Claude produced earlier in the conversation, and confirm the visitor figures are consistent everywhere they appear across the whole draft\n[Check Answer]"}, {"i": 98, "l": "2.4", "d": 2, "h": "What You Need to Know", "t": "Escalation passes a Claude output to a qualified person to review before anyone uses it. Triage is the decision about who reviews each output. Triggers are properties of the situation that raise the cost of an error. This objective covers when your own review is not enough. It also covers whose review is enough in that case.\nThis lesson uses one made-up example throughout: a driving school. Its owner has four Claude drafts: a website advert, a refund reply under the booking terms, appraisal notes on an instructor, and a car-cleaning reminder. All four read well."}, {"i": 99, "l": "2.4", "d": 2, "h": "The Triggers", "t": "Each trigger below needs qualified human review.\nan external audience: customers, the public, press, funders\nlegal, financial or contractual consequence\ndecisions about people: hiring, appraisal, allocation\nsafety or health implications\noutput that is irreversible once sent\nOne trigger is enough reason for a review by a second, qualified person. When several triggers apply together, escalation is mandatory. Confidence and polish are not on the list, because every Claude draft already has them. Claude is not a single source of truth, and high-stakes output deserves careful scrutiny."}, {"i": 100, "l": "2.4", "d": 2, "h": "The Triggers", "t": "At the driving school, the advert has an external audience. The refund reply has a contractual consequence. The appraisal notes inform a decision about a person. The cleaning reminder has none of these triggers, so the owner reviews it herself.\nYou review outputs with no trigger yourself, carefully, using the habits from objectives 2.1 to 2.3. These outputs are internal working material, first drafts that will change in later versions, and routine low-consequence messages. That review is real. It is not a way to skip review. Triage decides who reviews, never whether anyone reviews."}, {"i": 101, "l": "2.4", "d": 2, "h": "Qualified, Not Senior", "t": "Anthropic's Usage Policy sets the standard. It names High-risk Areas, such as legal, medical, financial and employment matters. In these areas, Claude's output can become advice to a person or a decision about them. The policy calls that output a High-risk AI Recommendation. It requires two things for it. The person must be told that AI was used, and a qualified person must review it. The review rule reads: \"A qualified person must meaningfully review a High-risk AI Recommendation, with the authority to change or modify it, before it is delivered as advice\". The same rule applies before the recommendation is used to make a decision. Advising someone on their legal rights, or on what to do in a specific legal matter, is one of these areas."}, {"i": 102, "l": "2.4", "d": 2, "h": "Qualified, Not Senior", "t": "A qualified person is \"someone with the training or experience to evaluate the output in that field\". The words that pick the reviewer are \"in that field\". Contract language goes to someone with legal competence. Tax figures go to the accountant. Clinical claims go to the clinician. Hiring criteria go to HR judgement. Outside the High-risk Areas, the policy sets no review rule, but competence is still the test that picks the reviewer.\nSeniority and availability are neither necessary nor sufficient. An unqualified reader, however senior, cannot catch the errors that make the content dangerous. A busy director who skim-reads a lease clause gives reassurance, not review. The refund reply goes to a solicitor, not to the owner."}, {"i": 103, "l": "2.4", "d": 2, "h": "Both Failure Directions", "t": "Under-escalation, too little escalation, is the intuitive failure. It sends content to an external audience when that content makes claims with professional consequences, because the draft reads authoritatively. Or it accepts an output as \"only internal\" when that output informs an external or consequential decision. Claude's output reads authoritatively by default. But the triggers belong to the situation, and the polish does not remove them. The next destination of the output decides more than the place where Claude drafted it. The appraisal notes stay in the office but inform a decision about an instructo
