elf-contained workspace with its own chat histories and knowledge. When a chat approaches its length limit, the Help Center advises starting a new conversation or using a Project. The manager keeps the Monday write-up in a Project. Where a plan supports sharing, a Project gives a team one shared environment for its documents and instructions. Chats inside a Project are not shared by default. A member sees the Project's contents, knowledge and instructions. Each person's own conversations stay private unless they choose to share one. This objective is about deciding that the work belongs in a Project. Domain 5 is about configuring the Project and maintaining its instructions and knowledge."}, {"i": 240, "l": "4.4", "d": 4, "h": "In the exam", "t": "If you know the meaning of integration, you can answer many questions. The wrong options are usually integrations in the technical sense. The right answer is an integration in this lesson's sense. Learn the words in a question that signal a technical implementation, which needs an escalation: automatically, without anyone having to, straight from the system, overnight.\nProposing full automation"}, {"i": 241, "l": "4.4", "d": 4, "h": "In the exam", "t": "Connecting Claude to a system, or configuring Claude to run unattended, is this domain's typical wrong option. It is never the right answer. Escalate because the request is a technical implementation, beyond this role and the features this exam covers. Never base the escalation on a claim that no Claude product could run the work. Cowork's scheduled tasks can run some tasks at a set time. The exam guide does not name these scheduled tasks."}, {"i": 242, "l": "4.4", "d": 4, "h": "Exam Traps", "t": "[Exam Trap] Improvising an unattended pipeline that connects systems together\nSystems connected together, auto-publishing and unattended pipelines are technical implementations, beyond the Associate's role and the features this exam covers. Improvised versions fail silently with nobody present to catch them. The professional action is a clear escalation brief to a Claude Developer or Architect.\n[Exam Trap] Redesigning the whole process at once\nThe all-at-once rollout means that if it fails, everything fails together and nothing was learned. A redesign needs a pilot on one part of the process first, with a measurement, exactly as Anthropic's own deployment guidance stages adoption.\n[Exam Trap] Removing the checking step to save time"}, {"i": 243, "l": "4.4", "d": 4, "h": "Exam Traps", "t": "The human gate produces no visible output, which makes it look like waste on a process diagram. It is the step where a person makes the process's judgement, so keep the person on the deciding step and check each output before it goes out."}, {"i": 244, "l": "4.4", "d": 4, "h": "Practice Scenario", "t": "A local newspaper's events page is compiled every week by an editorial assistant from event details that venues email in. A colleague proposes that Claude should instead gather the listings from the venues' websites overnight and publish the finished page without anyone touching it. The assistant still wants to save time on this week's page, with a person reading every listing before it runs. How should the assistant respond?\nOption AAgree, and spend the week experimenting with connectors until Claude can collect the venue listings and produce the page each night with nobody involved\nOption BDecline any use of Claude on the page at all, since a listing with one wrong date or time would damage the paper’s credibility with readers and venues"}, {"i": 245, "l": "4.4", "d": 4, "h": "Practice Scenario", "t": "Option CEscalate the overnight version to the technical team with a note of what the process needs, meanwhile using Claude to reformat the emailed submissions for checking\nOption DRedesign the whole listings operation all at once: print, web and social editions built from the same submitted material and launched together\n[Check Answer]"}, {"i": 246, "l": "4.5", "d": 4, "h": "What You Need to Know", "t": "A stakeholder here is a colleague who reads your report on a Claude trial and decides what happens next. Reporting to them has one rule: say what is true, including the parts that are not impressive. The rule serves two audiences: the enthusiast and the sceptic.\nThis lesson uses one made-up example throughout: a tyre fitter whose office manager is reporting on a three-month Claude trial. Here, accuracy is a useful tactic as well as a form of modesty. If she over-promises, she wins a mandate that she cannot deliver. Then stakeholders read the first visible error as proof that the whole trial was oversold. If she under-claims, the work does not get the support that it earned. A sceptic cannot disprove an accurate claim."}, {"i": 247, "l": "4.5", "d": 4, "h": "Stating Value in Four Parts", "t": "State value in four parts: the task, the before, the after, and how you know. \"The monthly board pack takes two hours instead of five, measured across three months\" is a claim the tyre fitter's manager can defend. \"Claude has transformed how we work\" is not a claim: it names no task and no measurement, so nobody can check it. An audience that has heard that sentence before will discount everything that follows it.\nAnthropic's enterprise guidance says the same. Productivity gains, such as hours saved, are measured through periodic user surveys. The gains are reported to stakeholders at regular intervals. The guidance pairs quantitative data with qualitative examples, in place of enthusiasm."}, {"i": 248, "l": "4.5", "d": 4, "h": "Stating Value in Four Parts", "t": "Every figure in the report appears because somebody measured it over a stated period, never because it sounds about right. A measured saving applies to its own task. The report never projects the board pack figure onto work that the trial did not include."}, {"i": 249, "l": "4.5", "d": 4, "h": "The Untested Category", "t": "State limitations plainly: what still needs a person and why, what went wrong during the pilot, and what has not been tested. People omit the untested category. This gap causes trouble later, because stakeholders take the lack of a statement as a claim. If a stakeholder is never told that some work went untrialled, the stakeholder will reasonably assume that the trial covered that work. The eventual failure is then blamed on the report that said nothing about it, as well as on the work. If the tyre fitter never tried Claude on warranty claims, naming that gap costs one sentence. If the report leaves the gap unnamed, the report loses its credibility when the gap becomes visible."}, {"i": 250, "l": "4.5", "d": 4, "h": "A Caught Error Is Evidence", "t": "A caught error is evidence for the process. Suppose a booking confirmation used the wrong date and the read-through caught the error. When you report the error, a sceptic learns that the checking step works. This is the very thing that the sceptic doubted. If the report hides the error and the error becomes visible later, readers re-read every other claim in the report as selected to look good. Reporting a caught error is the Diligence element of AI Fluency in reporting form. Diligence means that you stay accountable for what the AI produced, including in what you tell colleagues about it."}, {"i": 251, "l": "4.5", "d": 4, "h": "The Enthusiast and the Sceptic", "t": "Stakeholders have one of two attitudes, and each attitude needs something different from the same truthful account. The enthusiast, perhaps the tyre fitter's owner, wants Claude in use across the whole business by Friday. The enthusiast needs to hear the limitations and the human gate without losing the enthusiasm that will make the work progress. So the answer to \"can it handle all of it now?\" is not a plain no: the answer names what stays human. The sceptic, perhaps a fitter, suspects that Claude is a useless novelty, a risk or a threat to somebody's job. The sceptic needs the measured result, the named human step, and an honest account of what went wrong and how it was caught."}, {"i": 252, "l": "4.5", "d": 4, "h": "The Enthusiast and the Sceptic", "t": "Overcorrection fails with both audiences. Overcorrection means so many caveats that a working result sounds like a failure. Under-claiming is not honesty. It gives the sceptic a conclusion that the data does not support."}, {"i": 253, "l": "4.5", "d": 4, "h": "In the exam", "t": "A prepared candidate treats a caught error as evidence. Whether a use is permitted, and who must approve it, belongs to Domain 6. This objective covers the honest account of results to colleagues, never a governance sign-off.\nUse only measured numbers\nIn this objective's questions, the only number that can support the right answer is one that the question itself says was measured. Any option that quotes a saving that nobody measured, or that projects a measured saving onto untested work, is wrong. The option is wrong however reasonable the figure sounds."}, {"i": 254, "l": "4.5", "d": 4, "h": "Exam Traps", "t": "[Exam Trap] Presenting enthusiasm as evidence\nA transformation claim with no task, no before, no after and no measurement cannot be checked. So a sceptical audience discounts it. The audience also discounts the genuinely measured result underneath it. A defensible claim states the four parts and stops.\n[Exam Trap] Projecting a measured saving onto untested work\nA measured result belongs to the task it was measured on. Extending it to a category the trial never included quotes a number nobody measured, and the exam treats it as wrong regardless of how plausible the projection looks.\n[Exam Trap] Leaving the pilot's caught error out of the report"}, {"i": 255, "l": "4.5", "d": 4, "h": "Exam Traps", "t": "When the error becomes visible later, every other claim gets re-read as selected to look good. Disclosed, the same error was evidence that the checking step works, which is exactly what the sceptical audience needed to hear.\n[Exam Trap] Hiding a working result among many caveats\nSo many warnings make a working process sound like one that failed, handing the sceptic a conclusion the data does not support. State the measured result and its period plainly, keep the limits the trial found and name what it never tested."}, {"i": 256, "l": "4.5", "d": 4, "h": "Practice Scenario", "t": "The coordinator of a talking newspaper for blind and partially sighted listeners has trialled Claude for three months. Listener letters now reach a first draft in minutes rather than half an hour, measured across the trial, with every letter still read and approved by a volunteer before it goes out. Edition scripts saw no saving, because the recording sessions were always the bottleneck. One draft gave the wrong date for the annual listeners' tea and was caught at the read-through. The committee has asked for what the trial showed, with nothing projected or hypothetical and nothing left out. What should the report to the management committee say?"}, {"i": 257, "l": "4.5", "d": 4, "h": "Practice Scenario", "t": "Option ALead with the correspondence saving and leave out the wrong date, since one caught slip would only give the committee a reason to stop a trial that is clearly working well\nOption BOpen with the risks: list every possible failure before mentioning the saving, so nobody on the committee can later accuse the coordinator of having over-sold the trial\nOption CRecommend extending Claude to the edition scripts as well, projecting a saving on the scripts similar to the one already measured on the listener letters\nOption DReport all three findings to the committee exactly as they stand, presenting the caught date for the annual tea as evidence that the volunteer read-through does its job\n[Check Answer]"}, {"i": 258, "l": "5.1", "d": 5, "h": "Two Containers, Two Jobs", "t": "Anthropic's Help Center describes a Project as a self-contained workspace with its own chat histories and knowledge base. A Project has two configurable halves. The Help Center documents them separately because they do different work. Custom instructions are where you set how Claude should behave and respond. They tailor Claude's responses: for example, a more formal tone, or answers from the perspective of a specific role or industry. Project knowledge is the material Claude works from. You upload relevant documents, text and files to the knowledge base. Claude uses them to understand the context and background of chats in the Project. Instructions answer \"how should this work be done?\" Knowledge answers \"what should it be done from?\""}, {"i": 259, "l": "5.1", "d": 5, "h": "Two Containers, Two Jobs", "t": "This lesson uses one made-up example throughout: a window cleaning firm whose manager writes quotes and reminders every week. Each time, she tells Claude to write to homeowners in plain words and give the next visit date. Each time, she attaches the price list, the terms of service and good past replies. Both halves are ordinary setup steps in the Project screen: write and save the instructions, then use the add button to upload the knowledge files."}, {"i": 260, "l": "5.1", "d": 5, "h": "The Container Test", "t": "Configuring a Project well depends on one sorting decision, which you apply to each piece in turn. Is this a rule about behaviour, or material to consult? For the window cleaning firm, \"write to homeowners in plain words\" is behaviour, so it belongs in the instructions. The price list is material, so it belongs in the knowledge.\nThe test matters because each container has properties the other lacks. Claude applies the instructions to every chat in the Project. Claude consults knowledge when the work needs it. You can replace a knowledge file in one step when the document is revised. You have to find a policy that is pasted into the instructions and remove it by hand."}, {"i": 261, "l": "5.1", "d": 5, "h": "The Two Wrong-Container Failures", "t": "The first failure is reference material pasted into the instructions. The usual reason given is thoroughness: put the whole policy where Claude can never miss it. Then the pasted content hides the behavioural rules. When the policy is revised, the stale text stays in a place where you cannot cleanly replace it. If you paste the firm's terms of service into the instructions, the two behavioural rules then sit inside pages of terms."}, {"i": 262, "l": "5.1", "d": 5, "h": "The Two Wrong-Container Failures", "t": "The second failure is the reverse: a rule placed in the knowledge base. A house style guide uploaded as a document is material about behaviour, not an instruction. Nothing marks the style guide as a rule for every response, so the style guide is applied only when the Project happens to consult it. If the firm uploaded its style guide as knowledge, the style guide would apply only some of the time. A rule that is applied only some of the time is not a standard. A rule that the work depends on every time belongs in the instructions, stated as a behaviour."}, {"i": 263, "l": "5.1", "d": 5, "h": "Build the Setup from What You Already Do", "t": "The method needs no fresh analysis, because anyone doing the work by hand already has both lists. Whatever you re-explain at the start of every conversation is the instruction set: the audience, the tone, the format, the standing rules. Whatever you re-attach is the knowledge base: the policies, the templates, the past examples. At the window cleaning firm, the two rules become instructions and the three files become knowledge. Write the first list as behaviours and upload the second as files. Then run the next real task with a short task-only prompt, and note what you no longer had to say."}, {"i": 264, "l": "5.1", "d": 5, "h": "In the exam", "t": "This objective starts after the Project decision and tests how well you configure the Project. Whether a piece of work deserves a Project at all is Domain 3's judgement. Where a Project sits in a wider process is Domain 4's. Most questions here are a scenario that asks you to sort each piece as behaviour or material, which is the container test, so practise the test until it is automatic. Both wrong-container failures are common in real setups and make effective wrong options. Because the question begins after that decision, \"use a Project\" is never the right answer here. An option that argues that decision again belongs to Domain 3."}, {"i": 265, "l": "5.1", "d": 5, "h": "In the exam", "t": "[Key Concept] When an exam question offers competing setups, apply the container test to each piece the question mentions. The right answer puts behaviour in the instructions and material in the knowledge. The wrong options put at least one piece in the other container, usually presented as thoroughness or tidiness."}, {"i": 266, "l": "5.1", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Pasting the reference document into the custom instructions so Claude can never miss it\nPasted reference text hides the behavioural rules. When the document is revised, the old text has to be found and cut out by hand, whereas a knowledge file can be replaced in one step. Keep the rules in the instructions.\n[Exam Trap] Uploading the standing rule as a knowledge document and expecting it to govern every response\nKnowledge is material Claude consults, not standing behaviour. A rule that must hold every time gets applied only sometimes unless it is stated in the instructions, which is the job instructions exist to do."}, {"i": 267, "l": "5.1", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Skipping the Project and re-explaining and re-attaching everything in each chat, presented as keeping things current\nKeeping material current is handled by swapping the knowledge file when the source document changes. The per-chat workaround re-introduces the exact overhead the Project removes, and it depends on every user remembering to do it."}, {"i": 268, "l": "5.1", "d": 5, "h": "Practice Scenario", "t": "The secretary of a tenants and residents association has decided the estate casework and the monthly meeting papers belong in one Project and is now setting it up. Two pieces are in hand: the association repairs policy, and the rule that every letter must name the responsible officer and the date the repair was reported. Where should each go?\nOption AUpload the repairs policy to the project knowledge, and write the rule about naming the responsible officer and the report date into the custom instructions\nOption BPaste the repairs policy into the custom instructions so Claude can never overlook it, and upload a short guidance note that mentions the responsible-officer rule to the project knowledge"}, {"i": 269, "l": "5.1", "d": 5, "h": "Practice Scenario", "t": "Option CUpload both the repairs policy and a document stating the responsible-officer rule as knowledge files, and leave the custom instructions empty so the Project stays flexible\nOption DKeep both out of the Project and re-attach the policy and restate the rule at the start of each new chat, since freshly pasted material is always the current version\n[Check Answer]"}, {"i": 270, "l": "5.2", "d": 5, "h": "What You Need to Know", "t": "A Project's knowledge is the material that Claude uses inside that Project. The material reaches the Project by one of two routes. An upload puts a copy into the Project's knowledge base: documents, text, code and other files. A connector links Claude to the live source, such as Google Drive. Each route has properties the other lacks. The choice of route depends on how the material changes.\nThis lesson uses one made-up example throughout: a painter and decorator who creates a Project for quoting and job planning. The decorator's terms and conditions and method statement barely change. The job schedule is a Google Doc in Drive. It changes every week."}, {"i": 271, "l": "5.2", "d": 5, "h": "A Snapshot or the Live Source", "t": "An uploaded file is a copy taken on the day of upload. Every user of the Project sees the same copy, so it is stable and predictable. When the source is superseded, the copy stays as it was. Nothing tells you that the source was superseded. The copy looks as current in six months as on the day of upload. This stable copy suits the terms and conditions. It does not suit the job schedule, because a copy of the schedule would be wrong within a week."}, {"i": 272, "l": "5.2", "d": 5, "h": "A Snapshot or the Live Source", "t": "A connector suits material that changes, because the connector reaches the live source when you ask. The Google Workspace documentation states that Google Docs added to chats and projects sync directly from Google Drive. It says that, as a result, you are always working with the latest version. The documentation also states that Claude only accesses your data when you explicitly ask a question or request an action that requires it. It states that Claude then retrieves the minimum information needed."}, {"i": 273, "l": "5.2", "d": 5, "h": "A Snapshot or the Live Source", "t": "The latest version includes a colleague's half-finished edit at the moment of your question. If the office manager is halfway through moving Tuesday's jobs, Claude reads them half moved. Live material includes unfinished changes like this, so it is often better to upload stable reference documents."}, {"i": 274, "l": "5.2", "d": 5, "h": "Permissions and Governance", "t": "Not every workplace lets each person enable connectors for themselves. On Team and Enterprise plans, an Owner or Primary Owner needs to enable connectors for the organisation before members can use them. If connectors are off in your workspace, the right step is to ask whoever administers the workspace, not to improvise.\nThrough a connector, each person has the same access that they already have in the connected service. If someone cannot access a file in the source system, the connector cannot access it from Claude either. Two colleagues using the same Project can get different answers from the same connector. This difference is a property of the permission system, not a fault in the Project."}, {"i": 275, "l": "5.2", "d": 5, "h": "Permissions and Governance", "t": "Connectors are not read-only. They can retrieve data and take actions in connected services. The Gmail connector can send, reply to and forward email from your own account. By default Claude asks for your approval before each of these actions. The decorator still approves each quote email before Claude sends it."}, {"i": 276, "l": "5.2", "d": 5, "h": "Retrieval, Not Cover-to-Cover Reading", "t": "When a Project has a substantial knowledge base, Claude does not read all of it on every question. The documentation describes how Claude searches project knowledge and loads only the most relevant content. This search, called retrieval, activates as a project approaches or exceeds the limits of its context window. Retrieval has to find the right document among all the material that you supplied.\nTwo documented steps help. Clear, descriptive file names help retrieval find the right material. For example, \"terms-and-conditions\" is a better name than \"final-v2-new\". You can also name a specific document in your prompt to focus the search on it."}, {"i": 277, "l": "5.2", "d": 5, "h": "Curation Beats Completeness", "t": "A Project's knowledge is not an archive. Every document that is never needed adds unneeded material to the search space, which is the material that Claude searches. Such a document also gives Claude a chance to quote it at the wrong moment. A small set of relevant documents is better than a bulk upload. Remove files that are no longer in active use, rather than keeping them."}, {"i": 278, "l": "5.2", "d": 5, "h": "Curation Beats Completeness", "t": "When you receive a shared drive, pick the few documents that the work needs. Route each document by how it changes. Route material that changes, such as the decorator's job schedule, through a connector to its live source. Upload stable reference material, such as the method statement. A colleague who wants you to add everything to the Project means well. The cost appears later, as answers based on the wrong document."}, {"i": 279, "l": "5.2", "d": 5, "h": "In the exam", "t": "Exam questions test whether you match the route to the material. In almost every question, the clue is how the material changes. Domain 6 asks whether a document is permitted in the Project at all, on privacy, contractual or policy grounds. This objective is about managing material that is already allowed in the Project.\nCurrent state: where the Drive route is available"}, {"i": 280, "l": "5.2", "d": 5, "h": "In the exam", "t": "The exam guide names Google Drive as a connector to manage alongside uploads. The right answer routes material that changes through the Drive connector. As of 28 September 2026, the Google Workspace connectors article describes the Drive route as adding one document at a time. The article describes adding documents only to a private Project's Files. You add each one by searching your recent documents or pasting its link. The article says the option is disabled for shared Projects. The Files of a shared Project accept uploads. The connector still works in chats: Google Docs added to a chat sync directly from Drive. On the exam, route by how the material changes.\nWhat to notice in the exam"}, {"i": 281, "l": "5.2", "d": 5, "h": "In the exam", "t": "The right answer to an upload-or-connector question depends on how the material changes, never on how important the material is. Route the weekly job schedule through the connector, however trivial it looks. Upload the terms and conditions, which barely change, however important they are."}, {"i": 282, "l": "5.2", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Bringing in the whole shared drive so nothing is missing\nThe dump reads as diligence and is the posture curation exists to correct. Retrieval must find the right document among everything supplied, so every irrelevant file makes the relevant one harder to surface and more likely to be displaced by a wrong-moment quote.\n[Exam Trap] Choosing between upload and connector by how important the material is\nAn upload is a snapshot that goes stale silently, however important it is. Frequently revised material suits a connector, stable material an upload. Current docs (October 2026) say the Drive route works only for private Projects, so a shared Project takes a dated upload."}, {"i": 283, "l": "5.2", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Having a Team-plan user switch on an organisation connector themselves\nAn Owner or Primary Owner must enable connectors for the organisation before members can use them, so the right step is to ask the workspace administrator. Options in which the candidate tries to enable connectors personally are testing exactly this governance step."}, {"i": 284, "l": "5.2", "d": 5, "h": "Practice Scenario", "t": "A show cave preservation society is setting up the knowledge for a Project covering guide rotas, opening arrangements and volunteer communications. The guide rota and the opening times, which change with the water level after rain, live in a shared Drive folder; the constitution, the site risk assessments and the guide handbook barely change. A trustee suggests bringing in the entire shared drive so everything is available. Material unrelated to those three areas should not be in the Project. What is the best setup?\nOption AUpload everything as files, including the current rota and opening times, so every user of the Project sees exactly the same stable set of documents whenever they ask"}, {"i": 285, "l": "5.2", "d": 5, "h": "Practice Scenario", "t": "Option BBring in the entire shared drive as the trustee suggests, so every document the society holds, from committee minutes to old correspondence, is available to the Project from day one without anyone having to choose\nOption CKeep knowledge out of the Project, and have whoever is asking paste the current rota and opening times into their chat each time\nOption DAdd the rota and the opening times from Drive so chats work from the current versions, upload the constitution, risk assessments and handbook as files, and leave the rest of the drive out\n[Check Answer]"}, {"i": 286, "l": "5.3", "d": 5, "h": "What You Need to Know", "t": "In this certification, system-level instructions means the standing rules a person writes in plain English. These rules are in one of three places: the claude.ai settings, a Project, or, for an administrator, the organisation settings. There is no technical layer underneath.\nThis lesson uses one made-up example throughout: a small locksmith firm. Its office manager uses Claude for customer emails, landlord quotes and home-security guides. Some of her rules are true of her. Some are true of the quotes, some are true of everyone at the firm, and some are true only of this week. Two choices decide whether those rules work: where she places each rule, and how she words it."}, {"i": 287, "l": "5.3", "d": 5, "h": "Three Levels, Three Reaches", "t": "Each level has an owner and a reach (the conversations it applies to), and all three are documented.\nAccount-wide. The claude.ai settings have a box labelled Instructions, under Settings > Your Claude (Instructions for Claude in the older Settings layout). Anything written there applies to all of your conversations. The suggested content is personal and applies across all your work, such as preferred approaches, common terms and general communication preferences.\nProject-level. Instructions defined for a Project tailor Claude's responses in that Project's chats only."}, {"i": 288, "l": "5.3", "d": 5, "h": "Three Levels, Three Reaches", "t": "Organisation-level. On Team and Enterprise plans, Owners and Primary Owners can set organisation instructions. Claude follows them in every conversation across the organisation.\nWhere levels overlap, organisation instructions take precedence. Individual instructions still apply to anything the organisation instructions do not address. An Owner's rule on email sign-offs takes precedence over her own rule on sign-offs. Her spelling rule still applies, because the organisation set nothing on spelling."}, {"i": 289, "l": "5.3", "d": 5, "h": "Three Levels, Three Reaches", "t": "The practical point is about role, not mechanics. An ordinary member does not set organisation instructions. So if a rule should bind the whole organisation, a member asks whoever administers the workspace to add it. If she wants every colleague's drafts to omit customers' home addresses, she asks the Owner to add that rule."}, {"i": 290, "l": "5.3", "d": 5, "h": "The Placement Question", "t": "Place every rule by asking what it is true of. A rule applies to every chat at its level, so the level should match that answer.\nTrue of you across all your work, such as your language, a summary first, or a non-specialist audience by default: account-wide.\nTrue of one body of work, its audience, its format conventions, its standing rules: that Project's instructions.\nTrue of everyone in the organisation: an organisation instruction, requested through the workspace Owner.\nOnly true of today's job: not an instruction at any level, but part of today's prompt."}, {"i": 291, "l": "5.3", "d": 5, "h": "The Placement Question", "t": "Her British spelling and her rule to put the summary first are true of all her work, so they belong in the account-wide instructions. \"Show the call-out fee as its own line\" is true of the landlord quotes, so it belongs in that Project's instructions. This week's price rise belongs in this week's prompts.\nA rule at the wrong level causes problems whether the level is too wide or too narrow. A Project rule moved to account level changes every unrelated conversation. Her call-out-fee rule would appear in the security guides. A rule that belongs everywhere but stays at Project level has to be copied and maintained in every Project that needs it. Her spelling rule would need a copy in every Project."}, {"i": 292, "l": "5.3", "d": 5, "h": "Behaviour, Not Aspiration", "t": "A useful instruction is checkable: someone could see whether it was followed. \"Keep each item under ninety seconds when read aloud\" can be followed and can be failed. Claude cannot follow \"Be engaging\" in any way that differs from how the work would have gone anyway. That instruction names no behaviour, so there is nothing to check.\nThe working test for every line: could a new colleague follow this and produce what you wanted? If not, the line says what you hope for, but it is not an instruction yet. \"Sound trustworthy\" fails the test for her quotes. \"Put the price and the call-out fee in the first two lines\" passes. Aspirations also make the set longer and make it look as if it covers more than it does."}, {"i": 293, "l": "5.3", "d": 5, "h": "Short and Prioritised Beats Long and Exhaustive", "t": "Standing instructions apply to every chat in their scope, so they should contain only what is true every time. A rule that is true of only one job distorts the other jobs. An instruction set that collects per-task detail stops describing the work. It starts to describe whichever task came last. If you put the price-rise note in the quotes Project, every later quote mentions it until someone removes it."}, {"i": 294, "l": "5.3", "d": 5, "h": "Short and Prioritised Beats Long and Exhaustive", "t": "Length works the same way. Claude follows a short prioritised set more reliably than a long exhaustive one. When everything is a rule, Claude cannot follow every rule equally well. The rules that Claude follows less well are not the ones you would have chosen. When a set becomes too long for a colleague to remember, group it and prioritise it. Appending another rule does not fix it. Her quotes Project might group its rules under price, wording and layout, with price first.\nStyles are a separate control that sets how a response is formatted and delivered (see the note below). Our reading of that is that Styles are not the place for rules about content."}, {"i": 295, "l": "5.3", "d": 5, "h": "In the exam", "t": "This objective tests those two judgements: the level a rule is true of, and wording that can be checked. The point about role matches Domain 4: escalate, do not improvise. The line between a standing instruction and today's prompt is the cleanest boundary with Domain 1. Aspirations are the typical wrong option in this objective, because \"tell it to be clear and professional\" always reads as sensible advice.\n[Key Concept] Two tests settle almost every question in this objective. Who or what does this rule apply to? The answer sets the level. Could a new colleague follow it and be checked against it? The answer sets the wording. The right answer passes both tests. Each wrong option fails exactly one."}, {"i": 296, "l": "5.3", "d": 5, "h": "A Note on Styles", "t": "The Help Center covered Styles only in one formatting comparison, so the point about substance is our reading, not a documented statement. Current state (checked 30 September 2026): the personalisation article no longer mentions Styles. Its formatting comparison names Skills for customising how Claude formats and delivers responses."}, {"i": 297, "l": "5.3", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] An aspiration written as an instruction: be professional, be thorough, produce high-quality work\nAspirations cannot be followed differently from the default and cannot be failed, so they change nothing and make the useful rules harder to follow. A checkable behaviour gives a new colleague something to follow and be checked against.\n[Exam Trap] Writing this week's requirement into the standing instructions\nA standing instruction applies to every chat in its scope. A rule true of one job distorts every other job until someone remembers to remove it; it belongs in that job's prompt, which is where the Domain 1 boundary sits."}, {"i": 298, "l": "5.3", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Placing one Project's rules at account level, or setting an organisation-wide rule personally as an ordinary member\nAccount-wide rules change every unrelated conversation. Organisation instructions are set by Owners and Primary Owners on Team and Enterprise plans. So an ordinary member asks whoever administers the workspace. An Owner sets the rule directly."}, {"i": 299, "l": "5.3", "d": 5, "h": "Practice Scenario", "t": "An easy-read editor at a learning-disability self-advocacy charity is writing the Project instructions for the easy-read document summaries the charity produces for its members. Every line must still hold for documents produced years from now. Which instruction set will a volunteer checking the outputs be able to use?\nOption AUse the sentence-length and everyday-word rules, plus a standing line to always include the closing date of the current member survey, because it matters to members right now\nOption BBe clear, respectful and accessible at all times, and always produce high-quality easy-read documents that members of the charity will find genuinely useful"}, {"i": 300, "l": "5.3", "d": 5, "h": "Practice Scenario", "t": "Option CKeep sentences under fifteen words with one idea each, use everyday words, explain any difficult word in brackets on first use, and end each summary by saying what the reader can do next\nOption DPut the sentence-length and everyday-word rules in her account-wide Instructions for Claude rather than the Project, so every conversation she has follows the easy-read rules\n[Check Answer]"}, {"i": 301, "l": "5.4", "d": 5, "h": "What You Need to Know", "t": "A configuration is the setup of a Project: its custom instructions and its knowledge base. Claude applies the instructions to every chat within the Project. Claude also uses anything uploaded to the knowledge base in every chat within the Project. Keeping a configuration right has three duties: inform, maintain and update. The work has three parts: check on a schedule, remove old items rather than keep adding new ones, and remember the people that the configuration serves.\nThis lesson uses one made-up example throughout: a pet shop that configured a Project well last year to answer customer questions. Its knowledge base holds the price list and the returns policy. Nobody has changed the Project since."}, {"i": 302, "l": "5.4", "d": 5, "h": "Three Ways a Good Setup Decays", "t": "Knowledge becomes out of date. An uploaded file is a copy from one moment, and nothing tells you that its source was superseded. Outputs continue to quote the old policy, price or procedure with complete confidence. At the pet shop, last year's price list still answers price questions.\nInstructions become out of date. They apply to every chat, whether or not the situation they describe still exists. When the audience or the format changes, the rules continue to enforce the old situation.\nThe scope grows. When a Project works, people start to use it for related work. With each new task, the instructions written for the original job fit the work less well, until they fit none of the work."}, {"i": 303, "l": "5.4", "d": 5, "h": "Three Ways a Good Setup Decays", "t": "All three problems are invisible while you use the Project, so you have to schedule maintenance. If you wait for a sign that maintenance is needed, that sign never comes."}, {"i": 304, "l": "5.4", "d": 5, "h": "Remove, Do Not Accumulate", "t": "When a document is superseded, remove the old version. Do not add the new one alongside it. Completeness is a good quality in an archive. A working Project needs exactly one answer to which version is current. If a knowledge base holds both versions, Claude has no way to know which version is current. The pet shop uploads the new price list and deletes the old one.\nTwo compromise options fail: a note file explaining which version governs, or an instruction telling Claude to prefer the newer document. Both options compensate for a problem that the knowledge base should simply not have."}, {"i": 305, "l": "5.4", "d": 5, "h": "Remove, Do Not Accumulate", "t": "After you replace a document, also read the instructions for rules written for the old wording. A standing rule that quotes the old notice period stays after its source file is gone. At the pet shop, that rule might quote last year's returns window."}, {"i": 306, "l": "5.4", "d": 5, "h": "Informing Is a Human Step", "t": "When colleagues share a Project, an unannounced change produces outputs that they cannot explain. They stop trusting those outputs. The person who made the change is rarely present when this happens.\nThe documentation gives one notification fact: members receive an email notification when a project is first shared with them. The documentation describes no notification of any kind for later edits to knowledge or instructions. So telling collaborators what changed and when is always a human step."}, {"i": 307, "l": "5.4", "d": 5, "h": "Informing Is a Human Step", "t": "The date matters as much as the change, because it lets people tell whether work in progress was done before or after the change. People can recognise a reply drafted last week as pre-revision, instead of arguing about it. The pet shop's manager tells staff which file changed and on what day. Where a plan supports shared editing, several people may hold edit permission on the same Project. This makes it more important to say what changed."}, {"i": 308, "l": "5.4", "d": 5, "h": "The Maintenance Habit", "t": "The habit that works has three parts.\nFirst, a named owner. \"Someone should keep this current\" means nobody does. A Project that has slowly gone out of date usually has no owner. The pet shop names its manager as owner.\nSecond, a review point tied to a real recurring event: the quarterly figures, the policy refresh, the start of the season. A diary note attached to something that already happens makes the review happen. A general intention does not. The pet shop reviews its Project whenever a new price list arrives.\nThird, treat removal as an active step of the review. Additions happen naturally all year. Deletions happen only when someone asks which items are superseded and which have never been used."}, {"i": 309, "l": "5.4", "d": 5, "h": "In the exam", "t": "The guide names the three duties. Every exam version of this objective is the same Project: a Project that was configured well once and has drifted since. Update matters least, because updating is easy once you have noticed. The guide names Inform explicitly, and almost everyone skips it.\nTwo boundaries apply. A question that opens with a bad output and asks what went wrong belongs to Domain 7. A perfectly maintained Project still produces first drafts whose facts get verified under Domain 2.\nThe additive trap"}, {"i": 310, "l": "5.4", "d": 5, "h": "In the exam", "t": "The wrong option that keeps both versions feels thorough and careful. This feeling is why the option is wrong: it treats a working tool as if it were an archive. The right answer removes the superseded version, checks the instructions, and tells the people who use the Project."}, {"i": 311, "l": "5.4", "d": 5, "h": "A Note on Sources", "t": "No Anthropic article covers editing a saved configuration or telling collaborators it changed. This lesson is based on the exam guide's objective wording, ordinary professional practice and the one documented sharing notification."}, {"i": 312, "l": "5.4", "d": 5, "h": "Exam Traps", "t": "[Exam Trap] Uploading the revised document while keeping the superseded version, sometimes with a note saying which is current\nNothing tells Claude which version governs, so outputs can cite either. A working Project needs one current version and the old one removed; completeness belongs in the archive, not the knowledge base.\n[Exam Trap] Adding an instruction telling Claude to prefer the newer document\nThis patches the instructions to compensate for a knowledge base that should simply be curated. The superseded document should not stay in a working Project, and the patch itself becomes one more stale rule to maintain.\n[Exam Trap] Assuming the system will tell colleagues the configuration changed"}, {"i": 313, "l": "5.4", "d": 5, "h": "Exam Traps", "t": "The only documented notification is the email when a project is first shared. None is documented for later edits to knowledge or instructions, so tell colleagues yourself."}, {"i": 314, "l": "5.4", "d": 5, "h": "Practice Scenario", "t": "A bird observatory trust runs a Project that the bookings secretary and two other committee members use for overnight-stay booking correspondence. The booking terms were revised in March. Letters have started quoting the old cancellation notice period, and the secretary finds both versions of the terms in the project knowledge. The trust intends to keep the Project as its booking workspace. What should she do?\nOption ARemove the superseded terms, check the instructions for any rule written for the old wording, and tell the other two committee members what changed and when\nOption BStop using the Project for booking letters and have each member attach the current terms to every new chat instead"}, {"i": 315, "l": "5.4", "d": 5, "h": "Practice Scenario", "t": "Option CUpload the March version of the terms again and add a line to the custom instructions telling Claude to prefer the newer document wherever the two versions disagree\nOption DAdd a note file to the knowledge base stating that the March version is current, and keep both versions of the terms so the Project holds a complete record of how they have changed\n[Check Answer]"}, {"i": 316, "l": "6.1", "d": 6, "h": "What You Need to Know", "t": "Two questions decide whether a task goes to Claude. Fit asks whether Claude would do the work well: the right shape, the right volume, output someone can check. Domain 4 covers fit. Appropriateness asks whether the task should be delegated to Claude at all. It looks at different evidence: the stakes, the authority the work requires, and who is accountable for the outcome. A task can be a perfect practical fit and still be work that only a qualified human should do."}, {"i": 317, "l": "6.1", "d": 6, "h": "Fit Is Not Permission", "t": "This lesson uses one made-up example throughout: a bike shop. Its owner has two jobs to do. One is a long series of customer reviews to summarise into themes. The other is a stack of applications for a mechanic's job, to score so that the owner can pick the person to hire. Scoring the applications is an excellent practical fit: structured, voluminous, checkable. It can still be inappropriate, because of what the scoring decides and who cannot challenge it. The wrong answer that appears often bases its reasoning on quality: Claude would do the task quickly and well, so it must be fine to delegate. The quality of the output does not decide whether the task is appropriate."}, {"i": 318, "l": "6.1", "d": 6, "h": "The Four Inappropriate Categories", "t": "Four recognisable categories make a use inappropriate."}, {"i": 319, "l": "6.1", "d": 6, "h": "The Four Inappropriate Categories", "t": "The first is work that needs professional authority: legal, medical, financial and safeguarding judgements. A qualified person must make these and be accountable for them. Claude can help someone prepare, summarise or understand. Claude cannot be the source of the advice. At the bike shop, medical advice for an injured customer must come from a qualified person. The Usage Policy names the settings where this category applies most. Its High-risk Areas include legal and medical advice, finance, credit, insurance, housing, employment, education and healthcare access. In these areas a qualified person must review Claude's recommendation before it is given as advice or used to make a decision. The policy also states: \"The qualified person remains responsible for the accuracy and appropriateness of what is delivered or decided.\" The policy excludes wellness content, such as education on sleep, stress, nutrition or exercise."}, {"i": 320, "l": "6.1", "d": 6, "h": "The Four Inappropriate Categories", "t": "The second is a consequential decision about identifiable people: who gets the job, the award, the sanction, the visit. Poor output is not the reason. Nobody is accountable for the decision, and the person affected cannot challenge it. The scoring of the mechanic applications belongs in this category.\nThe third is fabrication presented as real: invented quotes, testimonials, case studies or evidence, such as customer testimonials the shop writes itself. Plausibility makes fabrication worse, because a convincing invention is easier to believe. The Usage Policy's prohibitions on misinformation and deceptive practices are the basis of this category."}, {"i": 321, "l": "6.1", "d": 6, "h": "The Four Inappropriate Categories", "t": "The fourth is anything the Usage Policy or the organisation's own policy prohibits. Objective 6.3 covers this category."}, {"i": 322, "l": "6.1", "d": 6, "h": "The Substitution Test", "t": "One test decides whether a task is appropriate. Picture a capable, well-meaning colleague who has:\nno professional qualification in the area\nno access to the person's history\nno accountability for the outcome\nWould you accept this piece of work from them? The test changes an abstract question about appropriateness into an ordinary judgement about delegation. Every professional already makes that judgement. The review summary passes: the same colleague could write it, and the owner would check it. The mechanic scoring fails on all three grounds at once. Anthropic's AI Fluency framework names this skill Delegation."}, {"i": 323, "l": "6.1", "d": 6, "h": "Most Work Is Appropriate", "t": "The broad range of appropriate uses matters as much as the four categories. Official documentation describes a deliberately broad range of appropriate uses: writing across formats, summarising long documents, brainstorming, analysing images and data, translating. Drafting, reformatting, analysing material you hold, and preparing someone to make a decision are all appropriate. The inappropriate categories are narrow and specific. If you treat everything near them as forbidden, you abandon work that a simple safeguard would enable. The owner can still ask Claude to summarise each application, then read the applications and choose."}, {"i": 324, "l": "6.1", "d": 6, "h": "In the exam", "t": "This objective asks a different question from the rest of the certification. Candidates who come to it from Domain 4 reliably answer the wrong question. The substitution test covers everything the exam asks. The exam also marks over-caution as wrong: the right answer almost always makes the work possible within the rules.\nWhat to notice in the exam"}, {"i": 325, "l": "6.1", "d": 6, "h": "In the exam", "t": "Adding review to an inappropriate delegation does not repair it. Suppose a manager checks the output of a consequential decision about identifiable people. The check restores neither accountability for the judgement nor the affected person's ability to challenge it. When the owner reads every applicant's score, neither of those two things changes. Exam options that offer review as the fix test exactly this point."}, {"i": 326, "l": "6.1", "d": 6, "h": "In the exam", "t": "The Usage Policy's review rule answers a different question. It applies where a use in a High-risk Area proceeds. For that case, the policy states this requirement: \"A qualified person must meaningfully review a High-risk AI Recommendation, with the authority to change or modify it, before it is delivered as advice\". There, review is a mandatory control, and objective 2.4 teaches it as the standard. Review cannot convert a decision that should not have been delegated into one that should. Ask whether the delegation is appropriate first. Only then does the review requirement apply."}, {"i": 327, "l": "6.1", "d": 6, "h": "In the exam", "t": "The AI Fluency framework lists the four Ds as module names and does not define them. Reading Delegation as \"deciding what to hand to AI and what to keep\" is our own interpretation. The Help Center's use-case article lists what Claude is for and contains no prohibitions. The inappropriate categories are based on the Usage Policy and the exam guide."}, {"i": 328, "l": "6.1", "d": 6, "h": "Exam Traps", "t": "[Exam Trap] Adding a human reviewer to an inappropriate delegation and treating that as the fix\nAdding review to an inappropriate delegation does not repair it. A reviewer who approves a decision made elsewhere restores neither the judgement nor a reasoned answer to the affected person's appeal. Keep the decision with an accountable person.\n[Exam Trap] Accepting the argument that a use is fine because the results stay inside the organisation\nKeeping an output in-house restores neither accountability for the decision it contains nor the affected person's ability to challenge it. Keep the decision with a named, accountable person.\n[Exam Trap] Declining both halves of a mixed proposal"}, {"i": 329, "l": "6.1", "d": 6, "h": "Exam Traps", "t": "Declining everything looks cautious but loses help Claude can appropriately give. When a proposal mixes appropriate and inappropriate work, keep the appropriate half and decline only the inappropriate one."}, {"i": 330, "l": "6.1", "d": 6, "h": "Practice Scenario", "t": "A children's centre manager is asked to use Claude on the annual family survey. Two proposals arrive together: summarise three hundred free-text responses into themes for the service review, and score individual families' responses to flag which should receive a home visit. The service review needs the themes. Centre policy allows Claude on the survey text and bars any tool from scoring families for home visits. What should the manager do?\nOption ASummarise the responses into themes once identifying details are removed, and keep the home-visit flagging with the qualified staff of the centre\nOption BRun the scoring as proposed, and have the deputy manager review every flagged family before any visit, so a person stays involved"}, {"i": 331, "l": "6.1", "d": 6, "h": "Practice Scenario", "t": "Option CDecline both proposals, since family survey material is too sensitive for any AI tool to touch\nOption DRun both pieces of work, since the survey data never leaves the centre and the families consented to its use for service planning when they completed the survey\n[Check Answer]"}, {"i": 332, "l": "6.2", "d": 6, "h": "What You Need to Know", "t": "Sensitive material is anything that an organisation should not give to an outside service without a decision. It may be personal data, or it may be material that is sensitive because of who owns it or what was promised about it. A safeguard changes what leaves the organisation. The ladder is four safeguards in a fixed order. A placebo is a step that acts only after the material leaves the organisation."}, {"i": 333, "l": "6.2", "d": 6, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a day nursery. Its manager wants Claude to explain why fee arrears rose this term. Her spreadsheet holds each child's name, date of birth, address and allergy notes, and parents' account numbers and payments. If she uploads the spreadsheet unchanged, everything in it leaves the nursery. If she refuses, the arrears stay unexplained. The answer is between these two extremes: a safeguard that lets the work proceed within policy."}, {"i": 334, "l": "6.2", "d": 6, "h": "Recognising Sensitive Material", "t": "The obvious list is names, addresses, dates of birth, reference and account numbers, health information, financial details, and anything about children. People miss the categories about ownership and promises:\ninformation held under a duty of confidence\ncommercially confidential figures\nthird-party material governed by a contract that says how it may be handled\nA supplier's pricing schedule has no personal data. It can still be the most restricted document on the desk, because a contract may govern it. The price list from the nursery's food supplier is an example."}, {"i": 335, "l": "6.2", "d": 6, "h": "Recognising Sensitive Material", "t": "Anthropic's Usage Policy counts confidential or proprietary data as private information. It also counts non-public contact details and health data as private information. Under the policy, private information is not to be misused or accessed without permission. The policy also prohibits violating privacy rights as defined by applicable privacy laws, such as sharing personal information without consent.\nAnthropic's protections article describes encryption in transit and at rest. It also says that Anthropic bars employee access by default. These measures protect the data that Anthropic holds. They do not replace your organisation's own decision about what may leave the organisation."}, {"i": 336, "l": "6.2", "d": 6, "h": "The Ladder, in Order", "t": "Each safeguard on the ladder preserves more of the work than the safeguard below it. So use the lowest safeguard that works.\nRemove. Most analysis does not need the names. Remove the identifiers and proceed today. The arrears question needs payment patterns, so the manager removes the children's names and addresses.\nAnonymise or aggregate. Use cohorts (groups of people) instead of individuals, and use ranges instead of exact figures. The nursery can group families by room and show arrears as ranges.\nUse an authorised route. Move the work to a sanctioned workspace, which is the Claude workspace that your organisation provides, under an agreement that covers this class of material."}, {"i": 337, "l": "6.2", "d": 6, "h": "The Ladder, in Order", "t": "Seek authorisation. Ask whoever owns the data or the policy. Seeking authorisation is an action, not a refusal.\nAbandonment is at the bottom. Anonymisation lets the analysis proceed, so abandoning the analysis gains nothing."}, {"i": 338, "l": "6.2", "d": 6, "h": "Why the Placebo Fails", "t": "The policy control is about what leaves the organisation. The material leaves at upload, and a later step cannot undo the upload. Every placebo fails for this reason. The placebos are telling Claude to forget the material, declaring the upload confidential, adding a confidentiality line to the prompt, or deleting the conversation. If the nursery manager uploads the full spreadsheet and then asks Claude not to retain it, the details have still left the nursery. Nothing that is typed into the chat can retroactively govern what was uploaded. The safeguard happens before the upload or not at all."}, {"i": 339, "l": "6.2", "d": 6, "h": "Which Product Are You On?", "t": "Two current Anthropic privacy articles share the exact title \"Is my data used for model training?\". One article covers consumer products, and the other covers commercial products. The two articles give different answers. By default, Anthropic does not use inputs or outputs from its commercial products, such as Claude for Work, to train its models. Data handling depends on the plan, and the details have changed over the history of the documents. So ask three questions rather than memorise today's answer. Which product am I on? What does its documentation say today? What does my organisation's agreement add? The nursery manager asks these questions first. Objective 6.3 covers what follows from the answers."}, {"i": 340, "l": "6.2", "d": 6, "h": "In the exam", "t": "In the guide's sample question for this domain, a project manager wants to upload a spreadsheet of customer names and account numbers. The right answer neither uploads the spreadsheet as it is nor abandons the analysis. It anonymises the spreadsheet so the work can proceed within policy. This pattern shows the whole objective in one example: a safeguard that enables the work, between two wrong extremes. The exam tests the order of the ladder. Abandonment is almost never the right answer, because the guide's rationale says anonymisation enables the analysis. It also says instructing the model not to retain data does not satisfy the policy control.\nWhat to notice in the exam"}, {"i": 341, "l": "6.2", "d": 6, "h": "In the exam", "t": "Any option whose safeguard acts after the upload is wrong. No placebo is ever the right answer. The right answer changes what is uploaded, not what happens afterwards.\nDeletion and retention details change often. The Domain 6 quick reference has the current, dated figures."}, {"i": 342, "l": "6.2", "d": 6, "h": "Exam Traps", "t": "[Exam Trap] Treating a confidentiality instruction or later deletion as the safeguard\nThe exam guide says instructing the model not to retain data does not satisfy the policy control. The disclosure happens at upload, so a later instruction or deletion cannot undo it. Remove or anonymise the identifiers before uploading.\n[Exam Trap] Escalating up the ladder when removal is enough\nMoving the work to a sanctioned workspace or seeking authorisation looks diligent, but when simple removal of the identifiers lets the work proceed today, the higher rungs cost time for no protective gain. Use the lowest safeguard that works.\n[Exam Trap] Approving a document for upload because it contains no names"}, {"i": 343, "l": "6.2", "d": 6, "h": "Exam Traps", "t": "Sensitivity is not only personal identifiers. Duty of confidence, commercial confidentiality and third-party contractual restrictions apply even when no one is named. Check whose material it is and what the agreement allows, then leave it out or ask the owner.\n[Exam Trap] Dropping the analysis because personal data is involved\nAbandoning the task is unnecessary when anonymisation enables it. Removing the identifiers lets the analysis proceed within policy, so abandoning the task loses a legitimate insight and gains nothing. Strip or anonymise first, then run it."}, {"i": 344, "l": "6.2", "d": 6, "h": "Practice Scenario", "t": "A minibus driver training scheme's coordinator wants to use Claude to understand why pass rates dropped this year. The trainee records contain names, licence numbers, dates of birth and medical fitness declarations. The scheme's data policy allows personal or health details into an AI tool only where the task cannot be done without them. What is the most appropriate way to proceed?\nOption AStrip the identifiers and medical declarations from the records, then analyse pass rates by cohort, instructor and course date\nOption BUpload the records as they stand, since the analysis is an internal review and the results will stay inside the scheme"}, {"i": 345, "l": "6.2", "d": 6, "h": "Practice Scenario", "t": "Option CConclude that trainee records are too sensitive to give to Claude at all and compile this year on paper instead\nOption DUpload the records with a confidentiality instruction in the prompt, then delete the conversation once the analysis is done\n[Check Answer]"}, {"i": 346, "l": "6.3", "d": 6, "h": "What You Need to Know", "t": "The sanctioned workspace is the Claude workspace that your organisation provides. A personal account is an account that an individual holds for themselves. Shadow AI is work material in an AI tool that the organisation does not provide. The rule is short: use the workspace that your organisation provides. The rule sounds like etiquette. It has real reasons behind it. Understanding what the rule is based on lets you answer any version of the question without memorising a table."}, {"i": 347, "l": "6.3", "d": 6, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a minicab firm that provides Claude to its office staff. A new dispatcher's access has not arrived, and a hotel contract is due on Friday. She pastes the contract and the complaints log into her personal Claude account because it is quicker. The bookings manager discovers this."}, {"i": 348, "l": "6.3", "d": 6, "h": "Why the Sanctioned Workspace Is Substance", "t": "When an organisation provides Claude, the arrangement governs how Anthropic handles the organisation's data. The organisation decides what happens to its data. Anthropic handles the data only on the organisation's instructions. In the Privacy Center's terms, the customer is Controller of the data that its users submit. Anthropic is Processor on the customer's behalf. The commercial training article states that by default Anthropic will not use inputs or outputs from commercial products to train its models. Administrators control the workspace's settings. On the Enterprise plan, the organisation sets custom retention timelines for its data. Users still delete their own chats from their visible history. The organisation controls the workspace's retention, but it does not control the deletion action. The agreement, the administration and the data handling all apply to the sanctioned workspace. The rule protects these three things. In the firm's workspace, the firm's agreement would cover the contract."}, {"i": 349, "l": "6.3", "d": 6, "h": "Personal Accounts Are Different", "t": "The individual's own consumer relationship with Anthropic governs a personal account. The individual's own settings decide whether Anthropic uses the chats for model improvement. Consumer deletion and retention rules apply. The employer does not administer, see or govern any of it. The problem is not carelessness. The organisation's agreement and controls do not apply to the account. The dispatcher's own agreement now covers the hotel contract, not the firm's agreement. A paid personal plan with careful settings would change nothing, because the question is whose agreement governs the data."}, {"i": 350, "l": "6.3", "d": 6, "h": "The Shadow-AI Response Has Two Halves", "t": "The response to a colleague's workaround has two halves. First, do not copy the workaround, however urgent the deadline is. Second, report the workaround to whoever owns the policy or the data. The disclosure has already happened, and someone with the authority to handle it needs to know. An unreported workaround also continues. The colleague's underlying problem is real: access has not arrived for work that is due. Only the organisation can fix this problem. When you report the workaround, the organisation learns that its access process is too slow. So reporting is not an accusation against a colleague. The bookings manager keeps her own work in the workspace. She tells the policy's owner about the disclosure and the late access. Asking the dispatcher to delete her chats or close her account does not undo the disclosure, because the contract has already left the firm."}, {"i": 351, "l": "6.3", "d": 6, "h": "Policy Silence and Working Habits", "t": "When a policy is silent on a question, the question has not been answered. The professional action is to ask the policy's owner. This is the escalation that objective 6.2 teaches. It is an action, not a refusal. If the firm's policy says nothing about pasting complaints into Claude, the bookings manager asks the policy's owner first. The basic working habits are plain, and the exam can test them:\nknow which account and plan you work in\nknow who administers it\nfollow the rules for what may be uploaded\nknow how to report a problem\nWhen policy conflicts with convenience, the policy takes priority. When the policy is genuinely wrong or too slow, ask its owner to change it rather than bypass it."}, {"i": 352, "l": "6.3", "d": 6, "h": "In the exam", "t": "The scenario that appears often in the exam describes a colleague who uses a personal account for work material. The colleague does this because it is quicker or their access has not arrived. Candidates who treat the rule as etiquette lose marks to wrong options that are based on good intentions. The right answer does both halves, and candidates reliably miss the second half. Wrong options offer the first half alone, or deleting chats and closing the account as a remedy, or a paid personal plan with careful settings. The most common wrong option treats anything that the policy does not mention as allowed.\nBoundary discipline"}, {"i": 353, "l": "6.3", "d": 6, "h": "In the exam", "t": "Objective 6.2 covers whether material may be uploaded at all. Domain 4 covers how to design a process. In this objective, you escalate to whoever owns the policy or the data, never to a technical specialist.\nAnthropic publishes no guidance on what an organisational AI policy should contain. This objective is based on the exam guide's wording and on the documented product differences that underlie the sanctioned workspace."}, {"i": 354, "l": "6.3", "d": 6, "h": "Exam Traps", "t": "[Exam Trap] Fixing only half of the shadow-AI situation\nDeclining to copy the workaround while saying nothing leaves the disclosure unknown and the access gap unfixed, so the workaround continues. The right answer does both halves: stop the practice and raise it with whoever owns the policy or the data.\n[Exam Trap] Offering deletion as remediation for material already disclosed\nDeleting conversations or closing the account is a step taken after the disclosure: the material has already left the organisation, and nobody with authority knows about it or the access gap. Stop the workaround and report both to whoever owns the policy or the data.\n[Exam Trap] Treating policy silence as permission"}, {"i": 355, "l": "6.3", "d": 6, "h": "Exam Traps", "t": "A policy that does not mention something has not answered the question. Assuming permission converts a gap in a document into an unauthorised disclosure; the right move is asking the policy owner, which is an action, not a refusal."}, {"i": 356, "l": "6.3", "d": 6, "h": "Practice Scenario", "t": "The operations lead at a recycling social enterprise discovers that a colleague has been pasting the local authority contract and staff shift records into a personal free Claude account at home, because the organisation's licences have not been issued yet and the work is due. The enterprise's data rules keep its material out of personal accounts on any plan, and any slip must be reported. What should the operations lead do?\nOption AAsk the colleague to delete the conversations and her account history, and confirm that the contract and the shift records are no longer held anywhere outside the organisation\nOption BLet it continue until the licences arrive, since the colleague is careful about what she pastes and the work genuinely cannot wait"}, {"i": 357, "l": "6.3", "d": 6, "h": "Practice Scenario", "t": "Option CMove the work onto his own personal account instead, since he pays for a plan with stricter data settings, closer to what the organisation will provide\nOption DStop the personal-account work now, and tell whoever owns the policy about the disclosure and the licence delay so both get dealt with\n[Check Answer]"}, {"i": 358, "l": "6.4", "d": 6, "h": "What You Need to Know", "t": "Accountability means being responsible for work when the work goes wrong. Disclosure means telling people that AI helped to make the work. A stakeholder is anyone whom the work affects. Domain 2 asks whether an output is correct. This objective asks who owns the output, who deserved to know how it was made, and whom the output describes. Unlike most objectives in this domain, this objective has little documentation.\nThis lesson uses one made-up example throughout: a family-run takeaway that uses Claude for its newsletter, its website order chat and the weekly specials. The head cook used to write the weekly specials."}, {"i": 359, "l": "6.4", "d": 6, "h": "Accountability", "t": "The person whose name is on the work owns it: the email's sender, the report's publisher, the letter's signer. Saying that Claude drafted the work describes the production method. It is like saying that an assistant typed the work. The statement moves no responsibility. The Usage Policy includes this rule in its high-risk requirements. The policy names High-risk Areas, such as legal or medical advice. When Claude's output becomes advice or a decision in one of these areas, a qualified person must \"remain accountable for what is delivered or decided\". The AI Fluency framework calls the same duty Diligence."}, {"i": 360, "l": "6.4", "d": 6, "h": "Accountability", "t": "If the newsletter prints a wrong price under the owner's name, the owner owes the correction. Blaming Claude, or whoever configured the Project, only explains how the error happened. Under pressure, that blame is tempting, so practise the rule until you apply it automatically."}, {"i": 361, "l": "6.4", "d": 6, "h": "When Disclosure Is Owed", "t": "The Usage Policy sets one categorical rule. Consumer-facing chatbots and external-facing AI agents must tell users that they are interacting with AI rather than a human. This disclosure must happen at a minimum at the beginning of each chat session or in the product interface. The takeaway's order chat can open each conversation by saying that it is AI, or it can show a label in the chat window. A line in a privacy notice elsewhere on the site does neither of these things.\nFor everything else, disclosure depends on proportion, and both extremes are wrong. Nobody declares AI assistance on a routine internal email, such as the staff rota. Declaring everything is over-caution. Disclosure is owed when:"}, {"i": 362, "l": "6.4", "d": 6, "h": "When Disclosure Is Owed", "t": "the reader's trust depends on who did the thinking or the judging: assessed work, a professional opinion\na claim of authorship would be false\na policy or client agreement requires it"}, {"i": 363, "l": "6.4", "d": 6, "h": "When Disclosure Is Owed", "t": "The test is what the reader relies on. If the reader relies on the information, disclosure adds little. If the reader relies on the fact that you did the thinking, disclosure is owed. A personal message such as condolence, or thanks meant as your own feeling, is different. The reader of such a message relies on the feeling being your own. A disclosure note cannot restore that, so you write the message yourself. An organisation's routine thank-you letters are ordinary drafting work. The newsletter's prices need no note. The owner writes the thank-you card for a retiring driver without Claude."}, {"i": 364, "l": "6.4", "d": 6, "h": "Fairness Is a Different Review from Accuracy", "t": "An output can pass every accuracy check and still be unfair. Descriptions of groups, communities, applicants or service users can repeat assumptions that the facts never required. Suppose that the newsletter's delivery section presents one estate as a problem, a village as declining and older customers as resistant to change. Every delivery time is correct, yet the people that the section describes still see the unfairness at once. Checking the numbers misses the unfairness, because the unfairness is in how the section presents people. This unfairness needs a different reviewer: someone who knows those customers and reads for how the section describes them. The Usage Policy also prohibits using Claude to critique anyone's body shape or size. The policy treats such critique as promoting unhealthy body image."}, {"i": 365, "l": "6.4", "d": 6, "h": "Fairness Is a Different Review from Accuracy", "t": "Domain 2 covers spotting bias as an evaluation skill. This objective covers the responsibility half: whose job it is to catch unfairness in work about people before publishing. It also covers what the publisher owes when unfairness is published."}, {"i": 366, "l": "6.4", "d": 6, "h": "Colleagues Are Stakeholders Too", "t": "The stakeholder that most candidates never consider is the person whose work changes. When Claude starts to do part of a process, the colleagues who do that work need to know what changed and why. When colleagues discover that a shared task was automated without notice, that discovery damages the trust that disclosure protects. So the owner tells the head cook before Claude's first specials board is displayed. Using Claude to produce a colleague's contribution without telling them is an ethical question of honesty between colleagues, not a question of output quality. Examples are appraisal comments that the colleague was meant to write and a section that the colleague was meant to own."}, {"i": 367, "l": "6.4", "d": 6, "h": "In the exam", "t": "Questions ask who owns an output, who should have known, who is described, or whose work changed. The right answer keeps accountability with the person named on the work. Wrong options spread accountability onto the tool or the Project's configurer, or offer a general rule to declare everything, which is over-caution.\nWhat to notice in the exam\nAn option whose main content is checking, cross-referencing or validating belongs to a Domain 2 objective. The right answer for objective 6.4 is always about ownership, disclosure, fairness or colleagues."}, {"i": 368, "l": "6.4", "d": 6, "h": "Where These Rules Come From", "t": "This lesson extends the Usage Policy's high-risk accountability rule to everyday workplace outputs. This extension is the exam guide's objective, interpreted through ordinary professional practice. The same two grounds support the disclosure framework beyond the chatbot rule. They also support the section on colleagues. No first-party document covers either of these."}, {"i": 369, "l": "6.4", "d": 6, "h": "Exam Traps", "t": "[Exam Trap] Transferring accountability to the tool or its configurer\nExplaining that Claude produced the figure, or that someone else set up the Project, describes how the error was made, not who owes the correction. Responsibility attaches to the name on the work, so the author corrects the figure and fixes the check.\n[Exam Trap] Using disclosure to avoid blame or as a rule for every output\nAn AI-assistance note added to soften ownership of an error misuses disclosure, and declaring assistance on every routine output is over-caution that drowns the cases where it genuinely matters. Disclosure is about what the audience is relying on, not a ritual or a deflection."}, {"i": 370, "l": "6.4", "d": 6, "h": "Exam Traps", "t": "[Exam Trap] Signing off work about people once the figures are confirmed as correct\nFairness failures survive accuracy checks by definition. The characterisation review is a separate pass by someone who knows the people described, and an option that stops at verified figures has answered the accuracy question while the ethical one is still open."}, {"i": 371, "l": "6.4", "d": 6, "h": "Practice Scenario", "t": "The clerk of an almshouse charity publishes the annual report to residents and donors, largely drafted by Claude from the charity's own maintenance and occupancy records. A resident spots that the report overstates how quickly repairs were completed last year, and asks the clerk who wrote it. What is the professional response?\nOption AAmend the figure quietly in the online copy so the record is accurate without drawing further attention to the mistake\nOption BAdd a note to the report disclosing that AI was used in the drafting, so readers can weigh the figures accordingly\nOption CExplain that the figure came from an AI-assisted draft, so the error is a software fault the charity will raise with the provider of the tool"}, {"i": 372, "l": "6.4", "d": 6, "h": "Practice Scenario", "t": "Option DOwn the error as the author of the report, issue the correction to residents and donors, and fix the checking step that let it through\n[Check Answer]"}, {"i": 373, "l": "7.1", "d": 7, "h": "What You Need to Know", "t": "A poor output is a response that fails to give what the request needed. To diagnose a poor output, y
