ou name why a reasonable-looking request produced it, before you change anything. A Project's configuration is its instructions and knowledge.\nThis lesson uses one made-up example throughout: an independent bookshop. Its owner keeps a Project for the weekly new-titles newsletter. The owner asks for one-off shelf cards in ordinary chats."}, {"i": 374, "l": "7.1", "d": 7, "h": "The Routing Question", "t": "The most useful diagnostic test is one question: did the problem happen once, or does it happen every time? A bland summary from one request that gave too little information is a prompt problem. A better brief fixes it. The same wrong tone, format or assumption in every output from the same Project is a configuration problem. The sign to look for is the word every. The Project's instructions or knowledge produce the defect, so correct the configuration once. Correcting each output by hand instead repeats the same cost forever.\nOne bland shelf card needs a better brief. A stiff tone in every newsletter needs one fix in the Project's instructions."}, {"i": 375, "l": "7.1", "d": 7, "h": "A Cause List You Can Run in a Minute", "t": "Six causes cover nearly everything:\ncontext starvation: a request without the context it needs\ninstruction overload: a request with too many requirements\na configuration defect\na degraded conversation\nstale or superseded material\na feature or setting mismatch\nContext starvation is by far the most common cause. A request with no audience, no purpose and no source material can only produce generic output, because Claude cannot guess what was withheld. The Help Center advises giving as much context as possible, as if instructing someone with no background knowledge of the task. Supply what was missing. Asking more forcefully supplies nothing. The shelf card needed its audience, its purpose and the book's blurb."}, {"i": 376, "l": "7.1", "d": 7, "h": "A Cause List You Can Run in a Minute", "t": "Instruction overload comes next. A request with a dozen requirements loses some of them. The documented remedy is structural: split complex requests into substeps, and group and prioritise the requirements so the important ones cannot be missed. Re-sending the same list with the missed items in capitals supplies nothing new. The owner splits and prioritises a newsletter brief that repeatedly loses the opening hours."}, {"i": 377, "l": "7.1", "d": 7, "h": "When the Conversation Itself Is the Problem", "t": "A long chat accumulates superseded drafts, corrections that were later contradicted, and unrelated topics. Claude has to work with all of it. The chat eventually reaches its length limit. Longer conversations that trigger automatic context management also consume more of your usage limit. The documented advice is to split the content into parts, summarise the important sections, or start a new conversation. Projects handle large recurring material through retrieval. To fix a degraded chat, start a new conversation that contains a verified summary of what still matters. A chat that holds three newsletter drafts restarts from a summary."}, {"i": 378, "l": "7.1", "d": 7, "h": "The Failure Modes Anthropic Names", "t": "The Help Center's troubleshooting articles name this objective's symptoms. Incorrect or misleading responses include fabricated quotes that look right. Claude is not a singular source of truth. So scrutinise high-stakes claims and review cited sources, such as a newsletter's author quote. Hallucinated capability means links that look as if they work but fail, or a claim that Claude has sent an email. Claude has no access to email or to any software that is not explicitly integrated. The diagnosis is hallucinated capability, not a delivery problem to investigate."}, {"i": 379, "l": "7.1", "d": 7, "h": "The Failure Modes Anthropic Names", "t": "A response that is too brief is a prompting problem, so revise the prompt. Give Claude the previous prompt and response so that it continues from the point where it stopped. Error messages are not quality defects. A capacity notice means wait and retry. A length-limit message means split the content into parts, summarise it or start a new conversation. Half of the diagnosis is recognising which of these the symptom is, because each has a different fix."}, {"i": 380, "l": "7.1", "d": 7, "h": "The Escalation Reflex", "t": "The favourite trap in this domain is to choose the most capable model or a higher effort setting because the output was disappointing. A vague brief fails with every model, because the missing context is missing for every model. Escalation produces the same generic answer, more thoroughly and at more cost, and the shelf card stays bland. Changing a feature or setting is legitimate when the task needs depth or current outside information. For depth, use the effort and extended thinking settings. For current outside information, use web search or Research. Use these features and settings only after the brief is sound."}, {"i": 381, "l": "7.1", "d": 7, "h": "In the exam", "t": "Every question in this domain starts after something has gone wrong. Domain 1 covers how to write a good request. This domain covers how to diagnose a poor output. Domain 5 covers how to change a configuration. This domain covers how to recognise that a configuration needs a change. Candidates lose these marks when they choose a fix before they name a cause.\n[Key Concept] Classify the symptom before you read the options. Did it happen once or every time, and which named failure mode is it? The right answer fixes the cause. At least one wrong option treats the symptom, usually by rewriting a prompt that was never the problem."}, {"i": 382, "l": "7.1", "d": 7, "h": "What the Sources Do Not Say", "t": "No official source says long chats get slower or that Claude confuses topics. The case for starting a new conversation is based on what is documented."}, {"i": 383, "l": "7.1", "d": 7, "h": "Exam Traps", "t": "[Exam Trap] Rewriting today’s prompt when every output has the same defect\nA defect appearing in every output of the same kind comes from the setup, so the fix belongs in the Project’s instructions or knowledge once. Rewriting individual prompts, or hand-correcting each output, repeats the same cost forever and leaves the cause in place.\n[Exam Trap] Escalating to a more capable model or higher effort as the first response to a disappointing output\nIf the request never named its audience or attached its material, escalation returns the same generic answer more slowly and at more cost. Diagnose first: a brief without enough context is fixed by supplying context, and no model can guess what was withheld."}, {"i": 384, "l": "7.1", "d": 7, "h": "Exam Traps", "t": "[Exam Trap] Treating an error message as a quality defect and rewording the prompt\nCapacity and length-limit messages have documented responses: retry after a short wait, or split the content into parts, summarise it and start a fresh conversation. Rewording the request does not address what the message is about.\n[Exam Trap] Investigating the delivery of an email Claude claims to have sent in a chat with no email integration\nWithout an integration, Claude has no email access, so a claimed send is fabricated capability, not a delivery failure. Checking outboxes or asking Claude to resend treats a send that never happened as real. Deliver the content yourself."}, {"i": 385, "l": "7.1", "d": 7, "h": "Practice Scenario", "t": "The administrator of a small art gallery drafts loan-request letters to lenders inside a correspondence Project. For two months, every letter has come out in American spelling, and she has corrected each one by hand before posting. A more capable model gave the same spelling. She wants to stop the hand corrections and keep drafting inside the Project. What is the most appropriate next step?\nOption AKeep correcting each letter by hand before it is posted, since the fix only takes a few minutes each time, and the letters are otherwise exactly what she wants to send\nOption BReview the Project’s instructions and knowledge for what produces the defect, and state the spelling standard there once"}, {"i": 386, "l": "7.1", "d": 7, "h": "Practice Scenario", "t": "Option CSwitch the Project to a more capable model so the letters come out in the right spelling first time, with no hand correction\nOption DDraft future letters in fresh conversations outside the Project so its settings cannot influence the spelling of the finished text\n[Check Answer]"}, {"i": 387, "l": "7.2", "d": 7, "h": "What You Need to Know", "t": "An adjustment round means changing a request, running it again and judging the output. Objective 1.3 taught what good feedback sounds like inside a conversation. This objective covers the discipline around that feedback. A systematic round gives you more than a different result. It gives you knowledge that you can reuse tomorrow and explain to a colleague. A systematic round needs three parts. You change one thing at a time. You hold the test input fixed. You judge the result against a criterion that you state before you look.\nThis lesson uses one made-up example throughout: a carpet shop. It has Claude draft the quote letter that the shop sends after each measuring visit. Customers continue to phone the shop to ask for the total."}, {"i": 388, "l": "7.2", "d": 7, "h": "Change One Thing at a Time", "t": "One change at a time shows what fixed the output. Suppose the owner changes only the audience line and the letter improves. Then the audience line was the problem, and that lesson applies to every similar task. Suppose she changes the wording, the model and the attached example at once. The letter improves, and nobody knows which of the three worked. Tomorrow, when she does the same kind of task, she knows no more than before. A bundled change, which changes several things at once, looks efficient until you need a second good result. Anthropic's Help Center says that an effective prompt contains as much context as possible. About adjustment, the Help Center gives no advice beyond giving Claude feedback, clarifications and rewrite requests. The one-variable discipline, one change at a time, is ordinary professional method."}, {"i": 389, "l": "7.2", "d": 7, "h": "Hold the Test Input Fixed", "t": "A new prompt that you try on a new document tells you nothing, because two things changed. A better result may only mean an easier input. When you hold the test input fixed (the same course, report or source file), the comparison between rounds is meaningful. For the owner, the test input is one customer's measuring notes. She uses these notes in every round. When you edit an earlier message, the edit creates a different version of the chat. That version has its own artifacts. Each round can start from the same input, and you can compare its result with the round before."}, {"i": 390, "l": "7.2", "d": 7, "h": "State the Criterion Before You Look", "t": "\"Better\" is not a criterion. \"A customer can find the total price in five seconds\" is a criterion. Stating the criterion in advance stops your judgement from drifting towards whatever the new draft happens to do well. That drift is how you accept a round that fixed nothing. A stated criterion also makes other people's reactions usable. A returned draft and a criterion together identify which requirement failed. \"The manager didn't like it\" identifies nothing."}, {"i": 391, "l": "7.2", "d": 7, "h": "Feedback Arrives from Readers, Not Just the Text", "t": "The results that matter often come from outside the conversation. A colleague says the tone is wrong. A manager returns a draft. A reader asks the same clarifying question three times. These reactions usually show what the output lacks more precisely than you do when you re-read the text yourself. The customers who phone about the total are such a result. When you treat these results as inputs to the next round, not as noise, you can iterate on whether the output works. When you ignore them, you iterate on how the output looks."}, {"i": 392, "l": "7.2", "d": 7, "h": "Know When to Stop Adjusting", "t": "Adjustment assumes that the approach is right and that the execution is wrong. When several well-aimed rounds have not changed the output, that assumption has failed. The task may need different source material, a feature such as web search or Research, or a different setting. The task may be work that you should not give to Claude at all. The third failed adjustment is a signal to return to the cause list in 7.1 and diagnose the cause again. A fourth round of slightly different words tests the same failed assumption. If customers still phone after the owner's third round, she stops rewording."}, {"i": 393, "l": "7.2", "d": 7, "h": "In the exam", "t": "The exam has questions on each of the three parts. The exam presents the bundled change as decisiveness.\nWhere this method comes from\nNo Anthropic article teaches one-variable adjustment. The Help Center's advice ends at giving Claude feedback and asking for rewrites. Branching a chat only gives you versions to compare. This lesson's discipline is based on the wording of the exam guide's objective and on ordinary professional practice."}, {"i": 394, "l": "7.2", "d": 7, "h": "Exam Traps", "t": "[Exam Trap] Changing several things at once and calling it decisive\nChanging the wording, the model and the example in one round leaves nobody knowing which change worked, so the improvement cannot be attributed or repeated. Change one thing at a time and keep the rest fixed.\n[Exam Trap] A fourth round of rewording after three aimed rounds changed nothing\nSeveral well-aimed rounds that changed nothing mean the approach, not the execution, is wrong. Go back to 7.1's cause list and re-diagnose: different source material, a different feature or setting, or work not to be handed over.\n[Exam Trap] Testing the adjusted prompt on a different document and crediting the prompt"}, {"i": 395, "l": "7.2", "d": 7, "h": "Exam Traps", "t": "When the input changed too, the comparison is meaningless; the improvement may only mean the new document was easier. Round-to-round learning requires the same test input every time."}, {"i": 396, "l": "7.2", "d": 7, "h": "Practice Scenario", "t": "The owner of a ceramics studio drafts the joining email she sends attendees before each weekend workshop, and attendees keep saying it is too long and too formal. She has time for one adjustment round this week. Which round is set up to teach her something?\nOption AAdd one line naming the reader, re-run the same workshop’s email, and judge it against a criterion set in advance: an attendee can find the start time in five seconds\nOption BAsk Claude to make the email warmer and shorter, and adopt the new version if it reads better\nOption CRun the unchanged prompt on a different workshop’s joining email to see whether the problem follows the prompt or that particular workshop"}, {"i": 397, "l": "7.2", "d": 7, "h": "Practice Scenario", "t": "Option DRewrite the prompt, switch to a different model and attach a friendlier example email all in the same round, then keep whichever combination works best\n[Check Answer]"}, {"i": 398, "l": "7.3", "d": 7, "h": "What You Need to Know", "t": "Overhead is anything you type, explain or attach at the start of every similar conversation. Optimising means making your work with Claude cost less time or usage. To measure the overhead, you time it and count how often it recurs. This objective covers how you work with Claude, not the business process around it (Domain 4.2).\nThis lesson uses one made-up example throughout: a kitchen fitter who drafts customer quotes with Claude. Each quote conversation opens with how his business works and prices a job, plus the same price list and catalogue. Timed, that is about ten minutes, three or four times a week."}, {"i": 399, "l": "7.3", "d": 7, "h": "Measure First", "t": "Optimising differs from fiddling because it starts from a measured number. His measured ten minutes justify moving the preamble, his repeated opening text, to a permanent place. \"Quoting feels clunky\" justifies nothing yet except timing it. This is the honesty rule from Domain 4.5, applied to your own workflow. Improve what you have observed, and claim no saving that you did not measure."}, {"i": 400, "l": "7.3", "d": 7, "h": "The Repeated-Overhead Test", "t": "Within a single conversation, Claude remembers the context from earlier messages. The fitter's preamble recurs because he types it again at the start of each new quote conversation. Recurring overhead belongs somewhere it only has to exist once."}, {"i": 401, "l": "7.3", "d": 7, "h": "The Repeated-Overhead Test", "t": "Put context and rules that stay the same, such as his pricing rules, in a Project's instructions. Anthropic describes these instructions as tailoring Claude's responses for each project. These instructions suit work that needs Claude to keep consistent context across many conversations in the same Project. Put recurring reference material, such as his price list, in Project knowledge. Project knowledge makes the Project a self-contained workspace. A request that you make in nearly the same words every week becomes a saved form. You adapt that form per use. Put preferences that apply to everything you do in the account-wide personalisation settings. There, the preferences apply to all conversations."}, {"i": 402, "l": "7.3", "d": 7, "h": "Batch Related Requests, and Name Your Files", "t": "Two documented methods take minutes to apply. The first method is batching. Anthropic's usage guidance says to group multiple related tasks or questions in a single message rather than splitting them across exchanges. It also says to be specific and concise, because Claude can need clarification after vague queries. The fitter asks for the quote and cover email in one message. Anthropic's article on usage and length limits adds that longer conversations which trigger automatic context management consume more of your usage limit. So long working chats are untidy and also use more of your usage limit."}, {"i": 403, "l": "7.3", "d": 7, "h": "Batch Related Requests, and Name Your Files", "t": "The second method is file names. In a large Project, retrieval decides which material Claude uses. Anthropic states that well-named files help Claude understand and retrieve the right information. Anthropic states this alongside two other practices: referencing documents by name and grouping related documents in the same Project. The fitter renames \"pl_v3_final\" to \"Worktop price list\". Renaming a file so a stranger could tell what it contains is a real optimisation with a documented mechanism."}, {"i": 404, "l": "7.3", "d": 7, "h": "Match the Settings to the Work", "t": "Running everything at one setting causes problems with both routine work and deep analysis. Higher effort produces more thorough responses but takes longer and uses more of your usage allowance. Routine reformatting at maximum effort spends usage on depth that it never uses. Deep analysis that is rushed at a low setting is too shallow for the task. A pattern of slow, over-worked responses to routine work, such as his quote reformatting, is itself the measurement. That measurement shows a mismatched setting."}, {"i": 405, "l": "7.3", "d": 7, "h": "The Proportion Rule", "t": "Some overhead is not worth removing. A twenty-minute task the fitter does once a year does not justify a Project, a saved form or an afternoon of setup. The saving never repays the setup, and the artefact he maintains becomes out of date between uses. Recognising the optimisation that costs more than it saves is as professional as spotting the one that saves more."}, {"i": 406, "l": "7.3", "d": 7, "h": "In the exam", "t": "Most questions depend on whether the option in front of you has a number. The exam tests whether you notice, from a symptom or a measurement, where an optimisation belongs. This includes which piece of a repeated preamble belongs at which level. Sometimes an optimisation belongs nowhere. In this domain's hardest questions, the right answer is to decide, on the numbers, not to optimise. Choosing model and effort belongs to Domain 3.3, and writing the configuration belongs to Domain 5."}, {"i": 407, "l": "7.3", "d": 7, "h": "In the exam", "t": "[Key Concept] In 7.3 questions, look for the measurement. The right answer moves measured, recurring overhead to a place where it exists once, or declines a setup that costs more than it saves. Wrong options optimise something untimed, such as an unmeasured reorganisation, or they optimise everything indiscriminately."}, {"i": 408, "l": "7.3", "d": 7, "h": "Exam Traps", "t": "[Exam Trap] Sweeping workflow changes proposed on the basis of a feeling\nWithout a measurement there is no baseline, no way to know whether the change helped, and no honest claim to have saved anything. Time the work first; measure before you reorganise.\n[Exam Trap] Building a Project or saved form for a task done twice a year\nSetup and upkeep that exceed the overhead they remove are a cost that looks like an improvement, and the artefact becomes out of date between uses. The proportion rule says leave the rare task alone.\n[Exam Trap] Raising effort or switching model to speed up a workflow whose overhead is a repeated preamble"}, {"i": 409, "l": "7.3", "d": 7, "h": "Exam Traps", "t": "Neither effort nor a model change gives Claude context it was never given, so the preamble would still be needed. A Project’s instructions and knowledge hold it once. Higher effort also takes longer and uses more of your usage allowance."}, {"i": 410, "l": "7.3", "d": 7, "h": "Practice Scenario", "t": "A city farm’s development officer starts every funder conversation the same way: explaining what the farm is and which programmes it runs, then attaching the same three documents. Timed, that comes to about ten minutes, three or four times a week. Each January she also spends twenty minutes preparing the farm’s annual return for the charity regulator. She will put effort only into what her timings show is costing time, and only where the saving outweighs the set-up. What is the most appropriate optimisation?\nOption ACreate a funding Project, with the standing explanation in its instructions, the three documents in its knowledge, and a saved version of her usual request to adapt"}, {"i": 411, "l": "7.3", "d": 7, "h": "Practice Scenario", "t": "Option BRaise the effort setting for funder conversations so the drafts come back more thorough and fewer rounds are needed\nOption CSet up Projects and saved request forms for every task she repeats at any interval, including the January annual return, so nothing she does regularly ever starts from a blank conversation again\nOption DReorganise her whole working week around Claude first, then time the results afterwards to see how much the changes saved\n[Check Answer]"}];

D[84]=["Account-wide instructions always override the organisation’s instructions, because they are the most personal and so the most specific","Project instructions override every other level whenever two levels conflict, because they are the closest to the work being done","Only the most recently written instruction applies, whatever level it was set at, because later rules cancel earlier ones"];
D[86]=["‘Be clear, professional, respectful and accessible at all times, and always produce high-quality easy-read documents.’","‘Produce work of the highest quality that members will find genuinely useful, and try your very best on every response.’","‘Aim to be engaging, thorough and trustworthy in everything that you write for members of the charity.’"];
D[90]=["Everyone with access automatically receives an email whenever the Project’s instructions or knowledge are edited by anyone","Claude announces any change to the configuration at the start of the next new chat in the Project for each member","The browser notifies members of the change the next time that they open the Project, with a summary of what was edited"];
D[92]=["Yes — Claude would do the scoring quickly and well, and the quality of the output is what decides whether the delegation is appropriate","Yes, provided a manager reviews every score afterwards, because the review restores accountability for the hiring decision","Yes, because the scores would stay inside the organisation and no outsider would ever see how the applicants were ranked"];
D[93]=["Is Claude faster than a human at this task, so that the delegation saves enough time to be worth doing?","Is the output well written and professionally presented, so that the delegation would not embarrass anyone?","Does the material fit comfortably within the context window, so that Claude can see the whole task at once?"];
D[98]=["Yes, because the schedule contains no personal data, so no safeguard is needed before it is uploaded to the Project","Yes, provided the conversation is deleted once the work has been done, since deletion removes the disclosure","Yes, if the prompt asks Claude to keep the schedule private and not to retain any of it afterwards"];
D[99]=["Always seek formal authorisation first, whatever the data, because asking permission is the most cautious step","Always move the work to a sanctioned workspace first, because that route is safer than editing the data","Abandon the task, because any analysis that involves identifiable data should not go ahead"];
D[102]=["The sanctioned workspace runs a different and more capable model from the one that personal accounts use","Personal accounts are unable to upload files or documents, so the contract could not have been shared","It is a matter of convention and workplace etiquette, and has no practical effect on how the data is handled"];
D[103]=["Paid plans always retain user data for training, whatever settings the individual has chosen","Careful privacy settings are impossible on personal plans, so the data could not be protected","Personal plans cannot process documents, so the contract would not have been read at all"];
D[105]=["Never; telling people that AI was involved is entirely optional in every situation, whoever the audience is","Only for internal emails such as the staff rota, which is where the reader’s trust is most at stake","Only in a privacy notice elsewhere on the site, which readers can find if they choose to look for it"];
D[114]=["‘The letter should be better than the last one and easier for customers to read.’","‘The manager likes it and says that it feels right for the shop.’","‘It reads nicely and sounds professional enough to send out to customers.’"];
D[115]=["Run a fourth round of slightly different wording, since the changes may simply need a little more time to take effect","Switch to the largest model available and stop diagnosing the cause, since capability should settle the matter","Accept the current output as the best that is possible and move on, since further changes are unlikely to help"];
D[119]=["Claude is permanently slow whatever settings are chosen, so there is no way of speeding up routine work","The Project has become corrupted and needs to be rebuilt from scratch before it will respond quickly again","The model needs to be renamed in the settings before the effort level can be changed for routine tasks"];
D[97]=["Removing the names from the data before it is uploaded, so that individuals cannot be identified","Aggregating the figures into ranges and cohorts before they are uploaded","Using the organisation’s sanctioned workspace for the upload, under its agreement"];
D[27]=["Claude cannot reread its own output within the same conversation, so the request has no effect whatever","It always makes the answer less accurate than before, because Claude tends to change statements that were correct","It is prohibited by Anthropic’s Usage Policy, which forbids asking Claude to review its own work"];
D[70]=["A technical firewall configured by an administrator to stop Claude from seeing the company’s files","A fee charged by Anthropic each time that Claude is used inside a workflow","The very first message that opens a conversation with Claude and sets the topic"];
D[39]=["Research mode cannot produce comparisons of any kind, so a table is the only option left for a board","Higher-tier models cannot create tables, so prose is the only format that the board will be able to see","Boards only ever read prose summaries, so a table would not actually be used by this reader"];
D[14]=["A one-word topic: ‘onboarding’ — which leaves Claude free to cover whatever it judges most relevant to remote staff","A request to write the onboarding policy straight away, which will show what the findings ought to be","A request for twenty unconstrained ideas about onboarding, to see what other firms might be doing"];
D[49]=["Everything on the most capable model, because the shop’s reputation depends on every message it sends out","Everything on the fastest model, since the regulator letter is only one letter among four hundred","Start the letter on the fastest model and re-run it on ever heavier models until it finally reads well"];
D[67]=["When the prose reads smoothly and the checklist looks professional on the page, whatever the requirement says","After exactly three rounds, whatever the state of the requirement or of the checklist","Never — a better version can always be produced, so the loop should continue indefinitely"];
D[83]=["The Project is broken and has to be recreated from scratch before the answers will agree again","One colleague is using a different model tier, which changes what the connector retrieves","Claude randomly forgets which files it has been given, so answers vary between users"];
D[106]=["Yes — every figure has been checked and is correct, so the section is ready to publish","Yes, once Claude confirms that the wording of the section is fair to the people described","Yes, provided an AI disclosure is added at the end of the section for readers"];
D[110]=["Reword the prompt so that it sounds clearer and try the request again","Switch to a lower model tier, which handles long conversations better than a heavier one","Retry the message immediately and repeatedly until it goes through"];
D[113]=["Claude refuses new inputs once a conversation is under way, so the results cannot be compared","It keeps the conversation shorter and so saves usage across the rounds","Different inputs use up more of the usage allowance than a single repeated input"];

</script>
<script>
"use strict";
/* ---------- data prep ---------- */
const LESSON = Object.fromEntries(LESSONS.map(l=>[l.id,l]));
if(D.length!==Q.length)console.error("distractor/question count mismatch",D.length,Q.length);
const BANK = Q.map((r,i)=>({id:i,l:r[0],d:+r[0][0],stem:r[1],opts:[r[2],...D[i]],exp:r[6]}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- RAG: BM25 retriever over lesson chunks ---------- */
const STOP=new Set("a an the and or of to in on for with is are was were be been it its this that these those as at by from not no but if then so than into which who what when where how can may should will would could do does did has have had you your they their them we our i he she his her about over under more most such also any all each per via".split(" "));
const stem=w=>w.length>4?w.replace(/(ing|ed|es|ly|s)$/,""):w;
const tok=s=>(s.toLowerCase().match(/[a-z][a-z'-]+/g)||[]).filter(w=>!STOP.has(w)).map(stem);
const IDX=(()=>{
  const docs=KB.map(c=>{const t=tok(c.h+" "+c.h+" "+c.t),tf={};t.forEach(w=>tf[w]=(tf[w]||0)+1);return{tf,len:t.length}});
  const df={};docs.forEach(d=>Object.keys(d.tf).forEach(w=>df[w]=(df[w]||0)+1));
  const avg=docs.reduce((a,d)=>a+d.len,0)/docs.length;
  return{docs,df,avg,N:docs.length};
})();
function retrieve(query,k=3,opts={}){
  const q=tok(query),{docs,df,avg,N}=IDX,K1=1.4,B=.75,sc=[];
  docs.forEach((d,i)=>{
    const c=KB[i];
    if(opts.lesson&&c.l!==opts.lesson)return;
    if(opts.domain&&c.d!==opts.domain)return;
    let s=0;
    for(const w of new Set(q)){const f=d.tf[w];if(!f)continue;
      const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5));
      s+=idf*f*(K1+1)/(f+K1*(1-B+B*d.len/avg));}
    if(opts.boost&&c.l===opts.boost)s*=1.35;   // prefer the question's own lesson
    if(s>0)sc.push([s,i]);
  });
  return sc.sort((a,b)=>b[0]-a[0]).slice(0,k).map(([s,i])=>({...KB[i],score:s}));
}
function hi(text,query){
  const ws=[...new Set((query.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[]).filter(w=>!STOP.has(w)))];
  let h=esc(text);
  if(!ws.length)return h;
  return h.replace(new RegExp("\\b("+ws.slice(0,14).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\w*","gi"),"<mark>$&</mark>");
}
function srcCard(c,q){
  const L=LESSON[c.l];
  return `<div class="src d${c.d}"><div class="m"><span class="chip d${c.d}">${c.l}</span><span>${esc(L.title)} · ${esc(c.h)}</span><a href="${L.url}" target="_blank" rel="noopener">open lesson ↗</a></div>${hi(c.t,q)}</div>`;
}

/* ---------- state ---------- */
let tab="home", run=null, timerH=null;
const hist=()=>LS.get("ccao_hist",[]);
const stats=()=>LS.get("ccao_stats",{});   // lessonId -> {a:attempts,c:correct}
const seen=()=>LS.get("ccao_seen",{});

function go(t){tab=t;stopTimer();run=null;render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";LS.set("ccao_theme",r.dataset.theme)};
{const t=LS.get("ccao_theme",null);if(t)document.documentElement.dataset.theme=t}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===tab&&!run)));
  const app=$("#app");
  if(run&&run.phase==="quiz")return renderQuiz(app);
  if(run&&run.phase==="result")return renderResult(app);
  ({home:renderHome,setup:renderSetup,kb:renderKB,progress:renderProgress})[tab](app);
}

/* ---------- home ---------- */
function renderHome(app){
  const H=hist(),best=H.filter(h=>h.mode==="exam").reduce((m,h)=>Math.max(m,h.scaled),0);
  app.innerHTML=`
  <p class="eyebrow">Claude Certified Associate · Foundations</p>
  <h1 style="margin:8px 0 14px">Mock Exam Studio</h1>
  <p class="lede">Scenario questions written from all 30 lessons of the CCAO-F curriculum. Pick the topics you want to drill, or sit a full 60-question, 120-minute mock weighted like the real exam. Every answer is explained and backed by passages retrieved from the study notes.</p>
  <div class="row mt"><button class="btn primary" onclick="startFull()">Start full mock exam (60 Q / 120 min)</button><button class="btn" onclick="go('setup')">Build a topic test</button><button class="btn" onclick="go('kb')">Search the notes</button></div>
  <div class="grid g4 mt2">
    <div class="card flat"><div class="stat">${BANK.length}</div><div class="stat-l">scenario questions</div></div>
    <div class="card flat"><div class="stat">${KB.length}</div><div class="stat-l">retrievable note passages</div></div>
    <div class="card flat"><div class="stat">${H.length}</div><div class="stat-l">tests taken</div></div>
    <div class="card flat"><div class="stat">${best||"—"}</div><div class="stat-l">best mock score (pass = 720)</div></div>
  </div>
  <h2 class="mt2" style="margin-bottom:6px">Exam domains</h2>
  <p class="note">Weights from the exam guide. Click a domain to practise only that domain.</p>
  <div class="grid g2 mt" style="margin-top:14px">
  ${Object.entries(DOMAINS).map(([d,o])=>{const n=BANK.filter(q=>q.d==d).length;return`<div class="card flat d${d}" style="border-left:4px solid hsl(var(--c))"><div class="row"><span class="chip">D${d}</span><b style="font-family:var(--font-display)">${esc(o.name)}</b><span class="spacer"></span><span class="note">${o.w}% of exam</span></div><div class="bar" style="margin:12px 0 10px"><i style="width:${o.w/21*100}%"></i></div><div class="row"><span class="note">${n} questions · ${LESSONS.filter(l=>l.d==d).length} lessons</span><span class="spacer"></span><button class="btn sm" onclick="startDomain(${d})">Practise</button></div></div>`}).join("")}
  </div>
  <div class="feature mt2"><p class="eyebrow" style="color:hsl(var(--feature-muted))">How it works</p><h2 style="margin:6px 0 10px">Retrieval-backed feedback</h2><p class="lede" style="margin:0">Your lessons are split into ${KB.length} passages and indexed with a BM25 retriever that runs entirely in your browser. When you check an answer, the question and its correct answer are used as the query to pull the most relevant passages from the notes, with a link back to the lesson.</p></div>
  <p class="note mt">These are original practice questions modelled on the curriculum — not the real exam’s question bank or the site’s paid mocks. Scores are estimates.</p>`;
}

/* ---------- setup ---------- */
let cfg={mode:"practice",count:20,domains:{},lessons:{},unseen:false,order:"random"};
function renderSetup(app){
  const pool=poolFor(cfg);
  app.innerHTML=`
  <p class="eyebrow">Build a test</p><h1 style="margin:8px 0 14px">Choose your topics</h1>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start" id="sgrid">
   <div>
    ${Object.entries(DOMAINS).map(([d,o])=>{
      const ls=LESSONS.filter(l=>l.d==d),all=ls.every(l=>cfg.lessons[l.id]);
      return`<div class="dom d${d}"><div class="dom-h"><label><input type="checkbox" ${all?"checked":""} onchange="togDomain(${d},this.checked)"><span class="dot"></span><b>Domain ${d} · ${esc(o.name)}</b></label><span class="w">${o.w}%</span></div>
      <div class="dom-b">${ls.map(l=>`<label><input type="checkbox" ${cfg.lessons[l.id]?"checked":""} onchange="togLesson('${l.id}',this.checked)"><span>${l.id} ${esc(l.title)}</span><span class="note" style="margin-left:auto">${BANK.filter(q=>q.l==l.id).length}Q</span></label>`).join("")}</div></div>`}).join("")}
   </div>
   <div class="card flat nav" style="position:sticky;top:84px">
     <h3 style="font-size:18px;margin-bottom:12px">Test settings</h3>
     <p class="note" style="margin-bottom:6px">Mode</p>
     <div class="seg" role="group"><button aria-pressed="${cfg.mode==="practice"}" onclick="cfg.mode='practice';renderSetup($('#app'))">Practice</button><button aria-pressed="${cfg.mode==="exam"}" onclick="cfg.mode='exam';renderSetup($('#app'))">Exam</button></div>
     <p class="note" style="margin:8px 0 14px">${cfg.mode==="practice"?"Immediate feedback, explanation and note passages after each answer.":"Timed, feedback only at the end — like the real thing."}</p>
     <p class="note" style="margin-bottom:6px">Questions (max ${pool.length})</p>
     <input type="number" min="1" max="${Math.max(pool.length,1)}" value="${Math.min(cfg.count,pool.length||1)}" onchange="cfg.count=+this.value" style="width:100%">
     <label class="row" style="margin-top:14px;font-size:15px;gap:10px;cursor:pointer"><input type="checkbox" ${cfg.unseen?"checked":""} onchange="cfg.unseen=this.checked;renderSetup($('#app'))">Prefer questions I haven’t seen</label>
     <div class="row" style="margin-top:12px"><button class="btn sm" onclick="selAll(true)">Select all</button><button class="btn sm" onclick="selAll(false)">Clear</button></div>
     <button class="btn primary" style="width:100%;margin-top:18px" ${pool.length?"":"disabled"} onclick="startCustom()">Start · ${Math.min(cfg.count,pool.length)} questions</button>
     <p class="note" style="margin-top:12px">${pool.length} questions match your topics.</p>
   </div>
  </div>`;
  if(innerWidth<900)$("#sgrid").style.gridTemplateColumns="1fr";
}
function togDomain(d,v){LESSONS.filter(l=>l.d==d).forEach(l=>cfg.lessons[l.id]=v);renderSetup($("#app"))}
function togLesson(id,v){cfg.lessons[id]=v;renderSetup($("#app"))}
function selAll(v){LESSONS.forEach(l=>cfg.lessons[l.id]=v);renderSetup($("#app"))}
const poolFor=c=>BANK.filter(q=>c.lessons[q.l]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,n,unseen){
  const S=seen();let p=shuffle(pool);
  if(unseen)p.sort((a,b)=>(S[a.id]||0)-(S[b.id]||0));
  return p.slice(0,n);
}
function startDomain(d){cfg.lessons={};LESSONS.filter(l=>l.d==d).forEach(l=>cfg.lessons[l.id]=true);cfg.mode="practice";cfg.count=Math.min(15,poolFor(cfg).length);startCustom()}
function startCustom(){const items=pick(poolFor(cfg),cfg.count,cfg.unseen);begin(items,cfg.mode,cfg.mode==="exam"?Math.ceil(items.length*2*60):0,"Topic test")}
function startFull(){
  let items=[];
  for(const [d,o] of Object.entries(DOMAINS)){
    const n=Math.round(o.w/100*60);
    items=items.concat(pick(BANK.filter(q=>q.d==d),n,true));
  }
  items=shuffle(items);
  begin(items,"exam",120*60,"Full mock exam");
}
function begin(items,mode,secs,label){
  if(!items.length)return;
  run={phase:"quiz",mode,label,items:items.map(q=>({q,order:shuffle([0,1,2,3]),sel:null,flag:false,checked:false})),i:0,secs,left:secs,t0:Date.now()};
  startTimer();render();window.scrollTo(0,0);
}

/* ---------- quiz ---------- */
function startTimer(){stopTimer();if(!run.secs)return;timerH=setInterval(()=>{run.left=Math.max(0,run.secs-Math.floor((Date.now()-run.t0)/1000));const el=$("#timer");if(el){el.textContent=fmt(run.left);el.classList.toggle("low",run.left<300)}if(run.left<=0)finish()},1000)}
function stopTimer(){if(timerH)clearInterval(timerH);timerH=null}
const fmt=s=>String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function renderQuiz(app){
  const it=run.items[run.i],q=it.q,prac=run.mode==="practice",done=prac&&it.checked,N=run.items.length;
  const opts=it.order.map((oi,pos)=>{
    let cls="opt";
    if(done){if(oi===0)cls+=" ok";else if(it.sel===pos)cls+=" bad"}
    else if(it.sel===pos)cls+=" sel";
    return`<button class="${cls}" ${done?"disabled":""} onclick="choose(${pos})"><span class="k">${"ABCD"[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join("");
  let fb="";
  if(done){
    const right=it.order[it.sel]===0,query=q.stem+" "+q.opts[0]+" "+q.exp;
    const hits=retrieve(query,3,{boost:q.l});
    fb=`<div class="explain"><h3 class="${right?"pass":"fail"}">${right?"Correct":"Not quite"} — the answer is ${"ABCD"[it.order.indexOf(0)]}</h3><p style="margin:0">${esc(q.exp)}</p></div>
    <p class="eyebrow" style="margin-top:18px">Retrieved from the study notes</p>${hits.map(h=>srcCard(h,q.opts[0]+" "+q.exp)).join("")}`;
  }
  const L=LESSON[q.l];
  app.innerHTML=`<div class="qwrap"><div>
    <div class="qhead"><span class="chip d${q.d}">D${q.d} · ${q.l}</span><span class="note">${esc(L.title)}</span><span class="spacer"></span>${run.secs?`<span class="timer ${run.left<300?"low":""}" id="timer">${fmt(run.left)}</span>`:""}</div>
    <p class="eyebrow">Question ${run.i+1} of ${N}</p>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    ${fb}
    <div class="row mt">
      <button class="btn" ${run.i?"":"disabled"} onclick="step(-1)">← Previous</button>
      ${prac&&!done?`<button class="btn primary" ${it.sel===null?"disabled":""} onclick="check()">Check answer</button>`:""}
      <button class="btn ${it.flag?"primary":""}" onclick="flag()">${it.flag?"Flagged ⚑":"Flag for review"}</button>
      <span class="spacer"></span>
      ${run.i<N-1?`<button class="btn ${done?"primary":""}" onclick="step(1)">Next →</button>`:`<button class="btn primary" onclick="finish()">Finish &amp; score</button>`}
    </div></div>
    <aside class="nav card flat"><p class="eyebrow" style="margin-bottom:10px">Navigator</p><div class="pal">${run.items.map((x,i)=>{let c="";if(i===run.i)c+=" cur";if(x.flag)c+=" flag";if(prac&&x.checked)c+=x.order[x.sel]===0?" ok":" bad";else if(x.sel!==null)c+=" ans";return`<button class="${c}" onclick="jump(${i})">${i+1}</button>`}).join("")}</div>
    <p class="note" style="margin:12px 0 0">${run.items.filter(x=>x.sel!==null).length}/${N} answered</p>
    <button class="btn sm" style="margin-top:12px;width:100%" onclick="if(confirm('Finish and score this test now?'))finish()">Finish test</button>
    <button class="btn sm" style="margin-top:8px;width:100%" onclick="if(confirm('Abandon this test?'))go('home')">Quit</button></aside></div>`;
}
function choose(p){const it=run.items[run.i];if(run.mode==="practice"&&it.checked)return;it.sel=p;renderQuiz($("#app"))}
function check(){const it=run.items[run.i];if(it.sel===null)return;it.checked=true;recordOne(it);renderQuiz($("#app"))}
function step(n){run.i=Math.max(0,Math.min(run.items.length-1,run.i+n));render();window.scrollTo(0,0)}
function jump(i){run.i=i;render();window.scrollTo(0,0)}
function flag(){run.items[run.i].flag=!run.items[run.i].flag;renderQuiz($("#app"))}
function recordOne(it){ // per-lesson stats + seen counter
  const S=stats(),l=it.q.l;S[l]=S[l]||{a:0,c:0};S[l].a++;if(it.order[it.sel]===0)S[l].c++;LS.set("ccao_stats",S);
  const sn=seen();sn[it.q.id]=(sn[it.q.id]||0)+1;LS.set("ccao_seen",sn);
}
function finish(){
  stopTimer();
  if(run.mode==="exam")run.items.forEach(it=>{if(it.sel!==null)recordOne(it)});
  else run.items.forEach(it=>{if(it.sel!==null&&!it.checked){it.checked=true;recordOne(it)}});
  const n=run.items.length,ok=run.items.filter(x=>x.sel!==null&&x.order[x.sel]===0).length;
  const byD={};run.items.forEach(x=>{const d=x.q.d;byD[d]=byD[d]||{n:0,c:0};byD[d].n++;if(x.sel!==null&&x.order[x.sel]===0)byD[d].c++});
  run.res={n,ok,scaled:Math.round(ok/n*1000),byD,secs:Math.floor((Date.now()-run.t0)/1000)};
  const H=hist();H.push({t:Date.now(),mode:run.mode,label:run.label,n,ok,scaled:run.res.scaled,byD});LS.set("ccao_hist",H.slice(-100));
  run.phase="result";run.filter="all";render();window.scrollTo(0,0);
}

/* ---------- results ---------- */
function renderResult(app){
  const r=run.res,pass=r.scaled>=720,full=run.items.length>=60;
  const list=run.items.map((x,i)=>({x,i})).filter(({x})=>run.filter==="all"||(run.filter==="wrong"&&(x.sel===null||x.order[x.sel]!==0))||(run.filter==="flag"&&x.flag));
  app.innerHTML=`
  <p class="eyebrow">${esc(run.label)} · results</p>
  <div class="grid g2 mt" style="margin-top:12px">
    <div class="card flat"><div class="score ${pass?"pass":"fail"}">${r.scaled}</div><p class="note" style="margin:8px 0 0">estimated score out of 1000 (pass mark 720)${full?"":" — shorter tests give a rougher estimate"}</p><h3 class="${pass?"pass":"fail"}" style="margin-top:14px">${pass?"Above the pass mark":"Below the pass mark"}</h3><p class="note" style="margin:6px 0 0">${r.ok} of ${r.n} correct · ${Math.round(r.secs/60)} min</p></div>
    <div class="card flat"><p class="eyebrow" style="margin-bottom:12px">By domain</p>${Object.entries(r.byD).sort().map(([d,v])=>{const p=Math.round(v.c/v.n*100);return`<div class="d${d}" style="margin-bottom:12px"><div class="row" style="gap:8px"><span class="dot"></span><span style="font-size:14px">D${d} ${esc(DOMAINS[d].name)}</span><span class="spacer"></span><b style="font-family:var(--font-mono);font-size:13px">${v.c}/${v.n}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  </div>
  <div class="row mt"><button class="btn primary" onclick="retryWrong()">Retry my wrong answers</button><button class="btn" onclick="go('setup')">Build another test</button><button class="btn" onclick="go('progress')">Progress</button><span class="spacer"></span>
    <div class="seg"><button aria-pressed="${run.filter==="all"}" onclick="run.filter='all';renderResult($('#app'))">All</button><button aria-pressed="${run.filter==="wrong"}" onclick="run.filter='wrong';renderResult($('#app'))">Wrong</button><button aria-pressed="${run.filter==="flag"}" onclick="run.filter='flag';renderResult($('#app'))">Flagged</button></div></div>
  <h2 class="mt2" style="margin-bottom:14px">Review</h2>
  ${list.length?list.map(({x,i})=>{const q=x.q,right=x.sel!==null&&x.order[x.sel]===0,hits=right&&run.filter==="all"?[]:retrieve(q.stem+" "+q.opts[0]+" "+q.exp,2,{boost:q.l});
    return`<div class="card flat d${q.d}" style="margin-bottom:14px;border-left:4px solid ${right?"hsl(var(--success))":"hsl(var(--destructive))"}">
      <div class="row" style="gap:8px"><span class="chip">D${q.d} · ${q.l}</span><b class="${right?"pass":"fail"}">${x.sel===null?"Unanswered":right?"Correct":"Incorrect"}</b>${x.flag?'<span class="chip" style="--c:var(--d4)">⚑ flagged</span>':""}<span class="note">Q${i+1}</span></div>
      <p style="margin:10px 0">${esc(q.stem)}</p>
      ${x.sel!==null&&!right?`<p class="note" style="margin:0 0 6px"><b>Your answer:</b> ${esc(q.opts[x.order[x.sel]])}</p>`:""}
      <p style="margin:0 0 8px;font-size:15px"><b class="pass">Correct:</b> ${esc(q.opts[0])}</p>
      <p class="note" style="margin:0">${esc(q.exp)}</p>${hits.map(h=>srcCard(h,q.opts[0]+" "+q.exp)).join("")}</div>`}).join(""):'<p class="note">Nothing in this filter.</p>'}`;
}
function retryWrong(){
  const wrong=run.items.filter(x=>x.sel===null||x.order[x.sel]!==0).map(x=>x.q);
  if(!wrong.length){alert("No wrong answers — nice work.");return}
  begin(shuffle(wrong),"practice",0,"Retry: missed questions");
}

/* ---------- knowledge base ---------- */
let kbq="",kbl="";
function renderKB(app){
  app.innerHTML=`<p class="eyebrow">Knowledge base</p><h1 style="margin:8px 0 14px">Ask the notes</h1>
  <p class="lede">Search all ${KB.length} passages from the 30 lessons. Results are ranked by BM25 relevance.</p>
  <div class="row mt"><input type="search" id="kbq" placeholder="e.g. when is human review required" value="${esc(kbq)}" style="flex:1;min-width:240px">
  <select id="kbl" style="height:40px;border:1px solid hsl(var(--border));background:hsl(var(--surface-lowest));padding:0 10px;border-radius:var(--radius)"><option value="">All lessons</option>${LESSONS.map(l=>`<option value="${l.id}" ${kbl===l.id?"selected":""}>${l.id} ${esc(l.title)}</option>`).join("")}</select></div>
  <div id="kbout" class="mt"></div>`;
  const run_=()=>{kbq=$("#kbq").value;kbl=$("#kbl").value;const out=$("#kbout");
    if(!kbq.trim()){out.innerHTML=`<div class="grid g2">${Object.entries(DOMAINS).map(([d,o])=>`<div class="card flat d${d}" style="border-left:4px solid hsl(var(--c))"><b style="font-family:var(--font-display)">D${d} ${esc(o.name)}</b>${LESSONS.filter(l=>l.d==d).map(l=>`<p style="margin:6px 0 0;font-size:15px"><a href="${l.url}" target="_blank" rel="noopener">${l.id} ${esc(l.title)}</a> <a href="#" onclick="document.querySelector('#kbl').value='${l.id}';document.querySelector('#kbq').value='key concept exam trap';document.querySelector('#kbq').dispatchEvent(new Event('input'));return false" class="note">notes</a></p>`).join("")}</div>`).join("")}</div>`;return}
    const hits=retrieve(kbq,10,{lesson:kbl||undefined});
    out.innerHTML=hits.length?hits.map(h=>srcCard(h,kbq)).join(""):'<p class="note">No matching passages.</p>';};
  $("#kbq").oninput=run_;$("#kbl").onchange=run_;run_();
}

/* ---------- progress ---------- */
function renderProgress(app){
  const S=stats(),H=hist().slice().reverse();
  const rows=LESSONS.map(l=>{const s=S[l.id]||{a:0,c:0};return{l,a:s.a,c:s.c,p:s.a?s.c/s.a:null}});
  const weak=rows.filter(r=>r.a>=2&&r.p<.7).sort((a,b)=>a.p-b.p);
  app.innerHTML=`<p class="eyebrow">Progress</p><h1 style="margin:8px 0 14px">How you’re doing</h1>
  ${weak.length?`<div class="card flat" style="border-left:4px solid hsl(var(--warning))"><b>Weak topics</b><p class="note" style="margin:6px 0 12px">${weak.slice(0,6).map(r=>`${r.l.id} ${esc(r.l.title)} (${Math.round(r.p*100)}%)`).join(" · ")}</p><button class="btn primary sm" onclick="practiseWeak()">Practise weak topics</button></div>`:'<p class="note">Answer a few questions in each lesson and weak topics will show up here.</p>'}
  <h2 class="mt2" style="margin-bottom:12px">Accuracy by lesson</h2>
  <table><thead><tr><th>Lesson</th><th>Attempts</th><th style="width:40%">Accuracy</th></tr></thead><tbody>${rows.map(r=>`<tr class="d${r.l.d}"><td><span class="dot"></span>${r.l.id} ${esc(r.l.title)}</td><td>${r.a}</td><td>${r.a?`<div class="row" style="gap:10px"><div class="bar" style="flex:1"><i style="width:${r.p*100}%"></i></div><span style="font-family:var(--font-mono);font-size:13px">${Math.round(r.p*100)}%</span></div>`:'<span class="note">—</span>'}</td></tr>`).join("")}</tbody></table>
  <h2 class="mt2" style="margin-bottom:12px">History</h2>
  ${H.length?`<table><thead><tr><th>When</th><th>Test</th><th>Score</th><th>Est. /1000</th></tr></thead><tbody>${H.slice(0,20).map(h=>`<tr><td>${new Date(h.t).toLocaleString()}</td><td>${esc(h.label)}</td><td>${h.ok}/${h.n}</td><td class="${h.scaled>=720?"pass":"fail"}"><b>${h.scaled}</b></td></tr>`).join("")}</tbody></table>`:'<p class="note">No tests yet.</p>'}
  <div class="row mt2"><button class="btn" onclick="if(confirm('Erase all saved progress?')){['ccao_hist','ccao_stats','ccao_seen'].forEach(k=>localStorage.removeItem(k));render()}">Reset progress</button></div>`;
}
function practiseWeak(){
  const S=stats();cfg.lessons={};LESSONS.forEach(l=>{const s=S[l.id];if(s&&s.a>=2&&s.c/s.a<.7)cfg.lessons[l.id]=true});
  cfg.mode="practice";cfg.count=Math.min(20,poolFor(cfg).length);startCustom();
}
render();
</script>
</body>
</html>
