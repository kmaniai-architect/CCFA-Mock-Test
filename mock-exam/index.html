r."}, {"i": 104, "l": "2.4", "d": 2, "h": "Both Failure Directions", "t": "Over-escalation feels safe because caution feels safe. It is not safe. One example is a committee for a rota note. Another is a professional reviewer for every routine draft. Each adds more process than the work needs. Over-escalation overloads reviewers, delays routine work and teaches the organisation to ignore the escalation channel that high-stakes outputs need. A solicitor who reads the cleaning reminder reaches the refund reply later. The skill is triage, not maximal caution."}, {"i": 105, "l": "2.4", "d": 2, "h": "Two Different Reasons to Stop", "t": "In this objective, the reasons to escalate are quality and stakes. These are what happens if the output is wrong, and who is competent to catch the errors. Domain 6 covers other reasons to stop: the data is personal or regulated, or the use is outside organisational AI policy. Both kinds of reason can arise in one situation, such as a refund reply that quotes a pupil's personal data, but the trigger differs. The programme's technical escalation is a third kind. It hands a task to a Claude Developer or Architect because the task needs automation or integration. In that case, the task needs more than the chat can give. It is not a case of an output that needs a qualified reviewer."}, {"i": 106, "l": "2.4", "d": 2, "h": "In the exam", "t": "The exam tests this objective as triage: a decision based on the triggers that the output has, not on how polished it looks. It penalises a wrong decision in either direction. In the questions, look for the destination and for what qualifies a named reviewer. Candidates rarely expect the exam to test over-escalation, and \"escalate everything\" is a real wrong answer. The exam keeps Domain 6 triggers distinct.\n[Key Concept] Triage asks two questions in order. Which triggers does this output have? If it has any, who is qualified in that subject to catch the errors that matter? The wrong options answer with rank, availability or a process that applies to every output."}, {"i": 107, "l": "2.4", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Choosing the reviewer by seniority or availability\nWhere the Usage Policy requires review, a qualified person must do it: someone with the training or experience to evaluate the output in that field. A senior manager's sign-off on legal wording is reassurance, not review. Choose whoever can catch the dangerous error.\n[Exam Trap] Letting output pass unchecked because it is only internal\nThe trigger is what the output carries, not where it first goes. An internal analysis that feeds an external bid or a decision about people carries the consequence with it, so escalate on the destination and the stakes, not the label.\n[Exam Trap] Escalating everything to be safe"}, {"i": 108, "l": "2.4", "d": 2, "h": "Exam Traps", "t": "Over-escalation is a tested wrong answer, not a cautious right one. Routing routine internal drafts through committees or professionals overloads reviewers and weakens the escalation channel that high-stakes outputs need; careful self-review suffices for genuinely low-stakes material."}, {"i": 109, "l": "2.4", "d": 2, "h": "Practice Scenario", "t": "An opticians' practice manager has three Claude drafts: advertising copy for a new lens range claiming specific visual outcomes, a reworded internal rota-swap policy, and a reply to a patient complaint that touches on what may have gone wrong clinically. The manager has no clinical training and does not know what eye-care advertising may legally promise. Each draft must be checked by someone who knows its subject, with no needless delay. What is the right triage?\nOption APublish the advertising copy, since it reads professionally and was drafted from the product literature, and ask the optometrist to look over the rota policy and complaint reply"}, {"i": 110, "l": "2.4", "d": 2, "h": "Practice Scenario", "t": "Option BPut all three drafts to the practice’s weekly management meeting for collective sign-off before any of them is used, so that responsibility for every document is shared by the whole team\nOption CQualified review before either goes out (a health-claims expert for the advertising claims, the optometrist for the complaint reply), and the manager’s own careful read for the rota policy\nOption DReview all three personally and carefully as the accountable manager, then send them, keeping turnaround fast and responsibility in one place\n[Check Answer]"}, {"i": 111, "l": "2.5", "d": 2, "h": "What You Need to Know", "t": "Editing an output means deciding what reaches the reader, and in what form. Adapting means changing the delivery for one reader while keeping the substance. Earlier objectives in this domain asked whether an output is right. This objective asks whether it is right for its reader. That judgement is editorial, and it is yours. Claude drafts, and you edit.\nThis lesson uses one made-up example throughout: a veterinary practice that asks Claude for a discharge note to a dog's owner after surgery. The draft is accurate but clinical, and the warning signs are halfway down page two."}, {"i": 112, "l": "2.5", "d": 2, "h": "You Are the Editor", "t": "Claude's draft is unfinished material. Official documentation describes Claude as a partner for drafting and rewriting. Claude can produce anything from an email to a screenplay, and it can rework its answers on request. Claude does not make the final decision. That decision covers what stays, what goes, whether the emphasis is right, and whether this audience will understand and act on the result."}, {"i": 113, "l": "2.5", "d": 2, "h": "You Are the Editor", "t": "You have two remedies. You can edit the output yourself, or you can direct a revision that names what must change. A directed revision gives Claude follow-up instructions, not a bare request to try again. Knowing which remedy fits is part of the skill. At the practice, moving the warning signs higher is a quick edit. A plain-language rewrite is a revision that you direct."}, {"i": 114, "l": "2.5", "d": 2, "h": "Right for Its Reader", "t": "The exam tests whether you recognise that a technically correct output is wrong for its reader. Typical cases are jargon for a non-specialist audience, detail-heavy analysis for an executive with little time, and an internal register (the style of language used inside the organisation) in a customer-facing note. A reader who cannot understand a document cannot act on it. Adapting changes three things. The vocabulary becomes simpler, to match the reader's level. Each sentence holds less information. The order changes so that the urgent item comes first, not in the middle of the document."}, {"i": 115, "l": "2.5", "d": 2, "h": "Right for Its Reader", "t": "Adaptation fails in two directions, both tested. Leaving output that is hard for the reader untouched because it is correct fails the reader. Removing the substance while simplifying fails them too: to make the text easier to read, a serious point is softened until the reader cannot see it. The findings, the recommendations and the costs must stay in the text after any adaptation. A friendly note that drops the warning signs has failed the owner. After adapting, check the new version against the original for anything lost or softened."}, {"i": 116, "l": "2.5", "d": 2, "h": "Criteria Before Reading", "t": "When choosing between versions, set the criteria before reading: accuracy preserved, audience fit, tone, completeness, length. Read each version against the list. Defend your choice with the criteria, not with the style. A comparison without criteria chooses the prettiest prose by default. Style is the only comparison that fluent output always wins. So in a comparison without criteria, a fluent version with less content beats a correct one.\nThree criteria are usually enough. For the practice, the criteria are: nothing factual lost, the right register for the owner, and warning signs first. The criteria must exist before you read either version, because criteria set afterwards tend to justify the version you already liked."}, {"i": 117, "l": "2.5", "d": 2, "h": "Generator, Not Judge", "t": "Claude produces versions in different registers, lengths and structures, and says how they differ. You apply the criteria and choose a version. The practice does this when it chooses between a short note and a long one. Asking Claude which of its versions is better gives Claude the judgement that this objective certifies. Claude's assessment of its own work is not a reliable signal either. Objective 2.3 covers this limitation. In Artifacts, document versions appear side by side, and earlier versions remain retrievable. So Artifacts suit this pattern."}, {"i": 118, "l": "2.5", "d": 2, "h": "In the exam", "t": "The guide describes Associate-level professionals as distinguished by their ability to critically evaluate AI-generated content and adapt outputs for different audiences.\nGiving Claude clearer feedback so that the next draft improves is objective 1.3, prompt refinement. Assessing, adapting and finishing the output that you already have is this objective. Improving the practice's prompt for future notes is 1.3. Fixing this note is 2.5. To distinguish the two objectives, read the action that the question tests.\nThe clue in comparison questions"}, {"i": 119, "l": "2.5", "d": 2, "h": "In the exam", "t": "When a question offers two versions and asks which to send, look at the basis that each option uses for the comparison. Options that choose by flow, tone or general appeal are wrong. The right answer sets criteria first, checks both versions against them, and then chooses on that basis. Fluency is never one of the criteria, because both versions already have it."}, {"i": 120, "l": "2.5", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Sending an accurate but hard-to-read output because the content is correct\nA reader who cannot understand the document cannot act on it, and the urgent point stays hard to find. Adapt the delivery for the named reader while keeping the substance.\n[Exam Trap] Adapting for a lay audience by cutting the difficult content\nThe findings, recommendations and costs are what the reader needs to act on. Softening a serious point until the reader cannot see it fails the reader. Put the substance into plain words rather than deleting it, then check the result against the original.\n[Exam Trap] Asking Claude to pick its own best version and sending its choice"}, {"i": 121, "l": "2.5", "d": 2, "h": "Exam Traps", "t": "Claude generates the versions and explains how they differ, but the choice of what goes out belongs to the person sending it. Its self-reported confidence is not a reliable accuracy signal. Apply your criteria and choose.\n[Exam Trap] Choosing between two versions by which reads better, with no criteria fixed beforehand\nStyle is the only comparison that fluent output always wins, so a fluent version with less content beats a correct one. Fix the criteria before reading, then judge each version against them."}, {"i": 122, "l": "2.5", "d": 2, "h": "Practice Scenario", "t": "A building surveyor's assistant has a survey summary that is accurate but dense with structural terminology, and the urgent roof defect sits mid-document. It must go to the buyers: first-time buyers with no construction background. The surveyor insists that the buyers can follow every finding and that the assistant, rather than Claude, settles the final wording. What is the right way to prepare it?\nOption AHave Claude produce two adapted versions, ask it which one works better for first-time buyers, and send the version that it recommends\nOption BCut the technical sections down to a short, reassuring overview so the buyers get an easy read without the intimidating detail"}, {"i": 123, "l": "2.5", "d": 2, "h": "Practice Scenario", "t": "Option CSend it to the buyers unchanged: the findings are accurate as they stand, and simplifying technical content for lay readers risks misstating the surveyor’s professional conclusions in a document they may rely on\nOption DDirect a plain-language revision that keeps every defect, recommendation and cost, moves the roof issue to the top, then check the adapted version against the original for anything softened or lost\n[Check Answer]"}, {"i": 124, "l": "2.6", "d": 2, "h": "What You Need to Know", "t": "A long, productive conversation is not a deliverable. Its findings, decisions and usable text are mixed with failed approaches and replaced drafts. Two deliberate acts turn the conversation into a deliverable, and neither act happens automatically. Curation extracts what the deliverable needs. Format selection gives the deliverable the container that its reader will use: an inline chat response, a structured table or an artifact. An artifact is substantial, standalone content that Claude puts in a dedicated window, separate from the conversation."}, {"i": 125, "l": "2.6", "d": 2, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a plumbing firm. Its office manager has spent weeks planning winter work with Claude. Three outputs are due. A customer wants to know today whether the boiler service includes a flue check. The owner must choose between three boiler suppliers on price, warranty and delivery time. The plumbers need the winter call-out procedure, which the firm revises every autumn."}, {"i": 126, "l": "2.6", "d": 2, "h": "From Working Material to Work Product", "t": "Curation starts from the deliverable, not the conversation. Ask who reads it, what they do with it, and whether it will be reused or revised. Then extract exactly what that reader needs, and shape it into its final container. Forwarding the whole conversation, or leaving the deliverable scattered across it, delegates the curation to the reader. The reader will not do the curation. So next month's colleague scrolls thirty screenfuls and searches for the decisions.\nMost of a working conversation is scaffolding: material that helped you reach the decisions. So curation is selective on purpose. The deliverable gives its reader the decisions alone. The plumbers get the final call-out steps, not the drafts."}, {"i": 127, "l": "2.6", "d": 2, "h": "The Three Format Homes", "t": "The Help Center's definition of artifacts is also the selection rule. Artifacts suit significant, self-contained content you are likely to edit, iterate on or reuse outside the conversation. The opposite of this rule defines the other two containers.\nAn inline chat response fits quick, one-off answers that the reader uses at once: a fact, a short explanation, text to paste and send immediately. A structured table fits anything the reader compares or scans: options against criteria, items with consistent attributes, schedules. If the reader needs rows and columns, prose is the wrong container. An artifact fits a standalone document, plan or reference page that stays in use: it is revised, reused or shared as a thing in itself."}, {"i": 128, "l": "2.6", "d": 2, "h": "The Three Format Homes", "t": "The choice follows the reader's use: inline for content the reader uses once, a table for content the reader compares and scans, and an artifact for content the reader reuses and revises. So the flue-check answer goes inline, the supplier choice becomes a table with the criteria as columns, and the call-out procedure becomes an artifact."}, {"i": 129, "l": "2.6", "d": 2, "h": "The Artifact's Life", "t": "An artifact is useful because of what happens after the first draft. You can ask Claude to change it, or you can edit a document, deck or design directly. The deliverable then changes as one thing, not as fragments that you paste again into the chat. To try a different direction without losing what you have, edit an earlier message. Editing an earlier message creates a different version of the chat with its own artifacts. The original version stays where it was. When you share the artifact, it gets a link that other people can open."}, {"i": 130, "l": "2.6", "d": 2, "h": "The Artifact's Life", "t": "For shared work, a colleague who receives a runbook next year opens the current document. Next autumn, the plumbing firm's manager opens one revised call-out procedure. The format choice is also reversible, and it is always your decision. If useful content arrived inline, one message that asks Claude to convert it into an artifact is enough."}, {"i": 131, "l": "2.6", "d": 2, "h": "What Each Mismatch Costs", "t": "Each wrong format has a predictable cost. A reusable runbook that stays as plain text in the chat is lost and then created again. A comparison delivered as paragraphs makes every reader rebuild the table in their head, and some rebuild it wrongly. Putting everything in a table puts judgements that need full sentences into cells that are too small for them. Putting everything in an artifact adds needless formality to one-off answers, such as the flue-check reply. Choose the format by the reader's use, never by habit."}, {"i": 132, "l": "2.6", "d": 2, "h": "In the exam", "t": "The exam tests format selection through these failure modes. This objective is about choosing the shape of the output. Choosing the product feature or model for the task is Domain 3. That domain covers a Project for recurring context, Research for a cited report, and which model to use. A format question may mention those features in its scenario. The right answer is always about the container the reader receives."}, {"i": 133, "l": "2.6", "d": 2, "h": "In the exam", "t": "[Key Concept] For every output, ask one question: what does the reader do with this? Read it once, compare across it, or return to it? The answer decides the format, and it overrides every default. Exam questions reward matching each output to its use. They penalise both prose chosen without thought and structure added automatically.\nCurrent state: artifacts changed in September 2026"}, {"i": 134, "l": "2.6", "d": 2, "h": "In the exam", "t": "Anthropic reworked artifacts on 16 September 2026. They are now designs, decks, documents, dashboards and small tools made in any conversation. Artifacts made in a chat before that date are \"legacy\": they can still be opened and shared, but no more can be made. The earlier Help Center article described a version selector for switching versions. The current article, checked 28 September 2026, no longer documents one. The exam guide names artifacts only as an output format, so no right answer depends on that control. Where these lessons talk about comparing versions, they mean the branching described above."}, {"i": 135, "l": "2.6", "d": 2, "h": "Exam Traps", "t": "[Exam Trap] Answering a format question with Projects, Research mode or a model choice\nChoosing the product feature or model for the task is Domain 3. When a question asks how information should be organised or delivered, the answer is about the output's container: inline, table or artifact, matched to the reader's use.\n[Exam Trap] Defaulting every output to the same container\nArtifacts for everything add needless formality to one-off answers, and tables for everything force narrative judgement into cells. Options that use one format for everything sound systematic and safe, which makes them tempting. Vary the format with the use.\n[Exam Trap] Sharing the whole conversation instead of curating the deliverable"}, {"i": 136, "l": "2.6", "d": 2, "h": "Exam Traps", "t": "Forwarding weeks of working material delegates the curation to readers who will not do it: the decisions stay hidden among failed approaches and superseded drafts. Extract what each reader needs into the container that fits their use."}, {"i": 137, "l": "2.6", "d": 2, "h": "Practice Scenario", "t": "A swimming club's gala organiser has weeks of Claude conversations about the annual gala. Three outputs are now needed: the agreed start time for tonight's committee question, a comparison of three candidate dates against pool availability, volunteer numbers and fixture clashes, and the gala-day runbook that will be revised and reused every year. She wants each in the simplest form its use allows, and her successor must be able to receive the runbook and edit it. Which formats fit?\nOption ACreate artifacts for all three outputs so that nothing is lost and every answer stays permanently available in one dedicated place the whole committee can open"}, {"i": 138, "l": "2.6", "d": 2, "h": "Practice Scenario", "t": "Option BReply to all three needs in chat prose and share the conversation with the committee, so that members can read the full context and history behind each answer for themselves\nOption CAnswer the start time inline, put the three dates in a table with the criteria as columns, and build the runbook as an artifact revised in place each year\nOption DPut all three outputs into tables, since structured formats are easier to scan than prose, and a committee that is short of time can find each answer very quickly\n[Check Answer]"}, {"i": 139, "l": "3.1", "d": 3, "h": "What You Need to Know", "t": "Claude offers four ways to handle work. Ordinary chat is a single conversation. The Help Center describes Projects as self-contained workspaces with their own chat histories and knowledge bases. Research is for questions whose answer must be assembled from several outside sources, and it returns a cited report. An artifact is standalone content displayed in its own window, beside the conversation. Most people pick a feature by habit. Identify the kind of task instead, before writing any prompt."}, {"i": 140, "l": "3.1", "d": 3, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a hair salon. Its owner has four jobs. She needs one reply to a client's complaint. Each week she writes booking reminders from the same price list and house style. She wants to know how other salons handle no-show deposits, with sources her partner can check. She revises an aftercare sheet for her stylists every quarter. Four questions sort the jobs. Is the work one-off or recurring? Does it stand alone, or does it need the same standing context (background information that stays the same) again and again? Is it consumed once, or revised and reused? Can Claude answer from what you supply, or must the answer be gathered from outside sources? Each feature exists for one kind of task."}, {"i": 141, "l": "3.1", "d": 3, "h": "Ordinary Chat Is the Default", "t": "A single question, a single draft or an analysis of a document attached during the chat needs no workspace, agentic search (Research, which builds a cited answer from several sources) or separate artifact window. Ordinary chat handles such a task immediately. Ordinary chat is the right choice more often than enthusiasts admit. The complaint reply is this kind of task."}, {"i": 142, "l": "3.1", "d": 3, "h": "Projects: Recurring Shared Context", "t": "A Project has two assets that persist across chats. Its instructions shape Claude's responses in every chat inside the workspace. Its knowledge base holds uploaded material Claude uses as background for those chats. You configure both assets once, and then both apply to every chat in the Project. The signal is a need for the same background documents, standing preferences and working material across many conversations. Re-pasting the same context into chat after chat is a Project's work done by hand. Projects exist to end that workaround. A Project would hold the price list and house style the salon owner re-pastes each week."}, {"i": 143, "l": "3.1", "d": 3, "h": "Research: Cited Multi-Source Synthesis", "t": "In Research, Claude works agentically. It runs multiple searches, and later searches use what earlier searches found. Its synthesised report includes citations so that the findings can be checked. The signals are a survey of a whole field, a brief on how others do something, and an overview of the current state. Another signal is an audience who will want to see where the findings came from. The deposit question fits Research. Research is not a quality upgrade for ordinary questions. A task answerable from material you already hold gains nothing from Research, because nothing needs gathering."}, {"i": 144, "l": "3.1", "d": 3, "h": "Artifacts: Work with Its Own Life", "t": "Claude creates an artifact when the output is significant, self-contained and likely to be edited, iterated on or reused outside the conversation. That last condition is the dominant signal: the work is used beyond the chat that produced it. Examples are a reference sheet revised every quarter and a plan that will be shared and updated. Each should exist as one evolving version, not as fragments scattered through a conversation history. You iterate an artifact in one of two ways. You ask Claude to change it, or you edit an earlier message. Editing an earlier message creates a branch of the chat with artifacts of its own. You can return to an artifact and share a finished one. The aftercare sheet fits this signal."}, {"i": 145, "l": "3.1", "d": 3, "h": "One Dominant Signal", "t": "Real work mixes the features. A Project can contain chats that produce artifacts. A Research report can be the basis of an artifact document that is revised each quarter. The salon's deposit report might be the basis of a deposit policy artifact."}, {"i": 146, "l": "3.1", "d": 3, "h": "In the exam", "t": "This objective tests whether you pick a feature by reading the task. The exam does not test the combinations. Each question presents one piece of work with one dominant signal: recurring context, multi-source citation, iterative deliverable or simple one-off. The wrong answers are always real features applied to the wrong kind of task. Do not dismiss ordinary chat, because the exam treats it as a right answer. When a question's dominant signal is a simple one-off, ordinary chat is the professional answer, however capable the other features are. The exam is willing to make the plainest option the right answer."}, {"i": 147, "l": "3.1", "d": 3, "h": "In the exam", "t": "Writing a Project's instructions and curating its knowledge base belong to Domain 5. In this objective, the exam tests whether you recognise the recurrence. Checking a Research report's citations belongs to Domain 2. Choosing between an inline answer, a table and a document is Domain 2's format question. In this objective, an artifact is the place for iterative, reusable work.\n[Key Concept] Find the dominant signal first, and then choose the feature that matches it. Recurring shared context means a Project. A cited multi-source answer means Research. An output that is revised and reused means an artifact. A self-contained one-off means ordinary chat."}, {"i": 148, "l": "3.1", "d": 3, "h": "Exam Traps", "t": "[Exam Trap] Treating an artifact as the place to keep standing context for new chats\nAn artifact is a container for one evolving output; it does not give new conversations standing context. A Project's instructions and knowledge base apply from the start of every chat, so nothing needs pasting in.\n[Exam Trap] Running everything through a Project or Research to maximise quality\nThe most elaborate feature is not the safest choice. A simple one-off gains nothing from a workspace or a multi-source report. Ordinary chat is a legitimate answer in this objective. The dominant signal decides, not the feature's prestige.\n[Exam Trap] Treating re-pasting the same context into every chat as diligence"}, {"i": 149, "l": "3.1", "d": 3, "h": "Exam Traps", "t": "The manual workaround repeats a Project's setup work every single time instead of once. When a scenario describes the same documents and preferences supplied chat after chat, the answer moves that work into a Project."}, {"i": 150, "l": "3.1", "d": 3, "h": "Practice Scenario", "t": "A parish council clerk has four pieces of work: the monthly agenda-and-minutes cycle that always needs the council's standing orders, member list and format conventions; a one-off briefing on how five nearby councils run allotment waiting lists, with sources the councillors can check; a single resident's question about a grant deadline; and an emergency-contacts sheet that is revised every quarter and shared with all members. She wants nothing more elaborate than each piece needs, no Project for work that never recurs, and nothing re-supplied by hand. Which plan matches feature to work?"}, {"i": 151, "l": "3.1", "d": 3, "h": "Practice Scenario", "t": "Option ARun everything in ordinary chat, pasting the standing orders and member list in each month and rebuilding the contacts sheet from the old conversation each quarter\nOption BA Project for the monthly agenda-and-minutes cycle, Research for the five-councils briefing, ordinary chat for the grant deadline question, and the contacts sheet built and revised as an artifact\nOption CCreate one Project holding all four pieces of work, since keeping every council task inside a single workspace is simpler than making a separate feature decision for each individual piece as it comes up"}, {"i": 152, "l": "3.1", "d": 3, "h": "Practice Scenario", "t": "Option DUse Research for both the allotments briefing and the grant deadline question, and publish every output as a shareable artifact so that all four pieces of council work carry the same maximum level of rigour\n[Check Answer]"}, {"i": 153, "l": "3.2", "d": 3, "h": "What You Need to Know", "t": "This objective names three model families: Haiku, Sonnet and Opus. Each family is a tier. The tiers make a real trade-off of speed and cost against depth of reasoning. The Haiku family is the lowest-cost tier. Anthropic lists it as the fastest and describes it as built for high-volume, latency-sensitive tasks. The Opus family is the most capable reasoning tier, for complex, high-stakes work. The Sonnet family offers the best combination of speed and intelligence: the balanced middle and the sensible everyday default. No tier is \"the good one\". Each tier is the right choice for work that matches its strengths."}, {"i": 154, "l": "3.2", "d": 3, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a florist that has two jobs for Claude. One is standardising three hundred product listings into one website template. The other is reconciling two wholesalers' reports that partly disagree into one ordering recommendation."}, {"i": 155, "l": "3.2", "d": 3, "h": "The Trade-Off", "t": "The most capable tier takes longer for each response. Your choice of model is one of the factors that determine how quickly a usage allowance is consumed. The fastest tier is fast because it is not built for the most demanding work. On Opus, every florist listing would take longer for no gain."}, {"i": 156, "l": "3.2", "d": 3, "h": "What Capability Means", "t": "Capability means depth on demanding work. That depth covers resolving ambiguity and contradiction, multi-step reasoning, synthesis across sources that partly disagree, and drafting where a subtle error has real consequences. Capability does not mean better at everything, so the top tier is not the universal choice. For routine, well-specified work, the lighter tiers (the faster, lower-cost ones) produce what the task needs, faster. The florist's listings are routine. The wholesaler recommendation is not routine.\nNever claim a lighter tier matches a heavier tier's quality on demanding work. The documentation does not claim it. Use a lighter tier because it fits the task and its output is reviewed, never because the quality is equal."}, {"i": 157, "l": "3.2", "d": 3, "h": "Reading the Signals in a Task", "t": "Lighter-tier signals are high volume, a routine and repetitive shape, simple transformation, speed that matters, and outputs that are individually low-stakes. Examples of simple transformation are reformatting, extracting or standardising. Those outputs are still spot-checked, because the review discipline from Domain 2 never stops. Signals for the most capable tier are ambiguity, contradiction to resolve, judgement with consequences and complex synthesis. Another signal is work where a wrong subtle conclusion costs more than the extra time. When neither set dominates, the balanced middle is the everyday answer."}, {"i": 158, "l": "3.2", "d": 3, "h": "Reading the Signals in a Task", "t": "Size does not decide the tier. The kind of work decides it. Standardising a long list of entries into one template is lighter-tier work however many rows it has. Reconciling two reports that partly disagree into a single recommendation is capable-tier work however short the final page is. The florist's listings go to a lighter tier, and a sample of them is checked. The one-page recommendation goes to Opus."}, {"i": 159, "l": "3.2", "d": 3, "h": "The Model Picker", "t": "You choose the model in the chat interface, not in technical configuration. Click the model name and choose another available model. You can change it at any point in a conversation, and the change applies from Claude's next response. The model picker shows the models your account has access to. That list varies by plan and, in workplaces, by what an organisation has enabled."}, {"i": 160, "l": "3.2", "d": 3, "h": "The Model Picker", "t": "So the tier decision is not a one-off commitment. Routine preparation can run on a lighter tier, and the hard synthesis can run on the most capable tier, inside one piece of work. The florist can extract each wholesaler's terms on Haiku, then switch to Opus for the recommendation. Never opening the model picker serves the average task. It serves both the routine end and the demanding end badly. A default model is a setting on your account, not a decision about your work."}, {"i": 161, "l": "3.2", "d": 3, "h": "In the exam", "t": "The guide names the three families. The objective exists because no tier suits every task. It tests whether you read a task's actual demands, not its prestige. That skill remains useful after any change to the set of models. In the guide's own sample question, the right answer for a high volume of short, routine drafts, where speed and cost matter more than deep reasoning, is the faster, lower-cost model. \"Always use the top model\" is a named wrong answer.\nChoosing by a project's importance"}, {"i": 162, "l": "3.2", "d": 3, "h": "In the exam", "t": "\"This project is important\" does not move a routine task to the top tier. Importance belongs to projects. Demands belong to tasks. The right answer is the tier that matches the current task. A routine reformat inside an important project is still a routine reformat.\nSpecific model names and the current line-up change over time and belong on the quick reference."}, {"i": 163, "l": "3.2", "d": 3, "h": "Exam Traps", "t": "[Exam Trap] Choosing the most capable model for everything because the work is important\nAlways using the top model wastes the cost and latency budget on work that does not need it. Routine high-volume work does not need depth, and a project's importance does not make every task inside it demanding.\n[Exam Trap] Sending work that plainly needs depth to the fastest tier because it is just writing\nThis saving costs more in the end. Quality demands depend on the cost of being wrong: a short output that carries judgement, contradiction or consequences is exactly where the extra time of the capable tier is worth it, however quick the typing would be.\n[Exam Trap] Accepting a claim that the lighter tier gives the same quality on demanding work"}, {"i": 164, "l": "3.2", "d": 3, "h": "Exam Traps", "t": "No documentation says a lighter tier matches a heavier one on demanding work; fitness for the task plus review justifies it. The exam guide reserves the most capable model for complex reasoning. Current docs (October 2026) advise moving up when top effort settings fall short."}, {"i": 165, "l": "3.2", "d": 3, "h": "Practice Scenario", "t": "A community energy co-operative employs one administrator, who has two jobs side by side: standardising six hundred member records into one address format, and drafting the co-op response to a complex regulatory consultation where three board members have given partly contradictory advice. She must keep spending on the routine job as low as she can, without risking the quality of the co-op's position. How should she assign models?\nOption AUse the most capable model for the member records, since data accuracy matters at that scale, and the fastest model for the consultation response, since a single letter is quick to produce"}, {"i": 166, "l": "3.2", "d": 3, "h": "Practice Scenario", "t": "Option BUse the fastest model for both jobs, since the records are routine and the consultation response is just plain drafting once all three board views are pasted in\nOption CUse the most capable model for both jobs, since the reputation of the co-op with all its members depends on this work and the best model maximises quality everywhere\nOption DRun the six hundred records on the fastest, lower-cost model and spot-check a sample, and draft the regulatory consultation response on the most capable model\n[Check Answer]"}, {"i": 167, "l": "3.3", "d": 3, "h": "What You Need to Know", "t": "Objective 3.2 taught what the tiers are. Every choice between them affects three things, which this lesson calls currencies: cost, speed and quality. Cost is the plan's usage allowance, not a per-use invoice. Speed is the wait for each response. You feel that wait most sharply across many runs. Quality is depth on demanding work, as objective 3.2 defines it: handling ambiguity, reconciling contradiction and making judgements safely. The skill is to name the currency that a task needs, and then to spend only that currency."}, {"i": 168, "l": "3.3", "d": 3, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a fish and chip shop. Its owner uses Claude for two jobs. One is five hundred review replies that vary only in a name and a dish. The other is one response to the council after a hygiene inspection."}, {"i": 169, "l": "3.3", "d": 3, "h": "Three Questions Name the Currency", "t": "Ask three questions in order. What does being wrong cost here? How many times will this run? Who is waiting for the answer? The answers name the currency. Without the answers, the choice is a feeling rather than a decision with named requirements. For the shop's replies, an error is cheap, the job runs five hundred times and nobody is waiting. For the hygiene response, an error is costly, the job runs once and the council is waiting."}, {"i": 170, "l": "3.3", "d": 3, "h": "Cost Means Your Usage Allowance", "t": "The Help Center lists model choice, effort level, current conversation length and file attachment size among the factors that determine how quickly usage is consumed. The allowance is finite, so every task that you overpay for takes allowance from the tasks that are still to come. Review replies on the heaviest model use allowance that the hygiene response needs."}, {"i": 171, "l": "3.3", "d": 3, "h": "Volume Multiplies Cost and Speed", "t": "If a job runs once, the difference between tiers is seconds and a very small part of the allowance. If it runs five hundred times, the same difference decides whether the job finishes today. It also decides whether the allowance lasts the week. High-volume routine work, like the review replies, belongs on the lighter tier.\nVolume work on a fast tier gets a sampled spot-check, because Domain 2's duty to verify never stops. The spot-check is sized to the job: the owner reads a sample of the replies. The fast tier plus the spot-check makes the choice professional rather than merely cheap."}, {"i": 172, "l": "3.3", "d": 3, "h": "Stakes Multiply Quality", "t": "Stakes act on a different currency: quality. Some single outputs are inputs to a decision with consequences, and they need depth. Such outputs include a regulatory submission, a legally sensitive letter and a recommendation that a board will act on. The seconds that a lighter tier saves are worth nothing against the cost of a subtly wrong conclusion. \"It is only one letter\" is true and irrelevant, because one letter with consequences demands more than five hundred letters without consequences. Quality requirements depend on the cost of being wrong, not the prestige of the task. Then a qualified human reviews the high-stakes output, whatever model drafted it. The hygiene response gets the capable tier and a qualified checker."}, {"i": 173, "l": "3.3", "d": 3, "h": "Split Mixed Workloads", "t": "Real workloads mix shapes. Split them by their demands rather than run everything at one setting. Put the routine bulk on the fast tier with sampled review. Put the difficult core on the capable tier with proper review. The model picker makes the split easy. You can change the model at any point in a conversation, and the change applies from the next response."}, {"i": 174, "l": "3.3", "d": 3, "h": "Split Mixed Workloads", "t": "Three wrong answers recur. The first is maximum quality everywhere. It spends depth on work that does not need it, and the waste grows with the volume. The second is minimum cost everywhere. It delivers shallow output on the work whose errors are expensive. The third is the escalation loop, which re-runs a disappointing output on heavier and heavier models. The loop treats a vague brief as a model problem, but a vague brief fails at every tier. Fixing the brief belongs to Domain 1, and no tier upgrade replaces that fix. If the hygiene brief never names its reader, every tier fails."}, {"i": 175, "l": "3.3", "d": 3, "h": "In the exam", "t": "Exam questions ask you to judge what a real task needs in the three currencies. In the guide's sample question, the right answer is a faster, lower-cost model for straightforward, high-volume drafting. The usual trap is a decision about stakes that is argued with reasons about volume.\n[Key Concept] Volume multiplies cost and speed. Stakes multiply quality. When a question mixes both kinds of work, the right answer almost always splits the workload. The bulk gets the fast tier plus sampled review. The piece that carries consequences gets the capable tier plus proper review."}, {"i": 176, "l": "3.3", "d": 3, "h": "Exam Traps", "t": "[Exam Trap] Justifying the fast tier on a high-stakes output because it is only one letter\nStakes, not volume, set the quality requirement. One output that informs a consequential decision needs more than hundreds of routine ones do, and the seconds saved by the lighter tier are worthless against the cost of a subtly wrong conclusion.\n[Exam Trap] Justifying the top tier on routine bulk because the work is important\nImportance does not transfer from a project to every task inside it. Routine transformation at volume needs speed and cost kept low, with a sampled check; using the most capable model hundreds of times over gives nothing the task needs.\n[Exam Trap] Escalating to a heavier model when the real defect is a vague brief"}, {"i": 177, "l": "3.3", "d": 3, "h": "Exam Traps", "t": "A vague brief fails at every tier, so each heavier re-run spends usage allowance and waiting time and still misses. Fixing the brief belongs to Domain 1. Check the brief before changing the model."}, {"i": 178, "l": "3.3", "d": 3, "h": "Practice Scenario", "t": "A regional athletics association is preparing its annual awards night: five hundred personalised invitation letters that vary only in name, club and event, and one difficult letter to a club being suspended for a safeguarding failure, where tone, precision and care about legal risk all matter. Spending on the invitations must stay as low as possible, and nothing that would make the suspension letter safer may be skimped. How should the administrator run the two jobs?\nOption ARun the five hundred invitations on the faster, lower-cost model and spot-check a sample, then draft the suspension letter on the most capable model with qualified human review before it is sent"}, {"i": 179, "l": "3.3", "d": 3, "h": "Practice Scenario", "t": "Option BDraft the suspension letter on the faster model to conserve usage, and if the tone misses, re-run the same prompt on the most capable model, repeating until an acceptable version of the letter finally appears\nOption CRun both jobs on the most capable model, since the awards night is the most important event of the association and nothing about it should look second-rate\nOption DRun both jobs on the faster model, since the invitations are obvious volume work and the suspension letter is only one letter, easily handled by any model\n[Check Answer]"}, {"i": 180, "l": "3.4", "d": 3, "h": "What You Need to Know", "t": "A conversation holds a finite working space. Everything said, attached and produced so far is what Claude is working with. Very long conversations approach the platform's length and usage limits, and longer ones consume more of the usage allowance. Separately, claude.ai has memory across chats. Chat search is prompted retrieval, where you ask Claude to find something in past conversations.\nThis lesson uses one made-up example throughout: a greengrocer who has planned the shop's Christmas veg boxes in one very long chat since August. The chat holds supplier choices, three abandoned box designs, the agreed contents and a much-revised price list."}, {"i": 181, "l": "3.4", "d": 3, "h": "What You Need to Know", "t": "When a conversation reaches its length limit, the official guidance gives two options. Start a new conversation, or use a Project to work with larger amounts of information. Treat a long conversation like a long meeting. Know that it will end, and decide what must remain after it ends."}, {"i": 182, "l": "3.4", "d": 3, "h": "The Three Moves", "t": "Restart when a piece of work is done, when the chat holds abandoned approaches and superseded drafts, or when it nears its limits. A marathon chat is a very long chat. It carries everything that has ever been in it, including the greengrocer's three abandoned designs. A clean start with exactly the right context is better than a marathon chat.\nSummarise before you leave the chat: have Claude summarise the decisions made, the current state and what remains. Then verify the summary yourself against the source records. The summary contains every uncorrected error from the chat that it summarises. The greengrocer verifies her summary against supplier emails and invoices. The verified summary becomes the new chat's opening brief."}, {"i": 183, "l": "3.4", "d": 3, "h": "The Three Moves", "t": "Persist any specific working output that the next conversation will need. Paste it into the next conversation, re-attach the file, or store it in Project knowledge, where every chat in the Project starts with it. A standing document that keeps being revised and shared has a fourth place: an artifact. In an artifact, you iterate on the document as one evolving version. The greengrocer pastes the agreed contents into the new chat. She makes the staff's weekly price list an artifact, and she stores the supplier list in Project knowledge."}, {"i": 184, "l": "3.4", "d": 3, "h": "What Memory Carries, and What It Does Not", "t": "Memory is built as a set of individual topics: your role, your projects, your communication preferences, your ongoing work context. It is context about you, not transcripts, drafts or attached documents. Each Project has its own memory. Inside a Project, Claude also uses your memory from chats outside Projects, but never another Project's memory. So memory saves you the work of introducing yourself again. Memory does not reliably carry an approved outline or a data file into the next chat. The greengrocer's new chat may know her shop, but the price list is in the new chat only because she persisted it."}, {"i": 185, "l": "3.4", "d": 3, "h": "What Memory Carries, and What It Does Not", "t": "Two out-of-date claims are wrong here, in opposite directions. One claim is that Claude cannot remember anything across chats. The other is that you can trust memory to carry a working document. Persisting a specific working output explicitly remains the dependable pattern."}, {"i": 186, "l": "3.4", "d": 3, "h": "In the exam", "t": "This objective tests planning, not repair of damage, and the exam expects you to be precise about what memory holds. Check the question's time frame. A planning question describes work organised for what comes next. Examples include a long piece of work approaching limits, a project entering its final phase and a handover being planned. The greengrocer's case is a planning case. A chat that already produces poor outputs, where you diagnose the problem after it has happened, belongs to Domain 7. The same marathon chat can appear in both kinds of question. The right answer follows the question that the scenario asks. Here the right answer is the proactive practice. Restart deliberately. Summarise, and verify the summary (Domain 2 does not stop at handover). Persist what the next conversation depends on."}, {"i": 187, "l": "3.4", "d": 3, "h": "In the exam", "t": "Nothing in the official guidance claims that the product degrades in long chats. No right answer relies on that claim. Rollout dates and plan availability are dated facts, and they are on this domain's quick reference.\nThe false belief that a new chat loses all context\n\"A new conversation would lose all our context\" is the best argument for the marathon chat, and it is false. A verified summary and persisted documents carry the context that is worth keeping into the new conversation. They do this at a fraction of the length and the usage."}, {"i": 188, "l": "3.4", "d": 3, "h": "Exam Traps", "t": "[Exam Trap] Relying on memory or chat search to carry a specific working output into a new chat\nMemory holds context about you as individual topics, not transcripts, drafts or attachments, and chat search is prompted retrieval. A working output the next conversation depends on is transferred by explicit persistence: paste it, re-attach it, or store it in Project knowledge.\n[Exam Trap] Pasting an unverified summary into the new conversation as the efficient handover\nThe summary contains every uncorrected error in the chat it summarises. Check it against the source records before the new chat relies on it, and paste agreed wording in word for word.\n[Exam Trap] Keeping everything in one enormous chat because a restart would lose the context"}, {"i": 189, "l": "3.4", "d": 3, "h": "Exam Traps", "t": "This is the habit of keeping one marathon chat, presented as continuity. The chat fills with superseded drafts and abandoned approaches alongside the decisions that matter, approaches length limits, and consumes more usage; summarising and persisting move everything worth keeping into the new chat."}, {"i": 190, "l": "3.4", "d": 3, "h": "Practice Scenario", "t": "A wedding coordinator has run one enormous conversation across three months of planning: venue decisions, the running order, the readings, corrections to names. The final month starts now, the chat is full of superseded detail, and the platform length limits are close. Some names and dates were corrected more than once, so any summary of the old chat may carry an outdated version. What is the best plan?\nOption AStart a fresh conversation and rely on memory and chat search to carry the seating plan and running order across, asking Claude to remember the planning details, including the corrected names and readings, before closing down the old three-month chat"}, {"i": 191, "l": "3.4", "d": 3, "h": "Practice Scenario", "t": "Option BHave Claude summarise decisions and open questions, verify that summary against the booking confirmations, open the final-month conversation from it, and move the seating plan and running order into artifacts and the standing documents into Project knowledge\nOption CAsk Claude for a summary of the planning so far and paste it straight into a new conversation, since Claude wrote the summary from the full history and it is the most reliable record available\nOption DKeep the single conversation going to the wedding day, since every decision lives in it, and a new conversation would lose three months of context\n[Check Answer]"}, {"i": 192, "l": "4.1", "d": 4, "h": "What You Need to Know", "t": "A requirement is a statement of what a piece of work must achieve. Use-case analysis is judging whether a task is a good candidate for Claude before you put any effort into it. A theme is a named group of related comments. The objective tests two related skills: using Claude to turn messy input into structured requirements, and use-case analysis. Every workflow decision in this domain starts with two questions: what does this work require, and does Claude belong in it at all? Both skills follow one rule: Claude structures, and the human validates and owns the result."}, {"i": 193, "l": "4.1", "d": 4, "h": "What You Need to Know", "t": "This lesson uses one made-up example throughout: a newsagent that runs home deliveries. The owner wants to rework her paper rounds. Her material is customer emails, staff meeting notes, order-book comments and remarks from the counter."}, {"i": 194, "l": "4.1", "d": 4, "h": "Structure from Mess", "t": "Real requirements arrive as complaint threads, meeting notes, survey comments and half-remembered conversations, never as a tidy list. The Help Center lists summarising long documents and conversations among Claude's core uses, alongside generating viewpoints and providing recommendations. Given the raw material, Claude clusters it into themes and separates what people asked for from what they appear to need. It also shows where two groups want incompatible things, and names what nobody mentioned."}, {"i": 195, "l": "4.1", "d": 4, "h": "Structure from Mess", "t": "For the newsagent, Claude might return themes like late papers and wrong magazines. It might flag that one estate wants papers before seven, while staff want later starts. The reading takes minutes instead of an afternoon, and the people involved get an outline of the problem that they can question."}, {"i": 196, "l": "4.1", "d": 4, "h": "A Theme Is a Hypothesis", "t": "Claude organises what you gave it. It has no way of knowing what your organisation needs. A theme that Claude names is a hypothesis about your input, not a finding about your business. The people whose requirements the theme describes must confirm it before anyone bases any design on it. Anthropic's AI Fluency framework divides the work in the same way. Discernment means evaluating what the AI produced. Diligence means staying accountable for the result. Both stay with the human.\nSo the owner checks the early-papers conflict with the estate's customers and her staff before she redraws any round. If she designed straight from Claude's themes, she would mistake tidy output for validated requirements. Confirming the themes is the cheap part."}, {"i": 197, "l": "4.1", "d": 4, "h": "The Shape of a Strong Candidate", "t": "Good Claude use cases share some recognisable features:\nThe work is mainly about language: drafting, summarising, reformatting, explaining, comparing. These are the tasks that the Help Center's use-case article documents.\nThe material needed is material you can provide.\nThe output can be checked by someone competent to check it.\nEither the volume is high or starting from nothing is the expensive part."}, {"i": 198, "l": "4.1", "d": 4, "h": "The Shape of a Strong Candidate", "t": "AI Fluency calls this judgement Delegation: deciding what work to hand to the AI. It treats Delegation as a separate skill, and that skill comes before anyone writes any prompt. Weak candidates have the opposite features. The work needs the authority to decide rather than the ability to draft. Or it depends on information Claude has no access to. Or it is relationship work rather than document work.\nAt the newsagent, a letter announcing new delivery times is a strong candidate: the owner can check it. Choosing who takes which round needs authority. Knowing whether a paper reached a doorstep needs information Claude lacks. Calling the regular customer who cancelled is relationship work."}, {"i": 199, "l": "4.1", "d": 4, "h": "The Checker Test", "t": "People skip one test in particular. It says: if you could not tell whether the answer was wrong, you are not ready to use Claude on that task. Without a checker, a wrong output passes as easily as a right one. High stakes are not a reason to abandon the work, and neither is a missing checker. Both mean that you find the person who can tell good output from bad output, and you put that person in the process."}, {"i": 200, "l": "4.1", "d": 4, "h": "The Checker Test", "t": "The test also splits the blank-cheque use case. A blank-cheque use case is the announcement that Claude will handle a whole category of work. A category mixes strong and weak candidates. The commitment to the whole category comes before the analysis that should have decided its scope. Handing Claude all the delivery admin would group the letter with the choice of who takes which round."}, {"i": 201, "l": "4.1", "d": 4, "h": "In the exam", "t": "The failure that the exam tests most often here is the skipped confirmation step. Whether and where the work suits Claude is this objective's question. How you then phrase the request is Domain 1's skill, and which product feature runs the work is Domain 3's skill.\n[Key Concept] When a 4.1 question ends with themes that Claude has just clustered, the right answer acts before design begins. It returns the themes to the people who own the requirements. The wrong options adopt the themes as findings, hand Claude the decision itself, or abandon the work because the stakes feel high."}, {"i": 202, "l": "4.1", "d": 4, "h": "Exam Traps", "t": "[Exam Trap] Adopting Claude's themes as validated findings because they arrived quickly and read plausibly\nA theme is a hypothesis about the input, not a finding about the business. Basing a design on unconfirmed structure builds the wrong thing. Take the themes back to the people whose requirements they are, and confirm them before design begins.\n[Exam Trap] Handing Claude the decision along with the analysis\nDecisions that belong to an accountable person or group stay with them. Claude structures the material and drafts what supports the decision, but choosing the policy, picking the winner or resolving the dispute is theirs.\n[Exam Trap] Excluding work from Claude as too important"}, {"i": 203, "l": "4.1", "d": 4, "h": "Exam Traps", "t": "Refusing to use Claude treats high stakes as if they were high risk. High stakes call for a competent checker in the process, not abandoning the drafting help. Without a checker, a wrong output passes as easily as a right one."}, {"i": 204, "l": "4.1", "d": 4, "h": "Practice Scenario", "t": "The manager of a Saturday street market has a folder of complaint emails and comments from traders about how pitches are allocated. She wants to establish what a fairer allocation approach must do before anyone designs one. Claude clusters the material into six themes, including a contradiction: regular traders believe casual traders get the best corner pitches, while casual traders describe those same corners as reserved for regulars. She has no time to work through the folder again herself. What should she do next?\nOption ATreat the themes as hypotheses about her input and take them back to the traders to confirm, starting with the contradiction, before any design work begins"}, {"i": 205, "l": "4.1", "d": 4, "h": "Practice Scenario", "t": "Option BSet the folder aside and re-read every email herself, since pitch allocation is too contentious for Claude to be involved at all\nOption CHand the allocation question over entirely: give Claude the pitch map and the trader list and ask it to produce the fairest possible allocation for next season\nOption DAdopt the six themes as the requirements document, since they come straight from the traders’ own words, and move on to designing the new allocation approach\n[Check Answer]"}, {"i": 206, "l": "4.2", "d": 4, "h": "What You Need to Know", "t": "Research gathers and synthesises outside material, so you start from material that already exists. Planning turns a goal into ordered steps. Process optimisation finds and fixes the step that slows a process. All three work the same way: Claude makes the first draft, and you make the decisions about it.\nThis lesson uses one made-up example throughout: an estate agency. Its manager uses Claude for all three: other agencies' valuation practice, an open-house weekend plan, and slow lettings."}, {"i": 207, "l": "4.2", "d": 4, "h": "Research at Two Scales", "t": "The product supports research at two scales, and the Help Center describes the difference. Web search suits straightforward factual queries that one or two lookups can answer. Research mode runs multiple searches that build on each other. It explores different angles of a question and addresses the open questions systematically. It returns cited findings and suits bigger multi-source jobs. At the agency, one lettings rule is a job for web search. A survey of valuation practice is a job for Research.\nThe value is coverage and speed. The limit is that anything important gets checked before anyone repeats it, whether it has citations or not. A citation shows where a finding came from, not that the finding is right."}, {"i": 208, "l": "4.2", "d": 4, "h": "Plans Are Built from Stated Constraints", "t": "Starting from Claude's first plan is better than starting from nothing. Claude is good at finding gaps in a plan. If you ask what a plan is missing, you get dependencies, sequencing problems and the step that everyone forgets."}, {"i": 209, "l": "4.2", "d": 4, "h": "Plans Are Built from Stated Constraints", "t": "Claude will also confidently make plans that omit constraints you never mentioned, because it does not know them. Examples are the one accessible entrance, the volunteer who cannot work Sundays and the double-booked room. Nothing in the output warns you that Claude built the plan without them. An unconstrained open-house plan might staff Sunday viewings with a negotiator who never works Sundays. The plan is wrong, but it looks correct. That makes it more dangerous than an obviously bad plan, because people are more likely to trust it."}, {"i": 210, "l": "4.2", "d": 4, "h": "Plans Are Built from Stated Constraints", "t": "This is easy to prevent. Anthropic's business prompt-engineering guidance says to treat Claude like an intern on its first day, with clear, explicit instructions and all the necessary detail. For a useful plan, put the real constraints in the brief, then ask for the assumptions that the plan rests on. When the plan states an assumption, you can read it and correct it."}, {"i": 211, "l": "4.2", "d": 4, "h": "The Optimisation Loop", "t": "Claude generates hypotheses about where a process is slow, fragile or duplicated. It cannot tell you which one is true, because it has never watched your process run. Data decides which hypothesis is true. The loop has four steps:\nDescribe the process and its constraints.\nAsk for candidate bottlenecks, and for the evidence that would confirm each one.\nCollect that evidence.\nChange the step that the evidence identifies.\nEvidence comes after Claude names the hypotheses, so you know what you are looking for. Evidence comes before anything changes, so the change has a target. For the agency's lettings, Claude might suggest slow referencing or late landlord sign-off. The stage dates in the agency's own files decide between them."}, {"i": 212, "l": "4.2", "d": 4, "h": "The Optimisation Loop", "t": "The same guidance advises approaching the work like a scientist, and testing and iterating often. It also advises pairing prompt work with the organisation's own subject-matter experts rather than trusting either alone."}, {"i": 213, "l": "4.2", "d": 4, "h": "The Wrong Bottleneck", "t": "The most expensive mistake is optimising a step that was never the constraint. It wastes the budget on a step that was working, and people are then less willing to try another change. It usually comes from treating the most plausible hypothesis as the confirmed one. The cause that looks most likely is often the real one, so it is tempting to act without evidence. But the likely cause is wrong often enough to make this expensive. Collecting the evidence that shows the real cause usually needs a day's work. Suppose the dates show that landlord sign-off causes the delay. If the agency buys faster referencing, it spends its money and the delay remains."}, {"i": 214, "l": "4.2", "d": 4, "h": "In the exam", "t": "The exam tests your judgement, not Claude's first draft. Every right answer in this objective either supplies the facts Claude could not know or checks something before acting. Every wrong option that recurs treats a fluent output as a finished one. Domain 3 covers which feature does the research. This objective tests the practice around that feature. Checking findings before repeating them belongs to Domain 2.\nHow to spot the right answer\nIn this objective's questions, the right answer checks the evidence before changing anything: last season's timings, the usage records, the complaint log. The wrong options redesign the process based on reasoning that sounds convincing, or choose a bigger feature when local facts were missing."}, {"i": 215, "l": "4.2", "d": 4, "h": "Exam Traps", "t": "[Exam Trap] Treating a plausible, well-structured plan as a checked one\nClaude confidently makes plans that ignore constraints it was not told, and nothing in the output warns you. The plan looks correct but is wrong. Put the real constraints in the brief, then ask for the assumptions it is based on.\n[Exam Trap] Changing the process because of the best-sounding hypothesis\nClaude's candidate bottlenecks are hypotheses; it has never watched the process run. Acting on the most plausible one can spend money on a step that was fine. Get the evidence that would confirm each one, then change the step that the evidence identifies.\n[Exam Trap] Substituting more research for local evidence"}, {"i": 216, "l": "4.2", "d": 4, "h": "Exam Traps", "t": "Citations from elsewhere cannot say which cause is true in your process. Research mode suits bigger multi-source jobs, but the deciding evidence here is the process's own data. Pull that data before changing anything."}, {"i": 217, "l": "4.2", "d": 4, "h": "Practice Scenario", "t": "A city bike-hire scheme's coordinator keeps hearing that commuter-belt docking stations are empty by eight in the morning. She describes the scheme to Claude, which suggests four plausible causes: the overnight rebalancing round finishes too early, two residential stations feed the same office cluster, weekend maintenance keeps bikes off the road on Mondays, and riders arriving at full stations cycle on with the bikes. Only her own scheme's figures will show which cause is the real one, and she will act on none of them until they do. What is the professional next step?\nOption AAdd a second morning rebalancing round straight away, since the first cause Claude listed is the most plausible one and the mornings are when the complaints arrive"}, {"i": 218, "l": "4.2", "d": 4, "h": "Practice Scenario", "t": "Option BAsk Claude what evidence would confirm or rule out each cause, then pull the scheme’s trip and docking data before changing anything at all\nOption CRun the same question again in Research mode so that the four candidate causes come back supported by citations from other cities’ bike schemes\nOption DAsk Claude to redesign the docking network around commuter flows, treating the empty morning stations as sufficient evidence that the current layout has failed\n[Check Answer]"}, {"i": 219, "l": "4.3", "d": 4, "h": "What You Need to Know", "t": "Solution iteration means improving a deliverable over several rounds, with Claude as the drafting partner. In this certification a solution is a process, a template, a piece of guidance, a scheme, a service design, a form or a plan. It is never software. Each round is checked against a criterion: a test drawn from the requirement established in 4.1.\nThis lesson uses one made-up example throughout: a coffee shop whose owner wants a Saturday opening checklist for one barista working alone. The requirement says who the checklist is for and which problems it must handle, such as a late milk delivery. Claude's first draft is workable."}, {"i": 220, "l": "4.3", "d": 4, "h": "Why the Loop Is Worth Running", "t": "Iteration used to be expensive, so people defended their first draft. The cost of an alternative was the reason not to look at one. Claude changes this cost. A second and third version cost minutes, so you can afford to look at them. Comparing three concrete options is a better way to design than arguing about one. The owner's question changes from whether the checklist is good to which version meets the requirement. This change of question is the purpose of this objective. The change only works while the versions stay disposable. You can discard a cheap draft with no formality, and you can honestly test a version that nobody personally prefers."}, {"i": 221, "l": "4.3", "d": 4, "h": "One Named Criterion per Round", "t": "Every round needs a named criterion from the requirement. The named criterion separates iteration from random small changes. \"Make it better\" produces something different, not something better. Without new information, the revision has no target. For the same reason, the Help Center's remedy for an unhelpful answer is specific feedback rather than a plain retry. \"Make this survive a wet day\" is a testable change."}, {"i": 222, "l": "4.3", "d": 4, "h": "One Named Criterion per Round", "t": "Run each round against one criterion. Check the result against that criterion alone. Keep the version that passes. The owner asks for a checklist that still works when the milk delivery is late, then checks only that. You can rank two versions that you judge against the same test. When people judge two versions on overall feel, they just argue about them. Anthropic's AI Fluency course names this cycle the Description-Discernment Loop: describe what you need, evaluate what Claude returned, refine, and repeat."}, {"i": 223, "l": "4.3", "d": 4, "h": "Knowing When to Stop", "t": "Stop when the remaining changes are matters of preference rather than fitness (how well the deliverable meets the requirement). Polishing a deliverable that already meets the requirement uses time that the next problem needed. Polishing also risks a subtler failure: a fluent, confident version can replace the one that your actual users needed. So check against the requirement and the users, never against how the prose reads."}, {"i": 224, "l": "4.3", "d": 4, "h": "Knowing When to Stop", "t": "If a round shows that the requirement itself was wrong, the next step is to revisit the requirement, not to write another draft. No revision fixes a deliverable that is built for the wrong requirement. Suppose the owner learns that two staff open on Saturdays. The requirement needs rewriting before any further draft. Whichever way the loop ends, state the stopping reason in one line. Naming the reason keeps the loop honest the next time it runs."}, {"i": 225, "l": "4.3", "d": 4, "h": "Artifacts and Branches", "t": "In the product, this loop uses artifacts. Substantial, standalone content appears in its own dedicated window. You revise the artifact by asking Claude to change it. To compare two concrete options, edit the message that produced the draft. The edit creates a different version of the chat, called a branch. The new branch has its own artifacts. The original branch keeps the first draft intact. The owner gets a second checklist without losing the first. Comparing two branches is better than trusting your memory of the round before, because memory makes whichever version came last seem better. Keep the requirement visible while you compare. The branches show the versions, but only the requirement says which version is better."}, {"i": 226, "l": "4.3", "d": 4, "h": "In the exam", "t": "Candidates most often confuse this objective with Domain 1. Iterating the prompt to get a better response is Domain 1.3. Iterating the solution, with Claude as the drafting partner, is 4.3: the same loop, run on a different object.\n[Key Concept] When a 4.3 question shows a workable first draft, the right answer names one criterion drawn from the requirement and checks the revision against it. Wrong options make changes without a criterion, generate many drafts and pick the one that feels best, or put an untested draft into live use. When the question signals that the requirement itself is wrong, the right answer revisits the requirement."}, {"i": 227, "l": "4.3", "d": 4, "h": "Exam Traps", "t": "[Exam Trap] Round after round of asking Claude to make it better with no named criterion\nEach round produces a different version, none of them checkably better, because no criterion directs the revision. Name one criterion drawn from the requirement and test the result against it.\n[Exam Trap] Redrafting a deliverable whose requirement was wrong\nNo amount of revision fixes a deliverable built for the wrong requirement. When a round shows the requirement itself has failed, go back to the requirement from 4.1 and rework it before any further draft.\n[Exam Trap] Letting the best-written version replace the one that meets the requirement"}, {"i": 228, "l": "4.3", "d": 4, "h": "Exam Traps", "t": "A well-written version does not always meet the requirement. Versions are checked against the requirement and the users, not against each other's prose, and the warm, confident draft that misses a hard constraint is precisely the version the exam expects you to reject."}, {"i": 229, "l": "4.3", "d": 4, "h": "Practice Scenario", "t": "The party coordinator at a laser-tag arena is designing the running order for a new birthday-party package. The requirement is fixed: ages seven to eleven, a safety briefing before anyone plays, food in the party room, all inside a ninety-minute slot. Claude's first draft is workable. She wants round two to give her a version she can plainly pass or fail, before any real party relies on it. What should round two look like?\nOption AUse the draft at this weekend’s parties exactly as written, treating the live sessions as the test round and adjusting it afterwards\nOption BAsk Claude to make the running order more fun and more polished, and keep regenerating until a version feels right"}, {"i": 230, "l": "4.3", "d": 4, "h": "Practice Scenario", "t": "Option CStart a fresh chat for each draft and collect five alternative running orders, then choose whichever of the five reads best overall\nOption DRevise against one named criterion, say handling a party that arrives fifteen minutes late, and check the result against that criterion alone\n[Check Answer]"}, {"i": 231, "l": "4.4", "d": 4, "h": "What You Need to Know", "t": "In this certification, integration is about two questions. Where in an existing process does a person bring work to Claude? Does the process stay the same? Integration never means a technical connection between systems. To augment is to give Claude one slow step. To redesign is to change the process itself. To escalate is to pass work beyond the Associate's role to someone else.\nThis lesson uses one made-up example throughout: a dry cleaner. Every Monday its manager prepares a write-up of last week's damage claims. Customers who leave garments uncollected get a reminder letter."}, {"i": 232, "l": "4.4", "d": 4, "h": "Augment: One Step, Done Better", "t": "When Claude does the slow step, everything else stays the same. The write-up takes ten minutes instead of an hour. The manager still owns the write-up, and nobody else's job changes. So augmentation is cheap, reversible and easy to explain to colleagues. If augmentation fails, the manager does the write-up by hand again. Augmentation is the right choice far more often than the ambitious alternative. Most successful integrations for an Associate improve one step."}, {"i": 233, "l": "4.4", "d": 4, "h": "Redesign: Pilot First", "t": "In a redesign the process changes because the constraint that decided how the process works has gone. Personalising a reminder letter used to cost twenty minutes, so the dry cleaner sent one generic letter. When a personalised letter costs two minutes, a tiered approach that nobody would have proposed becomes possible."}, {"i": 234, "l": "4.4", "d": 4, "h": "Redesign: Pilot First", "t": "Redesign is rarer and bigger, so a redesign gets a pilot before a rollout. Anthropic's enterprise deployment guidance stages adoption this way. A pilot group is monitored for feedback over a period of weeks before wider expansion. Champions are identified per team. The dry cleaner tries tiered letters on one batch first. An all-at-once rollout measures nothing. It leaves nothing to compare against, and it risks everything at once."}, {"i": 235, "l": "4.4", "d": 4, "h": "The Human Gate", "t": "Find the step where the decision happens. Keep a person on that step. Integrations fail when the checking step is removed. Checking has no visible output, so it looks like waste to anyone redesigning from a diagram. The dry cleaner's manager signs each letter before the letter is sent. This signing step is the human gate. The gate also makes augmentation safe to adopt quickly. The person who always signed the letters still signs them, so a person still makes the judgement in the process."}, {"i": 236, "l": "4.4", "d": 4, "h": "The Associate's Boundary", "t": "Some requests are outside this role because they need a technical implementation. A technical implementation means systems that communicate with each other, data that moves on its own, or a process built to run with nobody present. Suppose the owner wants reminders sent overnight, straight from the till system. That request means connecting the till system to whatever sends the letters. This connection is technical work. The professional action is to escalate the request to a Claude Developer or Architect, with a clear written description of what the process needs. Describing the need well is itself the Associate's contribution. Escalation is no failure. Escalation shows that you know the limits of your own job."}, {"i": 237, "l": "4.4", "d": 4, "h": "The Associate's Boundary", "t": "Connectors let Claude retrieve data and take actions in connected services. Connectors operate inside a conversation, when a person's requests need them. The Google Workspace documentation states that Claude only accesses your data when you explicitly ask a question or request an action requiring it. The features this exam covers include chat, Projects, research, artifacts and connectors. Within these features, work starts when a person asks for it."}, {"i": 238, "l": "4.4", "d": 4, "h": "The Associate's Boundary", "t": "Current state (checked 14 October 2026): Claude Cowork, which the exam guide does not name, has scheduled tasks. Anthropic's Cowork course says a task that only uses your connectors can run remotely at its set time. On the exam, the Associate still escalates a request for work that runs by itself. This is because the exam treats such a request as a technical implementation beyond this role."}, {"i": 239, "l": "4.4", "d": 4, "h": "Where Recurring Work Lives", "t": "Recurring work belongs in a Project, not in one conversation that grows longer and longer. A Project is a s
